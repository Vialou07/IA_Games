<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qui est-ce ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0 14px;}
  @media(min-width:420px){.board{grid-template-columns:repeat(6,1fr);}}
  .card{position:relative;background:var(--panel);border:1px solid rgba(200,170,110,.35);
    clip-path:polygon(10% 0,90% 0,100% 12%,100% 88%,90% 100%,10% 100%,0 88%,0 12%);
    padding:4px 4px 6px;text-align:center;cursor:pointer;transition:transform .1s ease;}
  .card:active{transform:scale(.93);}
  .card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--panel2);}
  .card .badge{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:1rem;color:#04211E;}
  .card .cname{font-size:.58rem;margin-top:4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card.chosen{border-color:var(--accent);box-shadow:0 0 12px rgba(10,200,185,.5);}
  .card.chosen::after{content:"✓";position:absolute;top:1px;right:5px;color:var(--accent);font-weight:900;font-size:.85rem;}
  .card.eliminated .thumb,.card.eliminated .badge{filter:grayscale(1) brightness(.35);}
  .card.eliminated .cname{color:var(--dim);}
  .card.eliminated::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 46%,var(--danger) 48%,var(--danger) 52%,transparent 54%);opacity:.85;}
  .sticky-actions{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--void) 30%);
    padding:14px 0 4px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">‹</a><div class="rune"></div><h1>Qui est-ce ?</h1><div class="rune"></div></div>
<div class="wrap" id="wrap"></div>
<footer class="note">Portraits LoL : Data Dragon (Riot Games) · sprites Pokémon : PokeAPI. Non affilié.</footer>
<div id="modal-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="net.js"></script>
<script src="themes.js"></script>
<script>
(function(){
  const GAME = "qec", BOARD_SIZE = 24;
  const T = THEMES.quiestce, META = THEMES.meta;
  const wrap = document.getElementById("wrap");
  const PALETTE = ["#C8AA6E","#0AC8B9","#E15A4C","#8B7FD1","#5B9BD5","#D98B4A","#6FBF73","#D65D8C"];
  const colorFor = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*17+s.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; };
  const initials = n => n.replace(/['.]/g,"").split(/\s+/).map(w=>w[0]).filter(Boolean).join("").slice(0,2).toUpperCase();

  // état
  let theme = null, board = [];        // board = [{name, img|null}]
  let mySecret = null, oppSecret = null, oppReady = false;
  let myElim = new Set(), myAttempts = 0, oppAttempts = 0;
  let pendingGuess = false, over = false, solo = null;

  function buildBoard(themeKey){
    const pool = T[themeKey].chars;
    const idx = UI.shuffle(pool.map((_,i)=>i)).slice(0, BOARD_SIZE);
    return idx.map(i => ({
      name: pool[i],
      img: T[themeKey].img ? T[themeKey].img(pool[i], i) : null,
    }));
  }

  // ── rendu générique d'écran (efface tout, une seule chose à la fois) ──
  function screen(html){ wrap.innerHTML = `<div class="screen active">${html}</div>`; window.scrollTo(0,0); }
  function stepper(n, total){
    return `<div class="step-label">Étape ${n} sur ${total}</div>
      <div class="stepper">${Array.from({length:total},(_,i)=>`<div class="dot${i<n?" on":""}"></div>`).join("")}</div>`;
  }
  const $ = id => document.getElementById(id);

  function cardEl(c, opts){
    const card = document.createElement("div");
    card.className = "card";
    if (opts.elim && opts.elim.has(c.name)) card.classList.add("eliminated");
    if (opts.chosen === c.name) card.classList.add("chosen");
    if (c.img){
      const img = document.createElement("img");
      img.className="thumb"; img.loading="lazy"; img.alt=c.name; img.src=c.img;
      img.onerror = () => { img.replaceWith(badge()); };
      card.appendChild(img);
    } else card.appendChild(badge());
    function badge(){
      const b = document.createElement("div");
      b.className="badge"; b.style.background=colorFor(c.name); b.textContent=initials(c.name);
      return b;
    }
    const l = document.createElement("div"); l.className="cname"; l.textContent=c.name;
    card.appendChild(l);
    if (opts.onClick) card.addEventListener("click", ()=>opts.onClick(c, card));
    return card;
  }
  function boardHtml(container, opts){
    container.innerHTML="";
    board.forEach(c => container.appendChild(cardEl(c, opts)));
  }

  /* ═══════════ ÉCRANS ═══════════ */

  function sHome(){
    over=false; pendingGuess=false; mySecret=null; oppSecret=null; oppReady=false;
    myElim=new Set(); myAttempts=0; oppAttempts=0; solo=null; Net.destroy();
    screen(`
      <div class="center">
        <div class="eyebrow">2 joueurs</div>
        <h2 class="big">Devine le personnage secret de ton adversaire</h2>
        <p class="sub">Questions oui/non à voix haute, élimination de portraits, et le premier qui trouve gagne.</p>
        ${stepper(1,4)}
        <p class="sub" style="margin-bottom:10px;"><b>Vous jouez comment ?</b></p>
        <div class="choice-col">
          <button class="choice accent" id="c-net"><div class="c-title">📱📱 Chacun son téléphone</div><div class="c-sub">Vous êtes chacun sur votre tel — un code à partager, tout se synchronise.</div></button>
          <button class="choice" id="c-solo"><div class="c-title">📱 Tous sur ce téléphone</div><div class="c-sub">On se passe le téléphone à tour de rôle.</div></button>
        </div>
      </div>`);
    $("c-net").onclick = sNetChoice;
    $("c-solo").onclick = () => sTheme(t => { theme=t; board=buildBoard(t); soloSelect(0); });
  }

  function sNetChoice(){
    screen(`
      <div class="center">
        ${stepper(2,4)}
        <p class="sub" style="margin-bottom:10px;"><b>L'un de vous deux crée la partie, l'autre la rejoint.</b></p>
        <div class="choice-col">
          <button class="choice accent" id="c-create"><div class="c-title">➕ Créer la partie</div><div class="c-sub">Tu obtiens un code à donner à ton pote.</div></button>
          <button class="choice" id="c-join"><div class="c-title">🔑 Rejoindre</div><div class="c-sub">Ton pote t'a donné un code ? C'est ici.</div></button>
        </div>
        <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="c-back">Retour</button></div>
      </div>`);
    $("c-create").onclick = sCreate;
    $("c-join").onclick = sJoin;
    $("c-back").onclick = sHome;
  }

  function sCreate(){
    screen(`
      <div class="center">
        ${stepper(3,4)}
        <div class="eyebrow">Partie créée</div>
        <h2 class="big">Donne ce code à ton pote</h2>
        <div class="code-box" id="room-code">····</div>
        <p class="sub">Sur son téléphone : même lien → Qui est-ce ? → <b>Chacun son téléphone</b> → <b>Rejoindre</b> → il tape ce code.</p>
        <div class="status" id="wait-status">En attente de sa connexion…</div>
      </div>`);
    Net.create(GAME, {
      onOpen: code => { const el=$("room-code"); if(el) el.textContent=code; },
      onData: (id, d) => {
        if (d && d.t === "hello"){
          if (Net.peersCount() > 1) { Net.sendTo(id, { t:"full" }); return; }
          sThemeHost();
        } else netData(id, d);
      },
      onLeave: () => { if(!over) UI.banner("Ton adversaire s'est déconnecté.", true, 6000); },
      onError: () => UI.banner("Erreur de connexion. Recharge la page.", true, 6000),
    });
  }

  function sJoin(){
    screen(`
      <div class="center">
        ${stepper(3,4)}
        <div class="eyebrow">Rejoindre</div>
        <h2 class="big">Tape le code de ton pote</h2>
        <input class="field code" id="join-code" maxlength="4" autocapitalize="characters" placeholder="XXXX">
        <div class="status warn" id="join-err" style="display:none;"></div>
        <div class="btn-row">
          <button class="btn ghost" id="j-back">Retour</button>
          <button class="btn primary" id="j-go" disabled>Rejoindre</button>
        </div>
      </div>`);
    $("join-code").addEventListener("input", e => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
      $("j-go").disabled = e.target.value.length !== 4;
    });
    $("j-back").onclick = sNetChoice;
    $("j-go").onclick = () => {
      $("j-go").disabled = true;
      Net.join(GAME, $("join-code").value, {
        onOpen: () => {
          Net.send({ t:"hello" });
          screen(`<div class="center">${stepper(4,4)}<div class="eyebrow">Connecté !</div>
            <h2 class="big">Ton pote choisit le thème…</h2>
            <p class="sub">Ça démarre dans quelques secondes.</p></div>`);
        },
        onData: netData,
        onLeave: () => { if(!over) UI.banner("L'hôte s'est déconnecté.", true, 6000); },
        onError: () => {
          const e1=$("join-err"), g=$("j-go");
          if(e1){ e1.textContent="Impossible de rejoindre. Vérifie le code et que ton pote est bien sur l'écran du code."; e1.style.display="block"; }
          if(g) g.disabled=false;
        },
      });
    };
  }

  function themeButtons(onPick){
    return { html: `<div class="theme-grid">${Object.keys(META).map(k =>
        `<button class="theme-btn" data-th="${k}"><span class="t-emoji">${META[k].emoji}</span>${META[k].label}</button>`).join("")}
      </div>`,
      bind(){ document.querySelectorAll(".theme-btn").forEach(b => b.onclick = () => onPick(b.dataset.th)); } };
  }

  function sTheme(onPick){
    const tb = themeButtons(onPick);
    screen(`<div class="center">${stepper(2,4)}
      <div class="eyebrow">Thème</div><h2 class="big">Choisissez le thème</h2>
      <p class="sub">Le plateau est tiré au hasard à chaque partie — aucune partie ne se ressemble.</p>
      ${tb.html}
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="t-back">Retour</button></div></div>`);
    tb.bind(); $("t-back").onclick = sHome;
  }

  function sThemeHost(){
    const tb = themeButtons(t => {
      theme = t; board = buildBoard(t);
      Net.broadcast({ t:"start", theme, board });
      netSelect();
    });
    screen(`<div class="center">${stepper(4,4)}
      <div class="eyebrow">Adversaire connecté ✓</div><h2 class="big">Choisis le thème</h2>
      <p class="sub">Le plateau (24 personnages tirés au hasard) sera le même pour vous deux.</p>
      ${tb.html}</div>`);
    tb.bind();
  }

  /* ── sélection du secret (commun net/solo) ── */
  function selectScreen(title, sub, onConfirm, backFn){
    screen(`
      <div style="text-align:center;padding-bottom:4px;">
        <span class="pill">${title}</span>
        <p class="sub" style="margin-bottom:6px;">${sub}</p>
      </div>
      <div class="board" id="sel-board"></div>
      <div class="sticky-actions"><button class="btn primary" id="sel-ok" disabled>C'est mon personnage secret</button></div>`);
    let temp=null;
    boardHtml($("sel-board"), { onClick:(c, el)=>{
      temp=c.name;
      $("sel-board").querySelectorAll(".card").forEach(x=>x.classList.remove("chosen"));
      el.classList.add("chosen");
      $("sel-ok").disabled=false;
    }});
    $("sel-ok").onclick = () => { if(temp) onConfirm(temp); };
  }

  /* ── plateau de jeu ── */
  function playScreen(pillText, statusText, extra){
    screen(`
      <div style="text-align:center;padding-bottom:2px;">
        <span class="pill">${pillText}</span>
        <div class="status" id="play-status">${statusText}</div>
        <div class="status" id="play-sub" style="margin-top:-4px;">${extra||""}</div>
      </div>
      <div class="board" id="play-board"></div>
      <div class="sticky-actions">
        <button class="btn danger" id="b-guess">💡 Proposer un personnage</button>
        <button class="btn ghost" id="b-turn" style="display:none;">Terminer mon tour ➜</button>
      </div>`);
  }

  function guessModal(onPick){
    const root = document.getElementById("modal-root");
    const ov = document.createElement("div");
    ov.className="modal-backdrop";
    ov.innerHTML = `<div class="modal">
      <div class="eyebrow" style="margin-bottom:8px;">Ta proposition</div>
      <h3 style="font-size:1rem;">Touche le personnage que tu penses être le secret adverse</h3>
      <div class="board" id="g-board" style="max-height:44vh;overflow-y:auto;margin-top:8px;"></div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost" id="g-cancel">Annuler</button>
        <button class="btn danger" id="g-ok" disabled>Je valide</button>
      </div></div>`;
    root.appendChild(ov);
    let sel=null;
    const gb = ov.querySelector("#g-board");
    board.forEach(c => gb.appendChild(cardEl(c, { onClick:(cc, el)=>{
      sel=cc.name;
      gb.querySelectorAll(".card").forEach(x=>x.classList.remove("chosen"));
      el.classList.add("chosen");
      ov.querySelector("#g-ok").disabled=false;
    }})));
    ov.querySelector("#g-cancel").onclick=()=>ov.remove();
    ov.querySelector("#g-ok").onclick=()=>{ ov.remove(); if(sel) onPick(sel); };
  }

  function endScreen(title, eyebrow, mine, theirs){
    over = true;
    const rv = n => {
      const c = board.find(x=>x.name===n) || {name:n, img:null};
      const visual = c.img ? `<img src="${c.img}" onerror="this.style.display='none'" style="width:84px;height:84px;object-fit:cover;border:2px solid var(--gold);display:block;margin:8px auto 4px;">`
        : `<div style="width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:#04211E;background:${colorFor(c.name)};border:2px solid var(--gold);margin:8px auto 4px;">${initials(c.name)}</div>`;
      return visual + `<div style="font-size:.8rem;text-align:center;">${UI.esc(c.name)}</div>`;
    };
    screen(`<div class="center">
      <div class="eyebrow">${eyebrow}</div>
      <h2 class="big">${title}</h2>
      <div style="display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:14px 0 20px;">
        <div><div class="pill">Ton secret</div>${rv(mine)}</div>
        <div><div class="pill">Secret adverse</div>${rv(theirs)}</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="b-again">Rejouer</button>
        <a class="btn ghost" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;">Autres jeux</a>
      </div></div>`);
    $("b-again").onclick = () => location.reload();
  }

  /* ═══ MODE 2 TÉLÉPHONES ═══ */
  function netSelect(){
    selectScreen("Ton personnage secret", "Personne d'autre ne doit voir ton écran. Touche un portrait puis confirme.", name => {
      mySecret = name;
      sendMsg({ t:"ready" });
      netPlay();
    });
  }
  function netPlay(){
    playScreen("Ton plateau", "", "");
    refreshNetStatus();
    boardHtml($("play-board"), { elim: myElim, onClick:(c, el)=>{
      if (myElim.has(c.name)) { myElim.delete(c.name); el.classList.remove("eliminated"); }
      else { myElim.add(c.name); el.classList.add("eliminated"); }
    }});
    $("b-guess").onclick = () => {
      if (over || pendingGuess) return;
      if (!oppReady) { UI.banner("Ton adversaire n'a pas encore choisi son secret.", true); return; }
      guessModal(name => { pendingGuess=true; sendMsg({ t:"guess", name }); });
    };
  }
  function refreshNetStatus(){
    const s=$("play-status"), s2=$("play-sub");
    if(!s) return;
    s.textContent = oppReady ? "✓ Adversaire prêt — posez vos questions à voix haute, barrez au fur et à mesure." : "⏳ Ton adversaire choisit encore son secret…";
    s.className = "status" + (oppReady ? " ok" : "");
    if (s2) s2.textContent = `Propositions — toi : ${myAttempts} · lui : ${oppAttempts}`;
  }
  function sendMsg(o){ Net.isHost() ? Net.broadcast(o) : Net.send(o); }
  function netData(_, d){
    if (!d || !d.t) return;
    if (d.t === "full"){ UI.banner("Partie déjà complète (2 joueurs max).", true, 6000); Net.destroy(); sHome(); }
    if (d.t === "start"){ theme=d.theme; board=d.board; netSelect(); }
    if (d.t === "ready"){ oppReady=true; refreshNetStatus(); }
    if (d.t === "guess"){
      oppAttempts++;
      const ok = d.name === mySecret;
      sendMsg({ t:"verdict", name:d.name, correct: ok, secret: ok ? mySecret : null });
      if (ok) endScreen("Ton adversaire a trouvé ton secret.", "Défaite", mySecret, oppSecret || "?");
      else { UI.banner(`Proposition adverse : ${d.name} — raté pour lui !`, false, 5000); refreshNetStatus(); }
    }
    if (d.t === "verdict"){
      pendingGuess=false; myAttempts++;
      if (d.correct){ oppSecret=d.name; sendMsg({ t:"reveal", secret: mySecret }); endScreen("Tu as trouvé le personnage secret !", "Victoire", mySecret, d.name); }
      else { UI.banner(`${d.name} : ce n'est pas le bon. (-1 essai)`, true, 4500); refreshNetStatus(); }
    }
    if (d.t === "reveal"){
      // le gagnant révèle son secret au perdant pour l'écran de fin
      if (over) { /* déjà affiché avec ? */ }
      oppSecret = d.secret;
      if (over) endScreen("Ton adversaire a trouvé ton secret.", "Défaite", mySecret, oppSecret);
    }
  }

  /* ═══ MODE 1 TÉLÉPHONE ═══ */
  function soloSelect(p){
    if (!solo) solo = { secrets:[null,null], elims:[new Set(), new Set()], turn:0 };
    handoff(`Téléphone à Joueur ${p+1}`, "L'autre joueur détourne les yeux.", () => {
      selectScreen(`Joueur ${p+1} — ton personnage secret`, "Touche un portrait puis confirme. L'autre ne regarde pas !", name => {
        solo.secrets[p] = name;
        if (p === 0) soloSelect(1);
        else handoff("C'est parti — Joueur 1 commence", "Les deux secrets sont enregistrés.", soloTurn);
      });
    });
  }
  function handoff(title, sub, next){
    screen(`<div class="center">
      <div class="eyebrow">Passe le téléphone</div>
      <h2 class="big">${title}</h2>
      <p class="sub">${sub}</p>
      <div class="btn-row"><button class="btn primary" id="h-go">✋ J'ai le téléphone</button></div></div>`);
    $("h-go").onclick = next;
  }
  function soloTurn(){
    const p = solo.turn;
    playScreen(`Joueur ${p+1} — ton plateau`,
      "1. Pose ta question à voix haute · 2. Barre les portraits · 3. Termine ton tour", "");
    $("b-turn").style.display="";
    const elim = solo.elims[p];
    boardHtml($("play-board"), { elim, onClick:(c, el)=>{
      if (elim.has(c.name)) { elim.delete(c.name); el.classList.remove("eliminated"); }
      else { elim.add(c.name); el.classList.add("eliminated"); }
    }});
    $("b-turn").onclick = () => {
      solo.turn = 1 - solo.turn;
      handoff(`Téléphone à Joueur ${solo.turn+1}`, `Joueur ${p+1} ne regarde plus.`, soloTurn);
    };
    $("b-guess").onclick = () => guessModal(name => {
      const opp = 1 - p;
      const ok = name === solo.secrets[opp];
      const winner = ok ? p : opp;
      endScreen(`Joueur ${winner+1} a gagné !`, ok ? "Bonne proposition" : "Mauvaise proposition — l'autre gagne", solo.secrets[p], solo.secrets[opp]);
    });
  }

  sHome();
})();
</script>
</body>
</html>
