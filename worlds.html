  return {asof:FJ.asof,y:FJ.y,since:FJ.per.duo,chs:FJ.per.ch,form:fcForm(p),duo:fcDuo(p).slice(0,40),des:fcDesig(p),chy:fcChamps(p,"y"),cha:fcChamps(p,"a"),
    prof:fcProf(p),cfg:FJ.cfg,ref:FJ.ref&&FJ.ref.elo,sd:FJ.sd15&&FJ.sd15[p.role]};
}
async function encData(a,b){await loadFJ();if(!FJ)return {missing:true,nocache:true};return {rows:fcEnc(a,b),pair:fcPair(a,b),y:FJ.y,since:FJ.per.duo}}

/* ---------- mise en forme ---------- */
const FJ_PH={"Swiss":"phase suisse","Play-Ins":"play-in","Play-In":"play-in","Play In Knockouts":"play-in","Knockouts":"phase finale","Groups":"groupes","Finals":"finale",
  "Semifinals":"demi-finale","Quarterfinals":"quart de finale","Playoffs":"playoffs","Regional Qualifier":"qualification","Promotion":"promotion","Regular Season":"saison"};
const fjPhase=s=>{s=String(s||"");let m;if(FJ_PH[s])return FJ_PH[s];if(m=s.match(/^Week (\d+)/))return "semaine "+m[1];if(m=s.match(/^Round (\d+)/))return "tour "+m[1];
  if(m=s.match(/^Playoffs - Round (\d+)/))return "playoffs, tour "+m[1];return s.toLowerCase()};
const FJ_TZ="Europe/Paris";   // les heures du flux sont en UTC : on affiche l'heure de Paris quel que soit l'appareil
const fjDate=(d,h)=>{const x=new Date(d+"T"+(h||"12:00")+":00Z");return x.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric",timeZone:FJ_TZ})};
const fjWhen=(d,h)=>{const x=new Date(d+"T"+(h||"12:00")+":00Z");return x.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:FJ_TZ})+(h?" à "+x.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:FJ_TZ}):"")};
const fjDay=s=>new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8)+"T12:00:00Z").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const fjSg=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toLocaleString("fr-FR");
const fjGd=v=>v==null?"–":"≈ "+fjSg(Math.round(v/100)*100);            // une partie : à 100 près (le flux s'écarte de gol.gg de 35 d'or en médiane)
const fjAvg=(s,n)=>n?fjSg(Math.round(s/n)):"–";                         // moyenne sur plusieurs parties
const fjK=k=>k.join("/");
const fjPl=(n,w)=>n+" "+w+(n>1?"s":"");
const fjTeam=c=>{if(T[c])return c;const n=norm(c);return Object.keys(T).find(id=>(T[id].al||[]).includes(n))||null};
const fjLogo=(c,s=16)=>{const id=fjTeam(c);return id?logo(id,s):""};
const fjRk=(i,n)=>`${i}${i===1?"er":"e"}/${n}`,fjNth=i=>i+(i===1?"er":"e");
const fjI=t=>`<details class="fji"><summary aria-label="Méthode">i</summary><p>${t}</p></details>`;
const FJ_AX={gd15:["Or à 15 min","l’or à 15 min",v=>fjSg(Math.round(v))],csd15:["CS à 15 min","les CS à 15 min",v=>(v>0?"+":"")+fx1(v)],
  csm:["CS par minute","le farm",fx2],kp:["Participation","la participation aux kills",v=>Math.round(v*100)+" %"],
  ds:["Part des dégâts","la part des dégâts",v=>fx1(v*100)+" %"],dth:["Morts par partie","la survie",fx2],vis:["Balises par min","la vision",fx2]};

/* ---------- fiche joueur ---------- */
function ficheBriefHTML(p){return D=>{if(D.missing)return"";
  const k=p.key,Y=D.y,parts=[],F=D.form,P=D.prof,C=D.chy,des=D.des,role=(ROLEP[p.role]||"").replace(/^des /,"");
  const opp=nm=>D.duo.find(x=>x.nm===nm);
  // niveau 1 : quatre lignes au plus, chacune ouvre son détail
  if(F&&F.last.length){const w=F.last.filter(x=>x.w).length,s=F.streak;
    parts.push(["form","Forme",`${w} V – ${F.last.length-w} D sur ses ${F.last.length} dernières${Math.abs(s)>=3?`, <em>${Math.abs(s)} ${s>0?"victoires":"défaites"} de suite</em>`:""}${F.tag?` <span class="${F.tag==="hausse"?"up":"dn"}">en ${F.tag}</span>`:""}`])}
  if(P){const ax=a=>P.ax.find(x=>x.k===a);
    if(P.f.length){const a=ax(P.f[0]),b=P.w.length&&ax(P.w[0]);parts.push(["prof","Point fort",`${fjNth(a.rk)} des ${a.n} ${role} des Worlds pour ${FJ_AX[a.k][1]} <em>(${FJ_AX[a.k][2](a.adj)}, à adversaires égaux)</em>${b?` ; point faible : ${FJ_AX[b.k][1]} <em>(${fjNth(b.rk)})</em>`:""}`])}
    else if(P.w.length){const a=ax(P.w[0]);parts.push(["prof","Point faible",`${fjNth(a.rk)} des ${a.n} ${role} des Worlds pour ${FJ_AX[a.k][1]} <em>(${FJ_AX[a.k][2](a.adj)}, à adversaires égaux)</em>`])}
    else if(P.ax.some(a=>a.rk))parts.push(["prof","Profil","équilibré : ni dans les 4 premiers ni dans les 4 derniers sur un axe fiable"])}
  if(C&&C.rows.length){const c=C.rows[0];parts.push(["ch","Champion",`${champ(c.c,18)} ${esc(c.c)}, ${fjPl(c.g,"partie")} en ${Y} (${c.w} V – ${c.g-c.w} D)`])}
  if(des){const pick=(i)=>des.y[i]?[des.y[i],"y"]:des.a[i]?[des.a[i],"a"]:null,n=pick(0),v=pick(1);
    const line=(x,per)=>{const o=opp(x.nm),r=o&&(per==="y"?o.y:o.a);return r?`${esc(x.nm)} <em>(${esc(x.tm)})</em>, ${r.w} V – ${r.g-r.w} D ${per==="y"?"en "+Y:"depuis "+D.since}`:esc(x.nm)};
    if(n)parts.push(["duo","Némésis",line(...n)]);else if(v)parts.push(["duo","Victime",line(...v)]);
    else parts.push(["duo","Duels",`personne ne le domine (au moins ${D.cfg.nem[0]} duels)`])}
  return parts.length?`<h2>En bref</h2><div class="fjb frame hx">${parts.map(([id,l,t])=>`<button class="fjl" data-fjgo="fj-${id}-${esc(k)}" data-fjk="${esc(k)}"><b>${l}</b><span>${t}</span></button>`).join("")}</div>`:""}}
function ficheDetailsHTML(p){return D=>{if(D.missing)return"";
  const h=fjFormHTML(p,D)+fjDuoHTML(p,D)+fjChampsHTML(p,D)+fjProfHTML(p,D);
  return h?`<h2>En détail</h2>${h}<p class="small" style="margin-top:6px">Données officielles LoL Esports depuis ${esc(D.since)}, mises à jour le ${esc(fjDate(D.asof.slice(0,10)))}. Qualifications EWC absentes.</p>`:""}}
const fichePlayerHTML=p=>D=>ficheBriefHTML(p)(D)+ficheDetailsHTML(p)(D);

function fjFormHTML(p,D){
  const F=D.form;if(!F||!F.last.length)return"";const L=F.last,w=L.filter(x=>x.w).length,S=F.S;
  const kL=L.reduce((s,x)=>[s[0]+x.k,s[1]+x.d,s[2]+x.a],[0,0,0]),g15=L.filter(x=>x.gd!=null);
  const sub=`${w} V – ${L.length-w} D, KDA ${fx1((kL[0]+kL[2])/Math.max(1,kL[1]))} (saison ${fx1((S.k+S.a)/Math.max(1,S.d))}, ${S.w} V – ${S.g-S.w} D)`;
  return `<details class="fjd" id="fj-form-${esc(p.key)}"><summary><b>Ses 10 dernières parties</b><span>${sub}</span></summary><div class="fjin">
    <div class="fjf">${L.map(x=>`<i class="${x.w?"w":"l"}">${x.w?"V":"D"}</i>`).join("")}</div>
    ${L.map(x=>`<div class="fjg">${champ(x.c,30)}<span><b>${fjK([x.k,x.d,x.a])}</b> <span class="${x.w?"w":"l"}">${x.w?"victoire":"défaite"}</span>
      <small>${esc(fjDate(x.date,x.h))}, ${esc(x.comp)} ${esc(fjPhase(x.bn))}, contre ${fjLogo(x.opp,14)}${esc(x.opp)}${x.vs?" ("+esc(x.vs)+")":""}</small></span>
      <span class="r"><small>or à 15 min</small>${fjGd(x.gd)}</span></div>`).join("")}
    <p class="small" style="margin-top:6px">Or à 15 min sur ces ${g15.length} parties : ${fjAvg(g15.reduce((s,x)=>s+x.gd,0),g15.length)} en moyenne (saison ${fjAvg(S.gd,S.n15)}).
    ${fjI(`« En hausse » ou « en baisse » seulement si les 10 dernières s’écartent de la saison d’au moins ${Math.round(D.cfg.form[1]*100)} points de victoires ET d’une erreur type d’or à 15 min (${D.sd} ÷ √10), dans le même sens. Testé sur 2025-2026 : 10 parties ne prédisent presque pas les 10 suivantes (corrélation 0,05 pour les victoires, 0,12 pour l’or), d’où cette règle stricte. Or d’une partie arrondi à 100 : le flux officiel s’écarte de gol.gg de 35 d’or en médiane.`)}</p></div></details>`;
}
function fjDuoHTML(p,D){
  const L=D.duo,des=D.des,Y=D.y;if(!L.length)return"";
  const tot=L.reduce((s,x)=>s+x.a.g,0),ny=L.filter(x=>x.y).length;
  const row=(x)=>{const a=x.a,y=x.y,o=x.key&&PLAYERS.find(q=>q.key===x.key),c1=T[p.team].color,c2=o?T[o.team].color:"var(--muted)";
    const tag=des?["Némésis","Victime","Plus dur en lane","Plus facile en lane"].filter((t,i)=>(des.a[i]&&des.a[i].nm===x.nm&&des.a[i].tm===x.tm)||(des.y[i]&&des.y[i].nm===x.nm&&des.y[i].tm===x.tm)):[];
    return `<${o?`button data-cmp="${esc(p.key)}|${esc(o.key)}"`:"div"} class="fjo"><span><b>${esc(x.nm)}</b>${tag.map(t=>`<i class="fjtag">${t}</i>`).join("")}
      <small>${o?logo(o.team,12)+" ":""}${esc(x.tm)}${y?` · ${Y} : ${y.w}-${y.g-y.w}`:""} · or à 15 min ${a.n15>=3?fjAvg(a.gd,a.n15):"–"} · attendu ${fx1(a.exp)} V</small></span>
      <i class="split mini"><i style="width:${a.w/a.g*100}%;background:${c1}"></i><i style="width:${(a.g-a.w)/a.g*100}%;background:${c2}"></i></i><em>${a.w}-${a.g-a.w}</em></${o?"button":"div"}>`};
  let top="";
  if(des){const lab=["Némésis","Victime","Plus dur en lane","Plus facile en lane"],bits=[];
    [0,1,2,3].forEach(i=>{const per=des.y[i]?"y":des.a[i]?"a":null;if(!per)return;const d=des[per][i],x=L.find(z=>z.nm===d.nm&&z.tm===d.tm),r=x&&(per==="y"?x.y:x.a);if(!r)return;
      bits.push(`<b>${lab[i]}</b> ${esc(d.nm)} : ${i<2?`${r.w} V – ${r.g-r.w} D`:`${fjAvg(r.gd,r.n15)} d’or à 15 min en moyenne sur ${fjPl(r.n15,"partie")}`} ${per==="y"?"en "+Y:"depuis "+D.since}${i<2?` (attendu d’après la force des équipes : ${fx1(r.exp)} V)`:""}`)});
    top=bits.length?`<ul class="why" style="margin:0 0 8px">${bits.map(b=>`<li>${b}</li>`).join("")}</ul>`:`<p class="small">Personne ne le domine ni ne le subit nettement (au moins ${D.cfg.nem[0]} duels).</p>`}
  const nm=des&&(des.y[0]||des.a[0]);
  return `<details class="fjd" id="fj-duo-${esc(p.key)}"><summary><b>Face à ses vis-à-vis</b><span>${fjPl(L.length,"adversaire")} en lane depuis ${esc(D.since)} (${tot} parties), ${ny} en ${Y}${nm?`. Némésis : ${esc(nm.nm)}`:""}</span></summary><div class="fjin">${top}
    ${L.slice(0,8).map(row).join("")}${L.length>8?`<details><summary class="small" style="cursor:pointer;color:var(--gold);padding:6px 0">Voir les ${L.length-8} autres</summary>${L.slice(8).map(row).join("")}</details>`:""}
    <p class="small" style="margin-top:6px">Bilan depuis ${esc(D.since)}, toutes compétitions officielles. Touche un titulaire des Worlds pour comparer.
    ${fjI(`Némésis : au moins ${D.cfg.nem[0]} duels, au plus ${Math.round(D.cfg.nem[1]*100)} % de victoires et ${D.cfg.nem[2]} défaites. Victime : au moins ${D.cfg.vic[0]} duels, ${Math.round(D.cfg.vic[1]*100)} % de victoires et ${D.cfg.vic[2]} victoires. Plus dur ou plus facile en lane : au moins ${D.cfg.lane[0]} parties mesurées, écart d’or à 15 min d’au moins ${D.cfg.lane[2]} (moyenne tirée vers 0). Seuils choisis par tests de permutation sur nos 95 joueurs : le bilan face à un adversaire est un vrai signal, mais il reflète surtout la force des équipes, d’où les victoires attendues (Elo d’équipe partie par partie, toutes ligues).`)}</p></div></details>`;
}
function fjChampsHTML(p,D){
  const one=(C,per)=>!C||!C.rows.length?`<p class="small">Aucune partie.</p>`:C.rows.map(c=>`<div class="fjg">${champ(c.c,30)}<span><b>${esc(c.c)}</b> ${c.w} V – ${c.g-c.w} D, KDA ${fx1(c.kda)}${c.n15>=3?`, or à 15 min ${fjSg(c.gd)}`:""}
      <small>${c.rg>=D.cfg.chref&&c.rw!=null?`Autres ${esc((ROLEP[p.role]||"").replace(/^des /,""))} pros : ${pct(c.rw,c.rg)} % sur ${c.rg} parties${c.rgd!=null?`, or à 15 min ${fjSg(c.rgd)}`:""}`:`Moins de ${D.cfg.chref} parties des autres pros : pas de référence`}</small></span><span class="r"><b>${c.g}</b><small>parties</small></span></div>`).join("")
      +(C.og?`<p class="small" style="margin-top:4px">Et ${fjPl(C.og,"partie")} sur ${C.pool-C.rows.length} autres champions (${C.ow} V).</p>`:"");
  const C=D.chy;if(!C||!C.rows.length)return"";
  return `<details class="fjd" id="fj-ch-${esc(p.key)}"><summary><b>Champions ${esc(D.y)}</b><span>${fjPl(C.pool,"champion")}, le plus joué : ${esc(C.rows[0].c)} (${C.rows[0].g})</span></summary><div class="fjin">${one(C,"y")}
    ${D.cha&&D.cha.rows.length?`<details><summary class="small" style="cursor:pointer;color:var(--gold);padding:6px 0">Depuis ${esc(D.chs)}</summary>${one(D.cha,"a")}</details>`:""}
    <p class="small" style="margin-top:6px">Seulement des faits.${fjI(`Testé sur nos 95 joueurs : un bilan par champion ne s’écarte pas plus du hasard que des bilans tirés au sort (36 joueurs signalés contre 36 au hasard), même chose pour l’or à 15 min comparé aux autres pros. Aucune étiquette « champion fort » n’est donc affichée. Référence : tous les autres joueurs pros du même poste sur ce champion, même période, au moins ${D.cfg.chref} parties.`)}</p></div></details>`;
}
function fjProfHTML(p,D){
  const P=D.prof;if(!P||!P.ax.length)return"";const role=(ROLEP[p.role]||"").replace(/^des /,"");
  const lab=a=>FJ_AX[a.k][0],fmt=(a,v)=>v==null?"–":FJ_AX[a.k][2](v);
  const sub=P.f.length||P.w.length?[P.f.length?"fort : "+P.f.map(k=>FJ_AX[k][1]).join(", "):"",P.w.length?"faible : "+P.w.map(k=>FJ_AX[k][1]).join(", "):""].filter(Boolean).join(" · "):"profil équilibré";
  return `<details class="fjd" id="fj-prof-${esc(p.key)}"><summary><b>Profil ${esc(D.y)}, à adversaires égaux</b><span>${sub}</span></summary><div class="fjin">
    ${P.ax.map(a=>`<div class="fjx"><span>${lab(a)}</span><span class="bar">${a.rk?`<i style="left:${a.n>1?(a.rk-1)/(a.n-1)*100:0}%"></i>`:""}</span><em>${a.rk?fjRk(a.rk,a.n):"–"}</em>
      <small>${fmt(a,a.adj)} à adversaires égaux, ${fmt(a,a.raw)} brut sur ${a.m} parties${a.lrk?` · ${fjRk(a.lrk,a.ln)} en ${esc(P.lg)} (${fmt(a,a.lv)})`:""}</small></div>`).join("")}
    <p class="small" style="margin-top:6px">Rang parmi les 19 ${esc(role)} des Worlds (à gauche le meilleur), ${D.cfg.prof} parties minimum.
    ${fjI(`Chaque stat est corrigée de la force des adversaires : on retire l’effet mesuré de l’Elo adverse (régression sur toutes les parties pros de ${esc(D.y)}, par poste), ramené à l’adversaire moyen des Worlds (Elo ${D.ref}). Ses adversaires : Elo moyen ${P.eop}. Point fort ou faible seulement dans les 4 premiers ou les 4 derniers sur les axes fiables (or et CS à 15 min, farm, morts, vision : fiabilité moitié-moitié 0,79 à 0,94), dans les 2 premiers ou derniers pour la participation et la part des dégâts (0,42 à 0,74). Rang de ligue : saison régulière et playoffs, valeur brute.`)}</p></div></details>`;
}

/* ---------- rencontres entre deux titulaires (comparaison, prochain duel) ---------- */
function encHTML(a,b,short){return D=>{
  const R=D.rows,X=D.pair,Y=D.y;
  if(D.missing)return short||typeof recentDuels!=="function"?"":recentDuels(a,b);
  if(!R.length&&!X)return short?"": `<p class="small">Jamais face à face en lane depuis ${esc(D.since)}.</p>`;
  const won=R.filter(x=>x.w).length,last=R[0];
  const lastP=last?`<p class="small" style="margin:8px 0 0">Dernière rencontre le <b>${esc(fjWhen(last.date,last.h))}</b>, ${esc(last.comp)} (${esc(fjPhase(last.bn))}, manche ${last.n}) : ${esc(last.w?a.id:b.id)} gagne${last.sc&&last.bo>1?`, série ${esc(last.ca)} ${esc(last.sc)} ${esc(last.cb)}`:""}.</p>`:"";
  if(short)return lastP;   // le bilan est déjà affiché par le bloc « Prochain duel »
  let h=X?`<div class="lane"><span class="rl">Depuis ${esc(D.since)}</span><b${X.a.w>X.a.g-X.a.w?' style="color:var(--gold2)"':""}>${esc(a.id)}</b><span class="lsc"><em>${X.a.w}</em><i class="split mini"><i style="width:${X.a.w/X.a.g*100}%;background:${T[a.team].color}"></i><i style="width:${(X.a.g-X.a.w)/X.a.g*100}%;background:${T[b.team].color}"></i></i><em>${X.a.g-X.a.w}</em></span><b${X.a.g-X.a.w>X.a.w?' style="color:var(--gold2)"':""}>${esc(b.id)}</b>
    <span class="lsub">${fjPl(X.a.g,"partie")} en lane${X.y?`, dont ${X.y.g} en ${Y} (${X.y.w}-${X.y.g-X.y.w})`:""}. D’après la force des équipes, ${esc(a.id)} en aurait gagné ${fx1(X.a.exp)}.${X.a.n15>=3?` Or à 15 min : ${fjAvg(X.a.gd,X.a.n15)} en moyenne pour ${esc(a.id)}.`:""}</span></div>`:"";
  h+=lastP;
  if(!R.length)return h;
  const row=x=>`<details class="fje ${x.w?"w":"l"}"><summary><span class="d">${esc(fjDate(x.date,x.h))}<small>${esc(x.comp)}, M${x.n}</small></span>
      <span class="c">${champ(x.chA,26)}<b>${fjK(x.kA)}</b></span><i>${x.w?"V":"D"}</i><span class="c r"><b>${fjK(x.kB)}</b>${champ(x.chB,26)}</span></summary>
      <dl><dt>${esc(fjWhen(x.date,x.h))}, ${esc(fjPhase(x.bn))}${x.bo>1?`, Bo${x.bo}`:""}</dt><dd>${fjLogo(x.ca,14)}${esc(x.ca)}</dd><dd>${esc(x.cb)}${fjLogo(x.cb,14)}</dd>
      <dt>Champions</dt><dd>${esc(x.chA)}</dd><dd>${esc(x.chB)}</dd><dt>CS</dt><dd>${x.csA}</dd><dd>${x.csB}</dd>
      ${x.dsA!=null?`<dt>Part des dégâts</dt><dd>${fx1(x.dsA*100)} %</dd><dd>${x.dsB!=null?fx1(x.dsB*100)+" %":"–"}</dd>`:""}
      ${x.gd!=null?`<dt>Écart à 15 min (${esc(a.id)})</dt><dd>${fjGd(x.gd)} or</dd><dd>${x.csd==null?"–":(x.csd>0?"+":"")+x.csd+" CS"}</dd>`:""}
      <dt>Durée${x.bo>1&&x.sc?", série":""}</dt><dd>${Math.round(x.min)} min</dd><dd>${x.bo>1&&x.sc?esc(x.sc):""}</dd></dl></details>`;
  return h+`<h3 class="h3">${R.length>1?`Leurs ${R.length} dernières rencontres : ${won}-${R.length-won}${won!==R.length-won?` pour ${esc(won>R.length-won?a.id:b.id)}`:""}`:"Leur seule rencontre"}</h3>${R.map(row).join("")}
    <p class="small" style="margin-top:6px">Touche une partie pour le détail. Heures de Paris.${fjI(`Parties officielles LoL Esports depuis ${esc(D.since)} (qualifications EWC absentes). Recoupé avec gol.gg sur 261 de ces parties : K/D/A, part des dégâts, manche et longueur de la série identiques ; CS à 1 près ; or à 15 min à 35 d’or près en médiane (90 % à moins de 140), d’où l’arrondi à 100.`)}</p>`}}

/* niveau 1 seul, pour une ligne de duel de la feuille de match (FJ déjà chargé, sinon rien) */
function encLaneSub(a,b){if(!FJ)return"";const x=fcEnc(a,b)[0];return x?` Dernière rencontre ${esc(fjDate(x.date,x.h))} (${esc(x.comp)}) : ${esc(x.w?a.id:b.id)} gagne.`:""}

/* ouvre le détail visé par une ligne « En bref » (le bloc détaillé se charge en arrivant à l'écran : on y descend d'abord) */
function fjGo(id,k,n=0){const d=document.getElementById(id);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"});return}
  const box=document.querySelector(`[data-ak="fjd_${CSS.escape(k)}"]`);if(box&&n<8){box.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>fjGo(id,k,n+1),350)}}

/* ===================== FICHE D'AVANT-MATCH ET DIRECT (lot1/ui_match) =====================
   Fiche d'un match (matchSheet) :
   - niveau 1 : bandeau, prono du robot (robotHTML, inchangé), « Les clés du match » (SJ.pm, 3 lignes au plus), puis une ligne
     par poste (2 photos, bilan en lane depuis 2024, 5 dernières rencontres, or à 15 min, forme, picks probables) ;
   - niveau 2 au toucher : le duel détaillé (fiche « v » empilée), la draft repliée, l'équipe repliée ;
   - niveau 3 : le petit « i » de chaque bloc (méthode, échantillon, ce qui a été testé).
   Direct (liveBoxHTML) : une ligne par poste champion contre champion (matchup lissé, échantillon, expérience des joueurs),
   prono de la partie après la draft (correction testée de prono/RAPPORT.md), entre deux manches les champions brûlés et
   les picks probables restants. Le fil du match vient de live_extras.js (lot flux), branché par apply.py.
   Dépend de : keys.js (pmRow, keyLine, whyLine, calTxt, refTable, kcss, draftSides, draftFeat, draftAdjust, gameProbE, pmCk),
   fiche_helpers.js (FJ, loadFJ, fcEnc, fcPair, fcForm, fcChamps, fjPhase), aide draft déjà dans worlds.html (DJ, loadDJ,
   picksFor, prefVsPref, matchup, fearlessBurned, draftMatchData, draftMatchHTML, djIx, ckey), et de l'appli (esc, norm, T,
   PLAYERS, ROLES, ROLE_ORDER, teamPlayers, logo, photo, champ, col, fx1, fx2, pct, kdaV, ablock, AK, skel, setSheet,
   pBetter, laneDuel, renderH2H, h2h, renderForm, teamSeasonC, renderTape, champMap, SJ). Aucune exception ne remonte :
   chaque rendu est protégé et retombe sur rien plutôt que sur une erreur. */

function amCommon(a,b,D){

  const rows=p=>{const M=new Map(),d=D.duo[p.key];

    PLAYERS.forEach(o=>{if(o.role!==p.role||o===a||o===b)return;const x=fcPair(p,o,D);if(x)M.set(o.key,{nm:o.id,tm:o.team,key:o.key,s:[x.a.g,x.a.w,x.a.gd,x.a.n15]})});
    return M};
  const A=rows(a),B=rows(b),out=[];
  A.forEach((x,k)=>{const y=B.get(k);if(y)out.push({nm:x.nm,tm:x.tm,key:x.key,A:x.s,B:y.s})});
  return out.sort((p,q)=>Math.min(q.A[0],q.B[0])-Math.min(p.A[0],p.B[0])||(q.A[0]+q.B[0])-(p.A[0]+p.B[0])||p.nm.localeCompare(q.nm));
}

// bilan de p contre un adversaire de fiche.json (vs = [pseudo, équipe, clé]) : {g, w, gd, n15, exp} sur la période per ("y" : année, "a" : depuis 2024)
function rkFjPair(D,p,idx,per){const v=D.vs[idx],du=D.duo[p.key];let r=null;
  if(v[2]){const o=rkP(v[2]),ka=norm(p.id),kb=o?norm(o.id):norm(v[0]),x=D.dp&&D.dp[ka<kb?ka+"|"+kb:kb+"|"+ka];
    if(x)r=ka<kb?x:[x[0],x[0]-x[1],-x[2],x[3],x[5],x[4],x[6],x[0]-x[7]].concat(x.length>8?[x[8],x[8]-x[9],-x[10],x[11],x[13],x[12],x[8]-x[14]]:[])}
  if(!r){const z=du&&du.r.find(q=>q[0]===idx);if(z)r=z.slice(1)}
  if(!r)return null;const o=per==="y"&&r.length>8?8:0;
  return {g:r[o],w:r[o+1],gd:r[o+2],n15:r[o+3],exp:o?r[14]:r[7]}}
// données légères pour ablock (≈ 1 Ko gardé dans le téléphone) : 5 champions de l'année, 4 désignations (némésis, victime, plus dur et plus facile en lane)
async function rkFicheData(p){
  let D=null;try{D=typeof loadFJ==="function"?await loadFJ():await loadAux("fiche")}catch(e){D=null}
  if(!D||D.v!==1||!Array.isArray(D.gm))return {missing:true,nocache:true};
  const c=D.ch&&D.ch[p.key],du=D.duo&&D.duo[p.key];
  const ch=c&&c.y?c.y.slice(0,5).map(r=>[D.champs[r[0]],r[1],r[2],r[3],r[4],r[5],r[6],r.length>7?r[7]:null]):[];
  const des=du?[0,1,2,3].map(i=>{const per=du.dy[i]!=null?"y":du.da[i]!=null?"a":null;if(!per)return null;const idx=(per==="y"?du.dy:du.da)[i],v=D.vs[idx],b=rkFjPair(D,p,idx,per);
    return b?{i,per,nm:v[0],tm:v[1],key:v[2]||null,...b}:null}).filter(Boolean):[];
  return {y:D.y,since:(D.per&&D.per.duo)||"2024",ch,pool:c&&c.zy?c.zy[0]:null,des,nem:D.cfg&&D.cfg.nem?D.cfg.nem[0]:8,ref:D.cfg&&D.cfg.chref||30};
}

function rkTeamBrief(id){
  const R=RKX(),S=SJ&&SJ.sim,M=SJ&&SJ.m;let h="";
  const inS=!!(S&&S.S&&S.S[id]!=null),src=inS?S.S:M&&M.t;
  if(src&&src[id]!=null){const L=Object.entries(src).sort((a,b)=>b[1]-a[1]),i=L.findIndex(z=>z[0]===id)+1;
    h+=rkBl("Force",`${rkFem(i)} force sur ${L.length}<small>${inS?"équipes de la phase suisse":"équipes des Worlds"} ; ${fx2(src[id])} = somme des notes d’impact de ses 5 titulaires</small>`,
      `<div class="rkfl">${L.map(([t,v],j)=>`<button class="rkfr${t===id?" me":""}" data-t="${esc(t)}"><span>${j+1}</span>${logo(t,18)}<b>${esc(t)}</b><i><i style="width:${Math.max(2,v/L[0][1]*100).toFixed(1)}%"></i></i><em>${fx2(v)}</em></button>`).join("")}</div>`)}
  const e=S&&S.eq&&S.eq[id],st=status(id,records());
  if(e&&st.k!=="out"){const nx=(S.mt||[]).find(r=>(r[1]===id||r[2]===id));
    const lab=["3-0","3-1","3-2","2-3","1-3","0-3"];
    h+=rkBl("Chances",`Titre ${rkPct(e[10])} %, finale ${rkPct(e[9])} %<small>demies ${rkPct(e[8])} %, quarts ${rkPct(e[7])} % (simulation du robot)</small>`,
      `<div class="rkdist">${lab.map((l,j)=>`<span><i style="height:${Math.max(2,e[1+j]*100).toFixed(0)}%"></i><b>${rkPct(e[1+j])} %</b><small>${l}</small></span>`).join("")}</div><p>Bilan final probable en phase suisse (actuel : ${esc(e[0])}).${nx?` Prochain match contre ${esc(nx[1]===id?nx[2]:nx[1])} (Bo${nx[3]}) : ${rkPct(nx[1]===id?nx[4]:1-nx[4])} % de chances.`:""}</p>`)}
  const P=teamPlayers(id).map(p=>rkFind(p.key)).filter(Boolean);
  if(P.length){const S2=[...P].sort((a,b)=>a.i-b.i),top=S2.filter(x=>x.i<=5),sh=(top.length?top:S2.slice(0,1)).slice(0,3);
    h+=rkBl("Joueurs",`${sh.map(x=>`${esc(rkNm(x.key))} ${rkOrd(x.i)} ${RK_ROLE1[x.role]}`).join(", ")}<small>rang à son poste parmi les titulaires des Worlds</small>`,
      `<div class="lead">${P.map(x=>rkRow(x,{role:1})).join("")}</div>`)}
  const wt=rkWorldsT1(id);if(wt)h+=rkBl("Grands tournois",`${wt[0]}<small>${wt[1]}</small>`,rkWorldsT2(id));
  return h?rkH2("Le robot en bref",`<p>Force : somme des notes d’impact des 5 titulaires (niveau des adversaires et des ligues compris). Chances : ${((S&&S.n)||20000).toLocaleString("fr-FR")} tournois simulés avec les résultats déjà acquis. Joueurs : rang de la note d’impact parmi les 19 titulaires du poste. Grands tournois : victoires réelles moins victoires attendues d’après la note de ses joueurs avant chaque tournoi, depuis 2024.</p>`)+`<div class="frame hx rkbr">${h}</div>`:""}

/* ---- paris : encodage compact ---- */
function encPicks(){return Object.keys(picks).map(k=>`${k}~${picks[k]}~${scores[k]||""}`).join(".")}
function decPicks(s){const o={};String(s||"").split(".").forEach(x=>{const [k,w,sc]=x.split("~");if(k&&w&&T[w])o[k]={w,sc:sc||null}});return o}
const myBets=()=>{const o={};Object.keys(picks).forEach(k=>o[k]={w:picks[k],sc:scores[k]||null});return o};

/* ---- transport ---- */
function payload(hello){return JSON.stringify({v:3,id:lg.me.id,name:lg.me.name,p:encPicks(),ts:Date.now(),hello:!!hello,owner:!!lg.owner,gage:lg.owner?lg.gage:null})}
async function publish(hello){
  if(!lg)return;
  try{const r=await fetch(NTFY+topicOf(lg.code),{method:"POST",body:payload(hello)});if(!r.ok)throw new Error(r.status);DU.pubErr=false;if(window.mark)mark("relay",true,0)}
  catch(e){DU.pubErr=true;if(window.mark)mark("relay",false,0,"publication : "+e.message);clearTimeout(DU.retryPub);DU.retryPub=setTimeout(()=>publish(hello),8000)}
  renderDuelOnly();
}
function duelState(){clearTimeout(DU.pubT);DU.pubT=setTimeout(()=>publish(false),600)}
function handleMsg(m){
  if(!lg||!m||(m.event&&m.event!=="message")||!m.id||DU.seen.has(m.id))return;
  DU.seen.add(m.id);DU.lastId=m.id;
  let d;try{d=JSON.parse(m.message)}catch(e){return}
  if(!d||!d.id||d.id===lg.me.id||!d.name)return;
  onLeagueData(d,m.time||0);
}
function duelConnect(){
  if(!lg)return;duelStop();
  if(typeof EventSource==="undefined"){startPoll();return}
  const es=DU.es=new EventSource(NTFY+topicOf(lg.code)+"/sse?since=all");
  es.onopen=()=>{DU.open=true;DU.errs=0;stopPoll();if(window.mark)mark("relay",true,0);renderDuelOnly();if(!DU.hello){DU.hello=true;publish(true)}};
  es.onmessage=ev=>{try{handleMsg(JSON.parse(ev.data))}catch(e){}};
  es.onerror=()=>{DU.open=false;DU.errs++;renderDuelOnly();if(DU.errs>=2)startPoll()};
}
async function pollOnce(){
  if(!lg)return;
  try{const r=await fetch(NTFY+topicOf(lg.code)+"/json?poll=1&since="+(DU.lastId||"all"));const t=await r.text();
    t.split("\n").forEach(l=>{if(l.trim())try{handleMsg(JSON.parse(l))}catch(e){}});
    DU.pollOk=true;if(!DU.hello){DU.hello=true;publish(true)}}catch(e){DU.pollOk=false}
  renderDuelOnly();
}
function startPoll(){if(DU.pollT)return;pollOnce();DU.pollT=setInterval(()=>{if(!document.hidden)pollOnce()},12000)}
function stopPoll(){clearInterval(DU.pollT);DU.pollT=0}
function duelStop(){try{DU.es&&DU.es.close()}catch(e){}DU.es=null;DU.open=false;stopPoll();DU.hello=false}
function duelWake(){if(!lg)return;if(!DU.es||DU.es.readyState===2)duelConnect();else pollOnce()}
let rdT=0;const renderSoon=()=>{clearTimeout(rdT);rdT=setTimeout(()=>{renderHome();if(sheetState&&sheetState.k==="m")refreshSheet(true)},120)};
function onLeagueData(d,time){
  const fresh=time>=DU.t0-120,old=lg.players[d.id],isNew=!old;
  if(d.owner&&d.gage!=null&&!lg.owner)lg.gage=String(d.gage).slice(0,60);
  if(old&&d.ts<=old.ts&&!d.hello)return;
  const prev=old?old.p:{},next=decPicks(d.p);
  if(!old||d.ts>old.ts)lg.players[d.id]={name:String(d.name).slice(0,16),p:next,ts:d.ts};
  else lg.players[d.id].name=String(d.name).slice(0,16);
  saveLg();
  if(fresh){
    const added=Object.keys(next).filter(k=>!prev[k]);
    if(isNew)toast(`${d.name} a rejoint la ligue`);
    else if(added.length){const m=MATCHES.find(x=>x.key===added[added.length-1]);toast(`${d.name} a placé son pari${m&&m.t1&&m.t2?` pour ${T[m.t1].id} vs ${T[m.t2].id}`:""}`)}
    if(isNew||added.length)vib(25);
    if(d.hello)setTimeout(()=>publish(false),300+Math.random()*2500);
  }
  renderSoon();
}

/* ---- points et classement ---- */
function pts(w,sc,m){
  if(!w||!m.winner||w!==m.winner)return 0;let p=1;
  if(m.bo>1&&sc&&m.s1!=null&&m.s2!=null){const ws=m.winner===m.t1?m.s1:m.s2,ls=m.winner===m.t1?m.s2:m.s1;if(sc===`${ws}-${ls}`)p++}
  return p;
}
const scoreOpts=bo=>bo===3?["2-0","2-1"]:bo===5?["3-0","3-1","3-2"]:[];
function members(){return [{id:lg.me.id,name:lg.me.name,p:myBets(),me:true},...Object.entries(lg.players).map(([id,x])=>({id,name:x.name,p:x.p,ts:x.ts}))]}
function standings(){
  const all=members(),done=MATCHES.filter(m=>m.winner&&!m.manual&&m.t1&&m.t2);
  all.forEach(u=>{u.pts=0;u.ex=0;u.ok=0;u.n=0;u.form=[];u.streak=0;u.bold=0;
    done.forEach(m=>{const b=u.p[m.key];if(!b)return;u.n++;const s=pts(b.w,b.sc,m);u.pts+=s;if(s)u.ok++;if(s>1)u.ex++;u.form.push(s>0)});
    for(let k=u.form.length-1;k>=0&&u.form[k];k--)u.streak++});
  done.forEach(m=>{const bt=all.filter(u=>u.p[m.key]);if(bt.length<3)return;const good=bt.filter(u=>u.p[m.key].w===m.winner);if(good.length&&good.length<=bt.length/3)good.forEach(u=>u.bold++)});
  all.sort((a,b)=>b.pts-a.pts||b.ex-a.ex||b.ok-a.ok||a.name.localeCompare(b.name));
  let r=0;all.forEach((u,i)=>{if(i===0||u.pts!==all[i-1].pts||u.ex!==all[i-1].ex)r=i+1;u.rank=r});
  return all;
}
function checkRank(){
  if(!lg||!Object.keys(lg.players).length)return;
  const st=standings(),me=st.find(u=>u.me),prev=LS.get("lgRank",null);
  if(prev&&me.rank<prev&&me.pts>0){toast(me.rank===1?"Tu prends la tête de la ligue !":`Tu passes ${me.rank}e !`);if(me.rank===1)confetti(innerWidth/2,innerHeight*.3,["#C8AA6E","#F0E6D2","#0AC8B9"],110);vib([30,40,30])}
  LS.set("lgRank",me.rank);
}

/* ===================== DIRECT : stats en temps réel (flux officiel LoL Esports) ===================== */
const FEED="https://feed.lolesports.com/livestats/v1/";
const LV={live:[],liveT:0,games:{},timer:0,watch:null};
const tsISO=ms=>new Date(Math.floor(ms/10000)*10000).toISOString().replace(/\.\d{3}Z$/,".000Z");
async function feedWin(gid,start){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(FEED+"window/"+gid+(start?"?startingTime="+tsISO(start):""),{signal:ctl.signal});if(r.status===204)return null;if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}
}
async function refreshLiveList(){
  if(Date.now()-LV.liveT<30000)return;LV.liveT=Date.now();
  try{const j=await leFetch("getLive?hl=fr-FR");
    LV.live=(j?.data?.schedule?.events||[]).filter(e=>e.match&&e.match.teams).map(e=>{const [a,b]=e.match.teams;return {mid:e.match.id||e.id,t1:resolveTeam(a.code,a.name),t2:resolveTeam(b.code,b.name)}}).filter(x=>x.t1&&x.t2)}catch(e){}
}
const liveFor=m=>LV.live.find(l=>(l.t1===m.t1&&l.t2===m.t2)||(l.t1===m.t2&&l.t2===m.t1));
function playerFromSummoner(sn,team){
  const parts=String(sn||"").trim().split(/\s+/),cands=[norm(parts.slice(1).join(" ")),norm(parts.join(" ")),norm(parts[parts.length-1])].filter(Boolean);
  for(const tok of cands){const p=PLAYERS.find(p=>p.team===team&&norm(p.id)===tok)||PLAYERS.find(p=>norm(p.id)===tok);if(p)return p}
  return null;
}
function pushSample(L,f){if(!L.first)return;const t=(Date.parse(f.rfc460Timestamp)-L.first)/60000;if(t<0)return;const gd=f.blueTeam.totalGold-f.redTeam.totalGold;const last=L.samples[L.samples.length-1];if(!last||t-last.t>=.15)L.samples.push({t,gd})}

  const L=LV.games[m.key]||(LV.games[m.key]={samples:[]});
  if(!L.mid){await refreshLiveList();const lv=liveFor(m);L.mid=lv?lv.mid:(String(m.id).startsWith("le")?String(m.id).slice(2):null)}
  if(!L.mid){L.status="nolive";return}
  if(!L.games||Date.now()-L.gt>45000){
    const j=await leFetch("getEventDetails?hl=fr-FR&id="+L.mid),ev=j?.data?.event;
    L.teams=(ev?.match?.teams||[]).map(t=>({id:t.id,our:resolveTeam(t.code,t.name),w:t.result?.gameWins}));L.games=ev?.match?.games||[];L.gt=Date.now();
  }
  const g=L.games.find(x=>x.state==="inProgress");
  if(!g){L.status=L.games.some(x=>x.state==="completed")?"between":"waiting";return}
  if(L.gid!==g.id){Object.assign(L,{gid:g.id,num:g.number,first:null,samples:[],meta:null,frame:null,draft:null,draftP:null,amd:null})}
  const bt=(g.teams||[]).find(t=>t.side==="blue"),rt=(g.teams||[]).find(t=>t.side==="red");
  L.blue=(L.teams.find(t=>t.id===bt?.id)||{}).our||m.t1;L.red=(L.teams.find(t=>t.id===rt?.id)||{}).our||(L.blue===m.t1?m.t2:m.t1);
  if(!L.first){const w=await feedWin(g.id);if(w&&w.frames&&w.frames.length){L.first=Date.parse(w.frames[0].rfc460Timestamp);L.meta=w.gameMetadata;w.frames.forEach(f=>pushSample(L,f));kfFeed(L,w.frames,null)}}

  if(!force&&cache&&Date.now()-cache.t<24*3600e3)rows=cache.rows;
  if(!rows&&sj&&sj.prows&&sj.prows.length)rows=sj.prows;
  if(!rows){
    const ids=[...new Set(PLAYERS.map(p=>p.id))].map(i=>'"'+i.replace(/"/g,"")+'"').join(",");
    rows=await cargo({tables:"Players",fields:"Players.ID=PID,Players.Image=Img,Players.Name=RN,Players.NativeName=NN,Players.Country=Ctry,Players.Birthdate=BD,Players.Team=Tm,Players.OverviewPage=OP",where:`Players.ID IN (${ids})`});
    if(rows.length)LS.set("lp_players",{t:Date.now(),rows});
  }
  let n=0;
  PLAYERS.forEach(p=>{
    const cand=rows.filter(r=>norm(r.PID)===norm(p.id));
    if(!cand.length)return;
    let r=cand.find(r=>T[p.team].al.includes(norm(r.Tm)));
    if(!r&&cand.length===1)r=cand[0];
    if(!r)return;
    if(r.Img)p.photo=lpFile(r.Img,300);
    if(r.RN)p.realName=r.RN; if(r.NN)p.native=r.NN; if(r.BD)p.birth=r.BD; if(r.OP)p.page=r.OP;
    const cc=LP_CTRY[r.Ctry]; if(cc)p.cc=cc;
    n++;
  });
  return n;
}
async function enrichPhotosLE(){
  const s=await loadSJ();if(s&&s.v>=2&&s.pinfo&&Object.keys(s.pinfo).length)return;   // photos et logos déjà fournis par le robot
  const cache=LS.get("le_photos",null);
  let map=cache&&Date.now()-cache.t<24*3600e3?cache.map:null;
  if(!map){
    const j=await leFetch("getTeams?hl=fr-FR");map={};
    (j?.data?.teams||[]).forEach(t=>{const id=resolveTeam(t.code,t.name);if(!id)return;if(t.image)map["_logo_"+id]=t.image;(t.players||[]).forEach(pl=>{if(pl.image&&!/silhouette|placeholder/i.test(pl.image))map[id+"_"+norm(pl.summonerName)]=pl.image})});
    if(Object.keys(map).length)LS.set("le_photos",{t:Date.now(),map});
  }
  PLAYERS.forEach(p=>{const v=map[p.key];if(v)p.lePhoto=v});
  TEAMS.forEach(t=>{if(!LIVE_LOGO[t.id]&&map["_logo_"+t.id])LIVE_LOGO[t.id]=map["_logo_"+t.id]});
}

async function enrichPhotosWiki(){
  const miss=PLAYERS.filter(p=>!p.photo&&!p.lePhoto);if(!miss.length)return;
  for(let i=0;i<miss.length;i+=45){
    const chunk=miss.slice(i,i+45);
    const titles=chunk.map(p=>p.id+" (gamer)");
    const q=new URLSearchParams({action:"query",format:"json",origin:"*",prop:"pageimages",piprop:"thumbnail",pithumbsize:"300",redirects:"1",titles:titles.join("|")});
    const r=await fetch("https://en.wikipedia.org/w/api.php?"+q);if(!r.ok)continue;const j=await r.json();
    const back={};(j.query?.normalized||[]).forEach(x=>back[x.to]=x.from);(j.query?.redirects||[]).forEach(x=>back[x.to]=back[x.from]||x.from);
    Object.values(j.query?.pages||{}).forEach(pg=>{
      if(!pg.thumbnail)return;const orig=back[pg.title]||pg.title;
      const p=chunk.find(c=>norm(c.id+" (gamer)")===norm(orig));
      if(p&&!p.photo&&!p.lePhoto)p.wikiPhoto=pg.thumbnail.source;
    });
  }
}
const PHOTO_LOG={lp:"en attente",le:"en attente",wk:"en attente"};
function photoStats(){return PLAYERS.filter(p=>p.photo||p.lePhoto||p.wikiPhoto).length}
async function loadPhotos(force){
  if(force){LS.set("lp_players",null);LS.set("le_photos",null);PLAYERS.forEach(p=>{p.photo=p.lePhoto=p.wikiPhoto=null})}
  const sig=()=>PLAYERS.map(p=>[p.photo,p.lePhoto,p.wikiPhoto,p.realName].join("|")).join(";");let s0=sig();
  try{const k=await enrichPlayers(force);PHOTO_LOG.lp=k+" fiches trouvées"}catch(e){PHOTO_LOG.lp="injoignable ("+e.message+")"}
  if(force||sig()!==s0){s0=sig();renderAll()}
  try{await enrichPhotosLE();PHOTO_LOG.le="ok"}catch(e){PHOTO_LOG.le="injoignable ("+e.message+")"}
  try{await enrichPhotosWiki();PHOTO_LOG.wk="ok"}catch(e){PHOTO_LOG.wk="injoignable ("+e.message+")"}
  if(force||sig()!==s0)renderAll();
}
async function sync(force){
  const el=$("#sync");el.className="sync busy";el.querySelector("span").textContent="Synchro…";
  let list=null;
  try{list=await fromLolEsports();SOURCE="LoL Esports";syncFails=0}catch(e){
    syncFails++;
    try{list=await fromRobot();SOURCE="robot"}catch(e1){
      try{list=await fromLeaguepedia();SOURCE="Leaguepedia"}catch(e2){list=null}}
  }
  if(!list){list=EMBED.map(m=>({...m}));SOURCE="embarquées"}
  MATCHES=finalize(list);
  lastSync=new Date();
  const rb=SOURCE==="robot"&&SJ&&SJ.built?new Date(SJ.built):null;
  el.className="sync "+(SOURCE==="LoL Esports"?"ok":"warn");
  el.querySelector("span").textContent=SOURCE==="embarquées"?"Hors ligne":rb?"Robot "+fmtTime(rb):fmtTime(lastSync);
  el.title=SOURCE==="embarquées"?"Sources injoignables, données du 23/10 et tes saisies":rb?"LoL Esports ne répond pas : résultats du robot de "+fmtTime(rb)+". Nouvel essai automatique.":"Synchronisé via "+SOURCE+". Toucher pour actualiser.";
  renderLive();
  if(!photosStarted||force){photosStarted=true;loadPhotos(force)}
  scheduleNext();
}
let syncTimer=null, photosStarted=false, syncFails=0;
function scheduleNext(){
  clearTimeout(syncTimer);
  const now=Date.now();
  const hot=MATCHES.some(m=>m.state==="live"||m.state==="wait"||(m.state==="soon"&&new Date(m.start)-now<20*60e3));
  // API injoignable : nouveaux essais rapprochés (3 s, 10 s, 30 s) avant le rythme normal
  syncTimer=setTimeout(()=>sync(false),SOURCE!=="LoL Esports"&&syncFails>=1&&syncFails<=3?[3,10,30][syncFails-1]*1e3:hot?60e3:5*60e3);
}

/* ===================== DIAGNOSTIC : santé des sources, testable depuis chaque téléphone ===================== */
const APP_VERSION="v12.4, 24/10/2026";
const HEALTH={};
const ago=ts=>{if(!ts)return"";const s=(Date.now()-ts)/1000;if(s<60)return"à l’instant";if(s<3600)return`il y a ${Math.round(s/60)} min`;if(s<86400)return`il y a ${Math.round(s/3600)} h`;return`il y a ${Math.round(s/86400)} j`};
function mark(k,ok,ms,err){HEALTH[k]={ok,ms:Math.round(ms),at:Date.now(),err:err?String(err).slice(0,160):null}}
(function instrument(){
  const wrap=(name,key)=>{const f=window[name];if(typeof f!=="function")return;
    window[name]=async function(...a){const t=performance.now();try{const r=await f.apply(this,a);mark(key,true,performance.now()-t);return r}catch(e){mark(key,false,performance.now()-t,e&&e.message||e);throw e}}};
  wrap("leFetch","le");wrap("cargo","lp");wrap("feedWin","feed");
})();
const SRC=[["sj","Stats précalculées (robot GitHub)"],["le","LoL Esports (planning, résultats)"],["feed","Flux direct (kills, or, draft)"],["lp","Leaguepedia (secours)"],["relay","Relais de la ligue"],["dd","Data Dragon (icônes)"]];
function healthRow(k,label){
  const h=HEALTH[k];
  const st=!h?`<span class="hz">pas encore utilisé</span>`:h.ok?`<span class="hok">OK, ${h.ms} ms</span>`:`<span class="hko">Échec</span>`;
  return `<div class="hrow"><b>${label}</b>${st}${h&&!h.ok&&h.err?`<small>${esc(h.err)}</small>`:""}${h?`<small>${ago(h.at)}</small>`:""}</div>`;
}

   <div class="kv frame hx"><dt>Version</dt><dd>${APP_VERSION}</dd><dt>Données matchs</dt><dd>${esc(SOURCE)}${lastSync?`, synchro à ${fmtTime(lastSync)}`:""}</dd><dt>Photos</dt><dd>${ph}/${PLAYERS.length}</dd><dt>Ligue</dt><dd>${lg?`${esc(lg.code)}, ${Object.keys(lg.players).length+1} joueurs, ${DU.open?"flux actif":DU.pollOk?"interrogation régulière":"hors ligne"}`:"aucune"}</dd><dt>Heure du téléphone</dt><dd>${new Date().toLocaleString("fr-FR")}</dd></div>
   <h2>Sources</h2><div id="hlist">${SRC.map(([k,l])=>healthRow(k,l)).join("")}</div>
   <div class="drow2"><button class="btn gold" data-diag="run">Lancer le diagnostic</button><button class="btn" data-diag="sync">Actualiser les données</button></div>
   <div id="dres"></div>
   <p style="margin-top:14px"><button class="btn" data-diag="copy" style="width:100%">Copier le rapport</button></p>
   <p class="small">Le rapport contient l’état des sources et les erreurs, rien de personnel. Colle-le dans la conversation avec Claude pour un correctif ciblé.</p>`;
  openSheet(h,md==="back"?"back":undefined);
}
async function timed(label,fn){const t=performance.now();try{const d=await fn();return {label,ok:true,ms:Math.round(performance.now()-t),d}}catch(e){return {label,ok:false,ms:Math.round(performance.now()-t),d:String(e&&e.message||e).slice(0,160)}}}
let DIAG_LAST=[];
async function runDiag(){
  const box=$("#dres");if(box)box.innerHTML=skel(4);
  const tests=[
    ()=>timed("LoL Esports : planning Worlds",async()=>{const j=await leFetch(`getSchedule?hl=fr-FR&leagueId=${WORLDS_LEAGUE}`);return (j?.data?.schedule?.events||[]).length+" matchs reçus"}),

    ()=>timed("Stats précalculées",async()=>{SJt=0;const s=await loadSJ();if(!s)throw new Error("pas encore générées");const st=Object.keys(s.stale||{});return `générées le ${new Date(s.built).toLocaleString("fr-FR")}, ${s.meta?.duels||0} duels, ${(s.errors||[]).length} erreur(s)${st.length?`, en retard : ${st.join(", ")}`:""}`}),
    ()=>timed("Leaguepedia (secours)",async()=>{const r=await cargo({tables:"Tournaments",fields:"Tournaments.Name=N",where:'Tournaments.OverviewPage LIKE "2026 Season World Championship%"',limit:"1"});return r.length?"réponse OK : "+r[0].N:"réponse vide"}),
    ()=>timed("Relais de la ligue",async()=>{const r=await fetch(NTFY+"iagames-worlds26-ping/json?poll=1&since=1m");if(!r.ok)throw new Error("HTTP "+r.status);return "joignable"}),
    ()=>timed("Data Dragon",async()=>{const r=await fetch("https://ddragon.leagueoflegends.com/api/versions.json");const v=(await r.json())[0];return "patch "+v}),
    ()=>timed("Images (drapeaux, logos)",()=>new Promise((ok,ko)=>{let n=0,bad=[];setTimeout(()=>ko(new Error("pas de réponse en 6 s")),6000);const srcs=["https://flagcdn.com/kr.svg",thumb(LIVE_LOGO.T1||"https://static.lolesports.com/teams/1726801573959_539px-T1_2019_full_allmode.png",160)];srcs.forEach(s=>{const i=new Image();i.onload=()=>{if(++n===srcs.length)bad.length?ko(new Error(bad.join(", "))):ok("chargées")};i.onerror=()=>{bad.push(s.includes("flagcdn")?"drapeaux":"logos");if(++n===srcs.length)ko(new Error("échec : "+bad.join(", ")))};i.src=s})}))
  ];
  const res=[];for(const t of tests){res.push(await t());if(box)box.innerHTML=diagRes(res)}
  DIAG_LAST=res;const hl=$("#hlist");if(hl)hl.innerHTML=SRC.map(([k,l])=>healthRow(k,l)).join("");
}
const diagRes=res=>`<h2>Résultat</h2>${res.map(r=>`<div class="hrow"><b>${esc(r.label)}</b>${r.ok?`<span class="hok">OK, ${r.ms} ms</span>`:`<span class="hko">Échec, ${r.ms} ms</span>`}<small>${esc(r.d)}</small></div>`).join("")}`;
function diagReport(){
  const L=[`Worlds 2026 ${APP_VERSION}`,`Source matchs : ${SOURCE}${lastSync?" à "+fmtTime(lastSync):""}`,`Photos ${PLAYERS.filter(p=>p.photo||p.lePhoto||p.wikiPhoto).length}/${PLAYERS.length}`,`Ligue : ${lg?lg.code+" / "+(Object.keys(lg.players).length+1)+" joueurs / flux "+(DU.open?"SSE":DU.pollOk?"poll":"off"):"aucune"}`,`Navigateur : ${navigator.userAgent}`];

  DIAG_LAST.forEach(r=>L.push(`[test] ${r.label} : ${r.ok?"OK":"ÉCHEC"} ${r.ms} ms, ${r.d}`));

}
async function diagAction(a){
