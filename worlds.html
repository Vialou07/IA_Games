/* team.css — équipes, fiche équipe (module team, porté par l'agent suisse) */
/* swiss.css — phase suisse, calendrier, qui va gagner, fiabilité du robot (module swiss, préfixe .swi-) */
/* ---------- barres et cascade (moment animé 2 de v13.5 : une fois, à l'ouverture de l'onglet ou de l'accueil) ---------- */
.swi-bar{display:block;height:5px;border-radius:9px;background:rgba(240,230,210,.07);overflow:hidden}
.swi-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold3),var(--gold2));transform-origin:0 50%}
.cas .swi-bar i{animation:swiGrow .9s var(--ease) backwards;animation-delay:calc(var(--k,0) * 45ms + 120ms)}
.grid.first .w .swi-bar i{animation:swiGrow .7s var(--ease) backwards;animation-delay:calc(var(--k,0) * 60ms + 300ms)}
@keyframes swiGrow{from{transform:scaleX(0)}}
.swi-i{position:relative}.swi-i::after{content:"";position:absolute;inset:-8px;border-radius:50%}
/* ---------- widgets de l'accueil (B : .tb ; neufs : .swi-wr, .swi-wsg, .swi-wpk) ---------- */
.tb{display:grid;grid-template-columns:20px 46px minmax(0,1fr) 52px;align-items:center;gap:8px;height:20px}
.tb b{font-family:var(--disp);font-size:15.5px;font-weight:700;white-space:nowrap}
.tb em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:17px;color:var(--gold2);font-variant-numeric:tabular-nums;text-align:right}
.tb .br{height:5px}
.swi-wl{gap:8px}
.swi-wr{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.swi-wr>.logo,.swi-wr>.mono{grid-row:1/3}
.swi-wr .grow{min-width:0}
.swi-wr b{display:block;font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.05}
.swi-wr small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-wr em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:19px;color:var(--gold2);font-variant-numeric:tabular-nums}
.swi-wr .swi-bar{grid-column:2/4;height:4px}
.swi-wsg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}
.swi-wsg i{height:4px;border-radius:9px;background:rgba(240,230,210,.1)}.swi-wsg i.d{background:var(--gold)}.swi-wsg i.c{background:var(--teal)}
.swi-wpk{display:flex;gap:5px;margin-bottom:6px;opacity:.85}
/* ---------- tête de la phase suisse : ronde, cinq rondes, compteurs ---------- */
.swi-hd{margin:2px 16px 0;padding:10px 14px;border-radius:var(--r3);background:var(--card);border:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.swi-hl{min-width:0}
.swi-hl b{display:block;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.05;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-hl small{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--muted)}
.swi-ct{display:flex;justify-content:flex-end;gap:12px;font-size:11px;color:var(--muted);white-space:nowrap}
.swi-ct span{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.swi-ct b{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--gold2)}
.swi-ct .cq b{color:var(--teal)}.swi-ct .cx b{color:#F28B9B}
.swi-sg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px;max-width:150px}
.swi-sg i{height:5px;border-radius:9px;background:rgba(240,230,210,.1)}
.swi-sg i.d{background:var(--gold)}.swi-sg i.c{background:linear-gradient(90deg,var(--teal),rgba(10,200,185,.3))}
/* ---------- mon équipe et son parcours ---------- */
.swi-pick{margin-top:4px;min-height:54px;padding-top:5px;padding-bottom:5px}
.swi-pki{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(200,170,110,.14);color:var(--gold);flex:none}
.swi-pki svg{width:22px;height:22px}
.swi-me .bh{margin-bottom:6px}
.swi-chg{margin:-9px -6px -9px auto;height:40px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--gold2)}
.swi-chg:active{background:var(--card2)}
.swi-mt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px}
.swi-mt .grow{flex:1;min-width:0}
.swi-mt b{display:block;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1}
.swi-mt small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.swi-rc{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-family:var(--disp);font-weight:800;font-size:26px;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.swi-trail{display:flex;gap:6px;margin-top:10px}
.swi-ts{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.swi-ts i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:2px solid var(--line2)}
.swi-ts.vic i{border-color:var(--teal)}.swi-ts.def i{border-color:var(--red)}.swi-ts.def i .logo{opacity:.7}
.swi-ts.nxt i{border:2px dashed var(--gold)}
.swi-ts.fut i{border:1.5px dashed rgba(240,230,210,.16);background:transparent}
.swi-ts small{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1}
.swi-ts.vic small{color:var(--teal)}.swi-ts.def small{color:#F28B9B}.swi-ts.nxt small{color:var(--gold2)}
.swi-pips{display:inline-flex;gap:4px}
.swi-pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(232,64,87,.75)}
.swi-pips i.on{background:var(--teal);border-color:var(--teal)}
/* ---------- ronde : titre, groupes par bilan avec l'enjeu ---------- */
.swi-tt{display:flex;align-items:baseline;gap:8px;margin:18px 2px 0;font-family:var(--title);font-weight:700;font-size:16px;color:var(--gold2)}
.swi-tt small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.swi-gh{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;min-width:0}
.swi-gh>b{flex:none;font-family:var(--disp);font-weight:800;font-size:15px;line-height:20px;color:#1A1205;background:linear-gradient(180deg,#F5E3B3,var(--gold));padding:0 9px;border-radius:8px}
.swi-gh>span{min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-gh>em{margin-left:auto;flex:none;font-style:normal;font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold3);border-radius:6px;padding:0 6px}
.swi-gh.sq>span{color:var(--teal)}.swi-gh.sx>span{color:#F28B9B}.swi-gh.sqx>span{color:var(--gold2)}
.swi-gh.bq>b{background:linear-gradient(180deg,#8CF2E9,var(--teal));color:#03201D}
.swi-gh.bx>b{background:linear-gradient(180deg,#F7A3B0,var(--red));color:#fff}
.swi-lead{margin:0 0 6px;font-size:14.5px;font-weight:600;color:var(--gold2);line-height:1.35}
.swi-nx .small{margin:0}
/* ---------- tableau suisse vertical ---------- */
.swi-lgd{display:flex;align-items:center;gap:12px;margin:4px 2px;font-size:12px;color:var(--muted);min-height:40px}
.swi-lgd span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.swi-lgd span i{width:16px;height:3px;border-radius:2px;background:var(--teal)}.swi-lgd span i.ll{background:var(--red)}.swi-lgd span i.lf{background:var(--gold);height:4px}
.swi-lgd .i{margin-left:auto}
.swi-lk{height:40px;color:var(--gold2);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.swi-tree{display:flex;flex-direction:column;margin:0 0 6px}
.swi-t0{position:relative;height:18px}
.swi-tg{position:relative;height:32px}
.swi-tg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.swi-tg path{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.5}
.swi-tg path.ew{stroke:var(--teal)}.swi-tg path.el{stroke:var(--red)}
.swi-tg path.ef{stroke:var(--gold);stroke-width:3.2;stroke-linecap:round;opacity:1}
.swi-rl{position:absolute;left:0;bottom:2px;z-index:1;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:16px;color:var(--dim);background:var(--bg);padding:0 8px 0 0;border-radius:0 8px 8px 0}
.swi-rl.on{color:var(--gold)}
.swi-trw{position:relative}
.swi-nd{position:absolute;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line2);overflow:hidden;transition:transform .15s var(--spring)}
.swi-nd:active{transform:scale(.96);background:var(--card2)}
.swi-nd>b{display:flex;align-items:center;gap:3px;font-family:var(--disp);font-weight:800;font-size:15px;line-height:16px;color:var(--gold2)}
.swi-nd .mk{display:inline-grid;width:13px;height:13px;font-style:normal}.swi-nd .mk svg{width:13px;height:13px}
.swi-nd .lg{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:3px}
.swi-nd .lg i{width:22px;height:22px;display:grid;place-items:center;border-radius:7px}
.swi-nd .lg i.p{opacity:.26;filter:grayscale(.8)}
.swi-nd .lg i.me{box-shadow:0 0 0 2px var(--gold);opacity:1;filter:none}
.swi-nd.cur{border-color:rgba(240,230,210,.26);background:var(--card3)}
.swi-nd.nq{background:linear-gradient(180deg,rgba(10,200,185,.17),var(--card) 75%);border-color:rgba(10,200,185,.5)}.swi-nd.nq>b{color:var(--teal)}
.swi-nd.nx{background:linear-gradient(180deg,rgba(232,64,87,.15),var(--card) 75%);border-color:rgba(232,64,87,.45)}.swi-nd.nx>b{color:#F28B9B}
.swi-nd.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(200,170,110,.22)}
/* ---------- bilans, feuilles d'équipe ---------- */
.swi-tn{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.swi-bv{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.swi-bv b{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.swi-br.out{opacity:.55}
.rowb.me{border-color:rgba(200,170,110,.7);box-shadow:inset 3px 0 0 var(--gold)}
.swi-sl{min-height:54px}
.swi-sh{margin:16px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.swi-ql,.swi-pig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.swi-pig{grid-template-columns:repeat(3,minmax(0,1fr))}
.swi-ql+.swi-lead{margin-top:12px}.swi-lead+.swi-ql{margin-bottom:4px}
.swi-qt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;min-width:0;border-radius:16px;background:var(--card2);border:1px solid var(--line2)}
.swi-qt:active{transform:scale(.96)}
.swi-qt b{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1}
.swi-qt small{font-size:11px;color:var(--muted);font-weight:600}
.swi-qt.out{opacity:.55;background:var(--card)}
.swi-qt.me{border-color:var(--gold)}
/* ---------- phase finale ---------- */
.swi-ko{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.swi-ko.n1{grid-template-columns:minmax(0,1fr)}
.swi-kc{display:flex;flex-direction:column;gap:7px;width:100%;min-width:0;padding:10px 12px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line2);text-align:left}
.swi-kc:active{background:var(--card2)}
.swi-kc.live{border-color:rgba(232,64,87,.6)}.swi-kc.tbd{border-style:dashed;border-color:rgba(200,170,110,.22);background:rgba(12,26,48,.55)}
.swi-kc small{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.swi-kl{display:flex;align-items:center;gap:8px;min-width:0}
.swi-kl b{flex:1;min-width:0;font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-kl em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--gold2);font-variant-numeric:tabular-nums}
.swi-kl.lo{opacity:.45}.swi-kl.kw b{color:var(--gold2)}
.swi-kq{width:22px;height:22px;border-radius:7px;border:1.5px dashed rgba(240,230,210,.2);flex:none}
.swi-kc.tbd{gap:1px;padding:6px 12px;min-height:56px;justify-content:center}.swi-kc.tbd>b{font-family:var(--disp);font-weight:700;font-size:16px;color:#C9D2DC;line-height:1.1}
.swi-ko.n1 .swi-kc:not(.tbd){padding:14px 16px;border-color:var(--line)}.swi-ko.n1 .swi-kl b{font-size:21px}
.swi-champ{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:20px 14px;cursor:pointer}
.swi-cup{width:34px;height:34px;color:var(--gold)}.swi-cup svg{width:100%;height:100%}
.swi-champ b{font-family:var(--title);font-size:22px;color:var(--gold2)}
.swi-champ small{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
/* ---------- qui va gagner : titre ---------- */
.swi-ans{margin:0 0 10px;font-size:13.5px;line-height:1.4;color:#D9DEE5}
.swi-kd{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:rgba(200,170,110,.18);color:var(--gold);font-family:var(--body);font-size:11px;font-weight:700;line-height:16px;letter-spacing:0}
.swi-kd.o{background:rgba(10,200,185,.16);color:var(--teal)}
.swi-now{display:inline-block;padding:1px 8px;border-radius:999px;background:rgba(200,170,110,.18);color:var(--gold);font-size:11px;font-weight:700;line-height:16px}.swi-ans b{color:var(--gold2)}
.swi-fav{position:relative;overflow:hidden;display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:6px 12px;width:100%;padding:10px 12px;border-radius:18px;background:linear-gradient(140deg,rgba(200,170,110,.17),rgba(200,170,110,.04));border:1px solid var(--line)}
.swi-fav>.logo,.swi-fav>.mono{grid-row:1/3}
.swi-fav .grow{min-width:0}
.swi-fav b{display:flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:800;font-size:24px;line-height:1}
.swi-fav small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.swi-fav strong{font-family:var(--disp);font-weight:800;font-size:40px;line-height:.9;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.swi-fav .swi-bar{grid-column:2/4;height:6px}
.cas .swi-fav::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(240,230,210,.2) 50%,transparent 65%);transform:translateX(-110%);animation:swiGlint 1s 1s var(--ease) forwards;pointer-events:none}
@keyframes swiGlint{to{transform:translateX(110%)}}
.swi-tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:3px 12px;width:100%;min-height:52px;padding:8px 4px 7px;border-top:1px solid var(--line2)}
.swi-fav+.swi-tr{border-top:0;margin-top:4px}
.swi-tr:active,.swi-fav:active{background:var(--card2)}
.swi-tr>.logo,.swi-tr>.mono{grid-row:1/3}
.swi-tr .grow{min-width:0}
.swi-tr b{display:flex;align-items:center;gap:2px;font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.1}
.swi-tr small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-tr em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.swi-tr .swi-bar{grid-column:2/4;height:4px}
.swi-spe{margin-top:10px;min-height:50px;padding-top:6px;padding-bottom:6px}
/* ---------- qui va gagner : tableau des 16 ---------- */
.swi-tbl{padding:8px 10px}
.swi-th,.swi-td{display:grid;grid-template-columns:minmax(62px,1.1fr) 34px 46px 46px minmax(76px,1.3fr);align-items:center;gap:4px;width:100%}
.swi-th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);padding:2px 4px 6px}
.swi-th span:not(:first-child),.swi-td>span:not(:first-child){text-align:right}
.swi-td{min-height:42px;padding:0 4px;border-top:1px solid var(--line2);font-family:var(--disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:#D9DEE5}
.swi-td:active{background:var(--card2)}
.swi-td .tn{display:flex;align-items:center;gap:6px;min-width:0}.swi-td .tn b{font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi-td .ti{display:flex;align-items:center;justify-content:flex-end;gap:6px}.swi-td .ti .swi-bar{flex:1;min-width:16px}
.swi-td .ti b{color:var(--gold2);font-weight:800;min-width:38px;text-align:right}
.swi-td.me{background:rgba(200,170,110,.1);border-radius:10px;box-shadow:inset 3px 0 0 var(--gold)}
.swi-td.out{opacity:.45}
/* ---------- feuille d'une équipe : étapes, bilan final, évolution ---------- */
.swi-stp{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.swi-stp div{display:grid;grid-template-columns:60px minmax(0,1fr) 50px;align-items:center;gap:10px;font-size:13.5px;color:#D9DEE5}
.swi-stp b{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--gold2);text-align:right}
.swi-stp .swi-bar{height:7px}
.swi-hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.swi-hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:84px}
.swi-hist i{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--teal)}.swi-hist .hx i{background:var(--red)}.swi-hist .hz i{opacity:.35}
.swi-hist b{font-family:var(--disp);font-size:13px;color:var(--gold2)}.swi-hist span{font-size:11px;color:var(--muted);font-weight:700}
.swi-evo{position:relative;padding:0 0 18px}
.swi-evo svg{display:block;width:100%;height:40px}
.swi-evo polyline{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.swi-evo span,.swi-evo b{position:absolute;bottom:0;font-size:12px;color:var(--muted)}.swi-evo span{left:0}.swi-evo b{right:0;color:var(--gold2)}
.swi-sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.swi-sb .btn{margin-top:14px}.swi-sb .btn:only-child{grid-column:1/3}
.swi-favg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.swi-fo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line2);font-family:var(--disp);font-weight:700;font-size:14px}
.swi-fo:active{transform:scale(.95)}
.swi-fo.on{border-color:var(--gold);background:rgba(200,170,110,.16);color:var(--gold2)}
/* ---------- le robot a-t-il vu juste ? ---------- */
.swi-fs{display:flex;align-items:center;gap:14px}
.swi-fs .ring{width:64px;height:64px}.swi-fs .ring b{font-size:15px}
.swi-fs .grow{flex:1;min-width:0}
.swi-fs strong{display:block;font-family:var(--disp);font-weight:800;font-size:36px;line-height:1;color:var(--gold2)}
.swi-fs span{display:block;font-size:13px;color:#D9DEE5;margin-top:2px;line-height:1.3}
.swi-fs small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.swi-fn{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.swi-bhs{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600}
.swi-fl{display:flex;flex-direction:column}
.swi-fr{display:grid;grid-template-columns:42px minmax(0,1fr) auto 22px;align-items:center;gap:8px;width:100%;min-height:44px;border-top:1px solid var(--line2);font-size:12.5px}
.swi-fr:first-child{border-top:0}
.swi-fr:active{background:var(--card2)}
.swi-fr .d{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.swi-fr .tn{display:flex;align-items:center;gap:5px;min-width:0;font-family:var(--disp);font-size:15px;white-space:nowrap;overflow:hidden}
.swi-fr .tn b{font-weight:600;color:var(--muted)}.swi-fr .tn b.fw{color:var(--gold2);font-weight:800}
.swi-fr .tn i{font-style:normal;color:var(--dim)}
.swi-fr .fv{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.swi-fr .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.swi-fr.ok .mk{background:rgba(10,200,185,.16);color:var(--teal)}.swi-fr.ko .mk{background:rgba(232,64,87,.16);color:var(--red)}
.swi-fr .mk svg{width:13px;height:13px}
.swi-cal>div{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;gap:2px 10px;align-items:center;margin-bottom:8px;font-size:12.5px;color:#D9DEE5}
.swi-cal small{grid-column:2/4;font-size:11px;color:var(--muted)}
.swi-cb{position:relative;display:block;height:12px}
.swi-cb i{position:absolute;left:0;top:0;height:5px;border-radius:9px;background:rgba(240,230,210,.35)}.swi-cb i.r{top:7px;background:var(--teal)}
.swi-cal b{font-family:var(--disp);font-size:15px;color:var(--teal);text-align:right}
/* ---------- calendrier ---------- */
.swi-chips{display:flex;gap:6px;padding:4px 16px 0}
.swi-chip{flex:1 1 auto;min-width:0;justify-content:center;height:40px;padding:0 8px;font-size:13px}
.swi-chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(200,170,110,.32),rgba(200,170,110,.14));border-color:var(--gold);color:var(--gold2)}
.swi-day{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:20px 2px 8px}
.tabc>.swi-day:first-child{margin-top:6px}
.swi-day>b{font-family:var(--title);font-weight:700;font-size:15px;color:var(--gold2)}
.swi-day.now>b{color:var(--gold)}
.swi-day .swi-dx{margin-left:auto;font-size:12px;color:var(--muted)}.swi-dx b{font-family:var(--disp);font-size:15px;color:var(--gold2)}
.swi-day>small{flex-basis:100%;font-size:12px;color:var(--muted)}
.swi-tbd{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:16px;border:1px dashed rgba(200,170,110,.22);background:rgba(12,26,48,.5)}
.swi-tbd time{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.swi-tbd .grow{flex:1;min-width:0}
.swi-tbd b{display:block;font-family:var(--disp);font-weight:700;font-size:16px;color:#D9DEE5}
.swi-tbd small{display:block;font-size:12px;color:var(--muted)}
/* ---------- cadrage : .snug est posé par le socle (fitScr) quand l'écran dépasse de moins de 120 px ; ici les classes du module ---------- */
.snug .swi-hd{padding-top:7px;padding-bottom:7px}
.snug .swi-pick{min-height:48px}
.snug .tabc .blk.swi-me{padding-top:9px;padding-bottom:9px}.snug .swi-me .bh{margin-bottom:2px}
.snug .swi-trail{margin-top:4px}
.snug .swi-tg{height:16px}
.snug .swi-qt{min-height:48px}
.snug .swi-kc.tbd{min-height:44px}
.snug .swi-gh{margin-top:8px;margin-bottom:5px}
.snug .swi-tt{margin-top:8px}
.snug .swi-day{margin-top:10px}
.snug .swi-lgd{margin-top:2px;margin-bottom:2px}
.snug .swi-td{min-height:40px}
.snug .swi-tr{min-height:46px}
.snug .swi-ko{gap:6px}
.snug .swi-ql+.swi-lead{margin-top:6px}
/* stats.css — stats du tournoi, faits (module stats). Composants du socle (.blk .bh .i .keys .key .rowb .list .chip .split .btn) composés, classes propres en .sta-* */
/* ---------- tuiles et côtés (Tournoi) ---------- */
.sta-tl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.sta-t{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:7px 12px;border-radius:var(--r3);background:var(--card2);min-width:0;text-align:left;border:1px solid transparent}
.sta-t b{display:flex;align-items:center;gap:7px;min-width:0;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sta-t b>span{overflow:hidden;text-overflow:ellipsis;font-size:21px}
.sta-t>span{font-size:12px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.sta-t{border-color:var(--line);transition:transform .15s var(--spring)}
button.sta-t:active{transform:scale(.97)}
.sta-sd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sta-sd b{font-family:var(--disp);font-size:17px;font-weight:800;color:var(--gold2)}
.sta-sd .split{height:8px}
/* records : lignes .key du socle */
.sta-rk{min-height:50px;padding:5px 0}
.sta-rk[disabled]{cursor:default}
.sta-rk .kt small{display:flex;align-items:center;flex-wrap:wrap;gap:3px 5px}
.sta-rk .kt small span{display:inline-flex;align-items:center;gap:4px}
.sta-rk .kt small span.sta-win{color:var(--gold2);font-weight:700}
/* entrée « Le saviez-vous ? » */
.sta-fe{margin-top:14px;align-items:center;border-color:var(--line);min-height:64px}
.sta-fk{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sta-fk em{margin-left:auto;font-style:normal;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600}
.sta-ft{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.35;margin-top:3px}

/* ---------- onglets : 5 libellés (« Champions ») lisibles à 360 px ---------- */
.scr:has(.sta) .seg button{font-size:12.5px;padding:0 1px}
/* ---------- en-tête de section hors bloc, contrôle segmenté interne, puces ---------- */
.sta-sg{display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:10px;align-items:center;margin:2px 0 10px}
.sta-sg .sta-seg{margin:0}
.sta-sg .sta-hd{margin:0}
.sta-hd{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sta-hd .i{margin-left:auto}
.sta-seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;padding:3px;border-radius:14px;background:#081329;border:1px solid var(--line);margin-bottom:10px}
.sta-seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;padding:3px 4px;transition:background .2s,color .2s}
.sta-seg button small{font-size:11px;font-weight:500;color:var(--dim)}
.sta-seg button[aria-pressed="true"]{color:var(--gold2);background:linear-gradient(180deg,rgba(200,170,110,.32),rgba(200,170,110,.14));box-shadow:inset 0 0 0 1px rgba(240,230,210,.32)}
.sta-seg button[aria-pressed="true"] small{color:var(--muted)}
.sta .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sta .chip,.sta-ch .chip,.fxc .chip{height:40px;padding:0 13px}
.sta .chip[aria-pressed="true"]{border-color:var(--gold);color:#1A1205;background:linear-gradient(180deg,#E3CB91,var(--gold))}
.sta-ch .chip small{font-size:11px;font-weight:700;color:var(--gold);margin-left:-2px}

/* ---------- Leaders ---------- */
.sta-lt{display:flex;align-items:baseline;gap:8px;margin:2px 2px 6px;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--gold2)}
.sta-lt em{margin-left:auto;font-style:normal;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.sta .list{gap:6px}
.sta .note{margin-top:10px}
.sta-lr{min-height:48px;padding:4px 12px 4px 8px;gap:10px}
.sta-lr[disabled]{cursor:default}
.sta-lr .n{width:18px;flex:none;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--muted)}
.sta-lr:first-child .n{color:var(--gold2)}
.sta-lr .ava,.sta-lr .mono{border-radius:12px}
.sta-lr small{display:flex!important;align-items:center;gap:4px}
.sta-lr .num{font-size:21px}

/* ---------- Champions ---------- */
.sta-ph{margin:0 0 10px;font-size:13.5px;line-height:1.4;color:#D9DEE5}
.sta-ph b{color:var(--gold2)}
.sta-cl{display:flex;flex-direction:column}
.sta-cr{display:grid;grid-template-columns:34px minmax(0,1fr) 56px 42px;align-items:center;gap:9px;width:100%;min-height:48px;padding:6px 0;border-top:1px solid var(--line2);text-align:left}
.sta-cr:first-child{border-top:0}
button.sta-cr:active{background:rgba(240,230,210,.04)}
.sta-cr .g{min-width:0}
.sta-cr .g b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sta-cr .g small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sta-cr .cw{height:6px;border-radius:9px;background:rgba(240,230,210,.07);overflow:hidden}
.sta-cr .cw i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.sta-cr em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:17px;text-align:right;color:var(--gold2);white-space:nowrap}
.sta-more{margin-top:8px;height:44px}
/* feuille d'un champion */
.sta-shd{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.sta-shd .chi{border-radius:14px}
.sta-shd p{margin:0!important}
#shB .sta-tl{margin-bottom:12px}
#shB .sta-t b{font-size:24px}
#shB .sta-t>span{white-space:normal}
.sta-h4{margin:4px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sta-who{display:flex;flex-direction:column}
.sta-wp{display:grid;grid-template-columns:30px minmax(0,1fr) auto 12px;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 0;border-top:1px solid var(--line2);text-align:left}
.sta-wp:first-child{border-top:0}
div.sta-wp{grid-template-columns:minmax(0,1fr) auto}
.sta-wp .g b{display:block;font-family:var(--disp);font-weight:700;font-size:16px}
.sta-wp .g small{display:block;font-size:11.5px;color:var(--muted)}
.sta-wp em{font-style:normal;font-size:12.5px;color:var(--muted);text-align:right}

/* ---------- Ligues ---------- */
.sta-lgh,.sta-lgr summary,.sta-lgr .sm{display:grid;grid-template-columns:minmax(64px,92px) minmax(0,1fr) 46px 42px 12px;align-items:center;gap:8px}
.sta-lgh{font-size:11px;color:var(--muted);margin:-2px 0 2px}
.sta-lgh span:nth-child(2){grid-column:2/4}
.sta-lgh span:nth-child(3){grid-column:4/6;text-align:right;white-space:nowrap}
.sta-lgr{border-top:1px solid var(--line2)}
.sta-lgh+.sta-lgr{border-top:0}
.sta-lgr summary,.sta-lgr .sm{min-height:42px;padding:3px 0}
.sta-lgr summary{list-style:none;cursor:pointer}
.sta-lgr summary::-webkit-details-marker{display:none}
.sta-lgr .lc{min-width:0;line-height:1.1}
.sta-lgr .lc b{display:block;font-family:var(--disp);font-weight:800;font-size:17px}
.sta-lgr .lc small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sta-lgr .br{height:7px;border-radius:9px;background:rgba(240,230,210,.06);overflow:hidden}
.sta-lgr .br i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#08877D,var(--teal))}
.sta-lgr em{font-style:normal;font-family:var(--disp);font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sta-lgr .fv{font-size:15px;color:var(--gold2)}
.sta-lgr .wl{font-size:16px;color:var(--muted)}
.sta-lgr .wl.up{color:var(--teal)}.sta-lgr .wl.dn{color:var(--red)}
.sta-lgr .chev{transition:transform .2s;text-align:center}
.sta-lgr[open] .chev{transform:rotate(90deg)}
.sta-ls{padding:2px 0 10px}
.sta-ans{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line2);font-size:13px;line-height:1.4;color:var(--muted)}
.sta-ans b{color:var(--gold2)}
.sta-lgv{margin-top:10px}
.sta-vv{display:grid;grid-template-columns:52px 70px 52px minmax(0,1fr);align-items:center;gap:6px;min-height:30px;font-size:13px}
.sta-vv b{font-family:var(--disp);font-weight:800;font-size:15px}
.sta-vv b:nth-child(3){color:var(--muted)}
.sta-vv span{font-family:var(--disp);font-weight:700;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.sta-vv small{text-align:right;color:var(--muted);font-size:12px}

/* ---------- Chiffres : une ligne par chiffre, qui se déplie ---------- */
.sta-nr{border-top:1px solid var(--line2)}
.sta-nr:nth-child(2){border-top:0}
.sta-nr>summary{display:grid;grid-template-columns:62px minmax(0,1fr) 12px;gap:10px;align-items:center;min-height:58px;padding:7px 0;list-style:none;cursor:pointer}
.sta-nr>summary::-webkit-details-marker{display:none}
.sta-nr .chev{transition:transform .2s;text-align:center}
.sta-nr[open] .chev{transform:rotate(90deg)}
.sta-nn{display:flex;align-items:center;gap:5px;justify-content:center;font-family:var(--disp);font-weight:800;font-size:34px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.sta-nn .flag{width:20px;height:14px}
.sta-nt{min-width:0}
.sta-nt>span:first-child{display:block;font-size:13.5px;line-height:1.3}
.sta-pv{display:flex;align-items:center;gap:5px;margin-top:5px;min-width:0;overflow:hidden;white-space:nowrap}
.sta-pv em,.sta-fc em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted);margin-left:2px}
.sta-fc{display:flex;align-items:center;margin-top:5px}
.sta-fc>span{display:inline-flex}
.sta-fc .ava,.sta-fc .mono{border:2px solid var(--card);border-radius:50%!important;margin-left:-7px}
.sta-fc>span:first-child .ava,.sta-fc>span:first-child .mono{margin-left:0}
.sta-ch{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
.sta-fl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.sta-fl span{display:inline-flex;align-items:center;gap:5px;min-height:24px}
.sta-fl small{font-family:var(--disp);font-size:15px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}

/* ---------- faits ---------- */
.fx3{font-size:14px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px}
.fxc{position:relative;border-radius:var(--r1);padding:20px 18px;min-height:300px;display:flex;flex-direction:column;border:1px solid transparent;cursor:pointer;touch-action:pan-y;
  background:linear-gradient(160deg,#10223F,var(--card) 60%) padding-box,linear-gradient(140deg,rgba(200,170,110,.6),rgba(200,170,110,.08) 40%,rgba(200,170,110,.08) 60%,rgba(200,170,110,.5)) border-box}
.fxc p{font-size:21px;line-height:1.35;margin:14px 0 0;font-weight:500}
.fxc .ft{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.fxc .chip .chi{width:20px!important;height:20px!important;border-radius:6px}
.fxn{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.fxn button{flex:1;height:48px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-weight:700;text-align:center}
.fxn button:active{transform:scale(.97)}
.fxn span{font-family:var(--disp);font-weight:700;color:var(--muted);min-width:60px;text-align:center}
.sta-all{margin-top:10px;height:46px;color:var(--muted)}
.sta-all small{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--gold2)}
.nw{font-size:10.5px;font-weight:800;color:#04211F;background:var(--teal);border-radius:6px;padding:1px 6px;letter-spacing:0;text-transform:none}
.sta-fxl .rowb{align-items:center;min-height:64px}
.sta-fxl .rowb small{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.sta-fxl .sta-ft{-webkit-line-clamp:3}
/* faits d'une fiche (staFactsBlk) */
.sta-fm{display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line2)}
.sta-fm:nth-child(2){border-top:0;padding-top:0}
.sta-fmt{min-height:40px;font-size:14px;line-height:1.4;text-align:left}
.sta-fmt:active{opacity:.7}
/* league.css — paris et ligue (module league) : Mes paris, Ligue, membre, formulaire, blocs de la fiche de match */
/* avatars (initiale sur la couleur du joueur ; robot en icône) */
.dav{display:inline-grid;place-items:center;flex:none;border-radius:50%;font-family:var(--disp);font-weight:800;color:#1A1205;line-height:1;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.dav.dbot{background:#0B2233;color:var(--teal);box-shadow:inset 0 0 0 1.5px rgba(10,200,185,.55)}
.dav.dbot svg{width:58%;height:58%}
/* pastilles et petits signes */
.lea-n{font-style:normal;display:inline-block;min-width:18px;font-size:11px;font-weight:800;line-height:16px;background:rgba(200,170,110,.24);color:var(--gold2);border-radius:999px;padding:0 5px;margin-left:3px;vertical-align:1px}
.lea-sync{display:inline-flex;align-items:center;gap:5px}
.lea-sync i{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.lea-sync.on i{background:var(--teal);box-shadow:0 0 8px var(--teal)}.lea-sync.ko i{background:var(--red)}
.lea-dots{display:inline-flex;gap:3px;flex:none}.lea-dots i{display:block;width:7px;height:7px;padding:0;border-radius:50%;background:var(--red);opacity:.85}.lea-dots i.o{background:var(--teal);opacity:1}
.lea-pill{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:999px;border:1px solid rgba(200,170,110,.5);color:var(--gold2);font-family:var(--body);font-size:10.5px;font-weight:700;white-space:nowrap;flex:none;letter-spacing:0;text-transform:none}
.lea-pill i{font-style:normal;color:var(--gold)}
.lea-pill.t{border-color:rgba(10,200,185,.55);color:#9FF3EA}.lea-pill.t i{color:var(--teal)}
.lea-pill.x{border-color:var(--line2);color:var(--muted)}
.lea-pills{display:inline-flex;gap:4px;margin-left:6px;vertical-align:-3px}
.lea-st{font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(240,230,210,.08);color:var(--muted);white-space:nowrap;flex:none}
.lea-st.ok{background:rgba(10,200,185,.16);color:var(--teal)}.lea-st.ko{background:rgba(232,64,87,.14);color:#FF8A9A}
.lea-foot{margin:10px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.lea-ico{width:12px;height:12px;vertical-align:-1px;color:var(--teal)}
/* boutons */
.btn.lea-gold{background:linear-gradient(180deg,#E3CB91,var(--gold) 55%,#A8874E);color:#1A1205;border-color:var(--gold2);box-shadow:0 0 18px rgba(200,170,110,.35)}
.btn.lea-quit{background:transparent;border-color:rgba(232,64,87,.45);color:#FF8A9A;margin-top:14px}
.btn.lea-danger{background:var(--red);border-color:transparent;color:#fff}
.lea-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}.lea-two .btn{margin:0}
.lea-mini{height:40px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--gold2);flex:none}
.lea-mini:active{transform:scale(.96)}
.lea-more{margin-top:10px!important}
.rowb.lea-mv{margin-top:14px}.rowb.lea-mv.in{margin-top:12px;background:var(--card2)}
.lea-mv .chev{font-size:22px}

/* ---------- Mes paris ---------- */
.lea-qbk{padding:4px 14px}
.qb{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 40px;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line2)}
.qb:first-child{border-top:0}
.qb time{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--gold2);line-height:1.05;font-variant-numeric:tabular-nums}
.qb time small{display:block;font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--muted)}
.qb .pkb{position:relative;height:48px;font-size:18px;border-radius:15px;gap:7px;min-width:0;padding:0 6px}
.qb .pkb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lea-rb{position:absolute;top:-8px;right:6px;font-style:normal;font-family:var(--body);font-size:10px;font-weight:700;line-height:15px;padding:0 6px;border-radius:999px;background:#07182A;color:var(--teal);border:1px solid rgba(10,200,185,.5);white-space:nowrap}
.qb .go{height:44px;border-radius:12px;color:var(--gold);font-size:24px;text-align:center}
.qb .go:active{background:var(--card2)}
/* score exact sous la ligne */
.lea-sc{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:0 0 12px}
.lea-scl{font-size:10.5px;line-height:1.2;color:var(--muted);font-weight:600}.lea-scl b{display:block;color:var(--gold);font-weight:700}
.lea-scc{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.lea-sc .chip,.lea-scc .chip{height:40px;justify-content:center;padding:0 6px;font-family:var(--disp);font-size:15.5px;font-weight:700;border-radius:12px}
.chip[data-score][aria-pressed="true"]{background:linear-gradient(180deg,#E3CB91,var(--gold) 55%,#A8874E);color:#1A1205;border-color:var(--gold2)}
/* en cours */
.lea-lc{display:flex;flex-direction:column;gap:0;border-radius:16px;background:var(--card);border:1px solid var(--line2);overflow:hidden}
.lea-lc .mrow{border:0;border-radius:0;background:transparent}
.lea-lcf{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:2px 12px 10px}
.lea-myp{display:inline-flex;align-items:center;gap:7px}.lea-myp b{font-family:var(--disp);font-weight:800;font-size:18px}
.lea-myn{font-size:13px;color:var(--muted)}
.lea-spt{flex-basis:100%;font-size:12px;color:var(--muted)}
.lea-myr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
/* bilan */
.lea-bilh{display:flex;align-items:center;gap:16px}
.ring.lea-ring{width:92px;height:92px}.ring.lea-ring b{font-size:22px}
.lea-bilh .tx{min-width:0}.lea-bilh .tx b{display:block;font-family:var(--disp);font-weight:800;font-size:36px;line-height:1;color:var(--gold2)}
.lea-bilh .tx span{display:block;font-size:13px;color:var(--muted)}
.lea-bilh .tx small{display:block;font-size:12.5px;color:var(--gold);font-weight:600;margin-top:4px}
.lea-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 8px 0}
.lea-empty b{font-family:var(--disp);font-size:20px;font-weight:700}
.lea-empty span{font-size:13.5px;color:var(--muted)}
.lea-empty .btn{margin-top:14px}
.lea-eic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--teal);border:1.5px solid rgba(10,200,185,.5);margin-bottom:6px}.lea-eic svg{width:24px;height:24px}

/* ---------- Ligue : classement ---------- */
.lea-lb{display:flex;flex-direction:column}
.lea-lbk{padding:6px 14px}
.lea-lbk .bh{margin:8px 0 4px}
.lea-r{display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto 34px;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 0;border-top:1px solid var(--line2);text-align:left}
.lea-r:first-child{border-top:0}
.lea-lb.sm .lea-r{grid-template-columns:22px 30px minmax(0,1fr) 34px;min-height:52px}
.lea-r:active{opacity:.75}
.lea-r .k{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--muted);text-align:center}
.lea-r:first-child .k{color:var(--gold)}
.lea-r .nm{min-width:0}
.lea-r .nm b{display:block;font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lea-r .nm b small{font-family:var(--body);font-size:11px;font-weight:700;color:#1A1205;background:var(--gold);border-radius:6px;padding:0 5px;vertical-align:2px;margin-left:2px}
.lea-r .nm>small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.lea-r em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:24px;color:var(--gold2);text-align:right;font-variant-numeric:tabular-nums}
.lea-r.me .nm b{color:var(--gold2)}
.lea-r.bot .nm b{color:#CFE9EC}
/* podium */
.lea-podk{padding:12px 12px 10px}
.lea-pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px}
.lea-pod .pod{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;width:100%}
.lea-pod .pod b{max-width:100%;font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.lea-pod .pod .pt{font-size:12px;color:var(--muted);font-weight:600}

// profil emporté d'un autre navigateur (lien « …#moi=… ») : chaque navigateur a sa propre mémoire (Messenger, Chrome, icône
// d'écran d'accueil…). On le reprend avant de lire quoi que ce soit, puis on efface le lien de la barre d'adresse.
const MOVE_KEYS=["league","picks","manual","scores","fav","myname"];
let IMPORTED=null;
(function importProfile(){
  if(!location.hash.startsWith("#moi="))return;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5).replace(/-/g,"+").replace(/_/g,"/")))));
    const cur=LS.get("league",null),who=(d.league&&d.league.me&&d.league.me.name)||d.myname||"ce lien";

      MOVE_KEYS.forEach(k=>{if(d[k]!==undefined)LS.set(k,d[k])});IMPORTED=who;
    }
  }catch(e){}
  history.replaceState(null,"",location.pathname+location.search);
})();
function moveLink(){
  const d={v:1};MOVE_KEYS.forEach(k=>{const v=LS.get(k,undefined);if(v!==undefined)d[k]=v});
  const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  let x=enc(d);if(x.length>12000&&d.league){d.league={...d.league,players:{}};x=enc(d)}   // les paris des autres reviennent par la ligue
  return location.origin+location.pathname+"#moi="+x;
}
async function moveProfile(){
  const url=moveLink(),text="Mon profil Worlds 2026 (ligue et paris) : ouvre ce lien dans le navigateur où tu veux continuer.";
  try{if(navigator.share){await navigator.share({title:"Mon profil Worlds",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}

}

/* ===================== cadrage : un écran qui tient ne bouge pas =====================
   .scrin fait au moins la hauteur de l'écran ; quand le contenu tient (en rognant au besoin la marge du bas jusqu'à 12 px
   au-dessus de la barre d'accueil de l'iPhone), l'écran reçoit .fit : défilement coupé, donc ni « mini défilement » ni rebond.
   Surveillé par ResizeObserver (contenu qui arrive, onglet changé, rotation). Mesure : SAB = safe-area-inset-bottom en px. */

  if(f!==s.classList.contains("fit")){s.classList.toggle("fit",f);if(f)s.scrollTop=0}}
/* un nouveau contenu est cadré avant d'être peint (pas de saut) ; ce qui change ensuite (images, blocs
   asynchrones, rotation) est recadré à l'image suivante : changer la taille d'un élément observé pendant le rappel du
   ResizeObserver provoque « ResizeObserver loop completed with undelivered notifications » (erreur affichée par Safari) */

/* ===================== typographie française automatique =====================
   Tout texte posé dans la page : espace insécable U+00A0 avant « : », espace fine U+202F avant « ; ? ! % » et après « / avant ».
   Appliqué à chaque nœud texte ajouté ou modifié (MutationObserver) : les textes de B et les rendus repris de v13.5 en profitent
   sans qu'on retouche leurs chaînes. Écrire tout de même les nouveaux textes avec NB (U+202F) et U+00A0. */

/* ===================== planning : LoL Esports → robot → embarqué ===================== */
const SYNC={busy:false,p:null,fails:0,off:false,started:0};
function sync(){
  if(SYNC.p)return SYNC.p;
  SYNC.busy=true;paintPill();
  return SYNC.p=(async()=>{let list=null;
    try{
      try{list=await fromLolEsports();SOURCE="LoL Esports";SYNC.fails=0}
      catch(e){SYNC.fails++;try{await loadSJ();list=await fromRobot();SOURCE="robot"}catch(e2){list=null}}
      if(list){MATCHES=finalize(list);lastSync=new Date();SYNC.off=false}
      else if(!MATCHES.length||SOURCE==="hors ligne"){MATCHES=finalize(EMBED.map(m=>({...m})));SOURCE="hors ligne";SYNC.off=true}
      else{MATCHES=finalize(MATCHES);SYNC.off=true}            // sources injoignables : on garde la dernière synchro réussie
    }finally{SYNC.busy=false;SYNC.p=null;scheduleNext()}      // quoi qu'il arrive, la synchro suivante est programmée
    onData();
    if(!loadPhotos.done){loadPhotos.done=true;loadPhotos().catch(()=>{})}
  })();

function scheduleNext(){
  clearTimeout(sync.t);const now=Date.now();
  const hot=MATCHES.some(m=>m.state==="live"||m.state==="wait"||(m.state==="soon"&&new Date(m.start)-now<20*60e3));
  // LoL Esports injoignable : nouveaux essais rapprochés (3 s, 10 s, 30 s), puis toutes les minutes tant qu'on vit sur le planning
  // du robot ou hors ligne (retour à LoL Esports dans la minute où il répond à nouveau) ; sinon 60 s si un match est chaud, 5 min
  const deg=SOURCE!=="LoL Esports"&&SYNC.fails>=1,ms=deg&&SYNC.fails<=3?[3,10,30][SYNC.fails-1]*1e3:hot||deg?60e3:5*60e3;
  sync.t=setTimeout(sync,ms);SYNC.next=now+ms;

/* =====================================================================================
   home.js — ACCUEIL et BILAN D'UNE SOIRÉE (propriétaire : agent socle)
   Une grille de widgets arrondis qui suit le moment (homeMoment, règles de v13.5) :
     live  match en cours ou résultat en attente : héros en direct, ton prono, mes paris, ensuite, classement, fait…
     soon  coup d'envoi dans moins de 75 min : héros avec compte à rebours, pari en un geste, clé du robot, qui a parié
     day   jour de match, avant : héros du prochain match, ce soir, mes paris, hier soir (bilan replié)…
     after soirée finie, et le lendemain jusqu'à 11 h (le « matin ») : bilan de la soirée en grand (podium, meilleure
           soirée, surprises du robot), prochain match, mes paris, ligue…
     rest  jour sans match : qui va gagner en grand, prochain match (ou le prochain tirage), le saviez-vous…
     final finale jouée : champion du monde, bilan, ligue.
   ?mo=live|soon|day|after|rest force un moment (tests). Toujours en bas : les sections (Matchs, Suisse, Équipes, Joueurs,
   Stats, Ligue). CADRAGE : chaque widget a une hauteur fixe (w22 284 px, héros d'avant-match 300, w21 112, w11 136 par
   paire, sections 84) ; homFit retire les widgets les moins utiles du moment tant que l'accueil dépasse 1,5 écran, puis
   s'il ne dépasse que de moins de 120 px (le « mini défilement ») : l'accueil tient dans l'écran, ou défile franchement.
   Widgets des modules : widget("bets"|"league"|"livebets"|"sim"|"rank"|"fact") ; ici : héros, ce soir / ensuite,
   prochain match, calendrier, bilan (grand et replié), mon équipe, champion du monde, sections.
   Écran eve/<jour> : bilan d'une soirée (Résumé : tes paris, meilleure soirée de la ligue, podium des joueurs, le robot ;
   Résultats). Podium : extrait de v13.5 (funEveLines, funPodium, funWhy ; données SJ.fu.g du robot, sinon feuilles du flux).
   ===================================================================================== */
let HM=null;   // dernier moment calculé (compatibilité : les rendus de ligue de v13.5 lisent HM.k)
function homeMoment(){
  const now=Date.now(),dk=dayKeyL(new Date()),dayOf=x=>dayKeyL(new Date(x.start)),ok=x=>x.t1&&x.t2;
  /* un résultat en attente depuis plus de 8 h (sources coupées, données embarquées d'un autre jour) ne fait plus de l'accueil
     un « direct » : il reste dans le calendrier et sa fiche, où l'on peut saisir le vainqueur */
  const live=MATCHES.find(x=>x.state==="live")||MATCHES.find(x=>x.state==="wait"&&now-new Date(x.start)<8*3600e3),next=MATCHES.find(x=>x.state==="soon"&&ok(x))||null;
  let last=null;for(let i=MATCHES.length-1;i>=0;i--)if(MATCHES[i].winner&&ok(MATCHES[i])){last=MATCHES[i];break}
  const ldk=last&&dayOf(last);
  // soirée récente (aujourd'hui ou hier) dont tous les matchs sont joués : son bilan (v13.5, 1641)
  const recent=ldk&&(ldk===dk||ldk===dayKeyL(new Date(now-864e5)))&&MATCHES.every(x=>!ok(x)||x.winner||dayOf(x)!==ldk)?ldk:null;
  let k;
  if(live)k="live";else if(next&&new Date(next.start)-now<75*60e3)k="soon";
  else if(recent&&(recent===dk||new Date().getHours()<11))k="after";
  else k=MATCHES.some(x=>ok(x)&&!x.winner&&dayOf(x)===dk)?"day":"rest";
  if(["live","soon","day","after","rest"].includes(FORCE_MO))k=FORCE_MO;
  if(k==="live"&&!live)k="soon";
  const champ=MATCHES.find(x=>x.stage==="f"&&x.winner&&ok(x))||null;
  return {k,live,next,recent,last:ldk,champ};
}

/* la clé du robot en une ligne (moKey de v13.5 : son favori et son meilleur poste, SJ.pm) */
function homKey(m){try{const p=robotProb(m);if(p==null)return"";const f=p>=.5?m.t1:m.t2,pf=Math.round(Math.max(p,1-p)*100);
  const row=typeof pmRow==="function"&&SJ&&SJ.pm?pmRow(m):null,K=row&&Array.isArray(row[7])?row[7]:[],fv=K.find(k=>k[0]==="fav"),ps=K.find(k=>k[0]==="postes");
  if(fv&&ps&&fv[1]===f){const b=K.find(k=>k[0]==="poste"&&((k[4]>0)===(f===row[1])));
    return `<b>${esc(tid(f))}</b> mieux noté à ${ps[2]} poste${ps[2]>1?"s":""} sur 5${b&&typeof ROLE_AU!=="undefined"?`, surtout ${ROLE_AU[b[1]]} (${pnm(b[4]>0?b[2]:b[3])})`:""}`}

/* Résumé : tes paris (une ligne) et le podium des joueurs ; Résultats : le robot (bons favoris, surprises) puis les matchs */

    :`<div class="list">${P2.map((o,i)=>{const x=o.x,pl=x.k?pkey(x.k):null;return `<button class="rowb evp" data-info="${xi("pod|"+E.dk+"|"+i,()=>[`${i+1}. ${x.n}`,`<p>${esc(x.n)} (${esc(funTm(x.tm))}), ${esc(x.c||"?")} contre ${esc(funTm(x.op))} : ${funWhy(o,true)}. ${x.w?"Victoire":"Défaite"}.</p>${x.k?`<button class="btn" data-p="${esc(x.k)}">Fiche de ${esc(x.n)}</button>`:""}`,true])}"><span class="evr r${i+1}">${i+1}</span>${pl?photo(pl,"ava",40):`<span class="ava" style="width:40px;height:40px"></span>`}<span class="grow"><b class="nm">${esc(x.n)}</b><small>${esc(funTm(x.tm))} · ${esc(x.c||"?")} contre ${esc(funTm(x.op))}</small></span><span class="evw">${funWhy(o)}</span></button>`}).join("")}</div>`;

/* =====================================================================================
   match.js — FICHE DE MATCH (propriétaire : agent match). Un écran (route m/<id>/<onglet>), trois états :
   - à venir : Aperçu (robot, ton prono, clés, où regarder) · Joueurs (duel par poste) · Draft (fearless, bans, picks) · Équipes ;
   - en direct (et en attente du résultat) : HUD en tête, Direct (fil, courbe d'or, bascule, records, fights, duels, joueur du
     match) · Joueurs (tableau fusionné) · Draft (draft de la partie ; entre deux parties : la suite de la série) · Parties
     (dès la 1re partie finie) · Avant (paris, robot, clés, duels par poste, équipes) ;
   - terminé : Résumé · Parties (série) · Joueurs · Draft (contre nos pronos) · Avant.
   Moteur du direct (liveTick, watchLive, paintLive → BUS "live") : une partie suivie, toutes les 10 s (30 s onglet caché),
   repeinture par blocs (matPatch) : pas de saut, onglet, défilement et feuilles ouvertes gardés. Duel de deux joueurs (route d/).
   Calculs repris de v13.5 (src/legacy/match.list.js), rendus au style de B : la réponse à l'écran (N1), le détail en feuille au
   toucher (N2), la méthode derrière « i » (N3). Données asynchrones : mêmes clés de cache w26_ak_* que v13.5 (matAk).
   Conventions : nouveaux noms préfixés mat, classes .mat-* ; les noms repris de B (scrMatch, hudHTML…) gardent leur nom.
   ===================================================================================== */

/* ===================== 0. outils ===================== */
const MAT_VF="https://www.twitch.tv/otplol_",MAT_LES="https://lolesports.com/fr-FR/";
const IPLAY=`<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>`;
const matKind=m=>m.state==="done"?"done":(m.state==="live"||m.state==="wait")?"live":"soon";
const matN=m=>(m.s1||0)+(m.s2||0);
const matMid=m=>m&&/^le\d/.test(String(m.id))?String(m.id).slice(2):null;
const matCity=m=>{const v=VENUES[m.stage]||"",i=v.lastIndexOf(", ");return i>0?v.slice(i+2):v};
const matDur=v=>v==null?"":Math.floor(v)+":"+String(Math.round(v%1*60)%60).padStart(2,"0");
const matOn=L=>!!(L&&L.frame&&L.status!=="between"&&L.status!=="waiting"&&L.status!=="starting"&&L.status!=="nolive");
const matPc=v=>Math.round(v*100)+NB+"%";
/* côté de t1 dans la partie suivie : A = t1, B = t2 (bleu ou rouge selon la partie) */
function sideFrame(L,m){const f=L.frame;if(!f)return null;const aBlue=L.blue!==m.t2;return {A:aBlue?f.blueTeam:f.redTeam,B:aBlue?f.redTeam:f.blueTeam,aBlue}}
function liveP(L,m){const f=L.frame;const p=winProb(f,gameMins(L));return L.blue!==m.t2?p:1-p}
const matCol=(m,t)=>t===m.t2?cB(m):cA(m);
/* une ligne qui répond (niveau 1) et ouvre le détail (feuille, niveau 2) ; sans détail : une simple ligne */

function matSheetRefresh(){if(!SHEET.open)return;const mk=document.querySelector("#shB [data-matlive]");if(!mk)return;const k=mk.dataset.matlive,r=MAT_LS.get(k);if(!r)return;
  const h=safe(r.fn);if(!h)return;const html=`<h3 id="shT">${esc(r.title)}</h3>${h}<i data-matlive="${esc(k)}" hidden></i>`,b=$("#shB");if(b._mh===html)return;
  const s=$("#sheet"),y=s.scrollTop;b._mh=html;b.innerHTML=html;s.scrollTop=y}
/* données asynchrones de v13.5 (ablock et son cache w26_ak_<clé>, mêmes clés et mêmes données que la prod : les caches des potes
   servent tout de suite). Rend les données, undefined pendant le chargement (l'écran se redessine à l'arrivée), null si échec. */
function matAk(key,fn,ttl){let a=AK[key];if(!a){ablock(key,fn,()=>"",ttl);a=AK[key]}
  if(a.st==="ok")return a.data;if(a.st==="err")return null;
  if(!a.started){a.fn=fn;runAk(key).then(matRedraw,matRedraw)}return undefined}
const matErr=k=>`<div class="aerr"><span>Données injoignables pour l’instant.</span><button class="btn" data-matretry="${esc(k)}">Réessayer</button></div>`;
function matRedraw(){if(matRedraw.r)return;matRedraw.r=requestAnimationFrame(()=>{matRedraw.r=0;NAV.forEach(x=>{if(x.el.isConnected&&(x.d.v==="m"||x.d.v==="d"))rerender(x.el)})})}
/* repeinture par blocs : seuls les blocs dont le HTML change sont remplacés (images, défilement, feuilles gardés) */
function matPatch(c,html){
  if(c._h===html)return;c._h=html;
  const t=document.createElement("template");t.innerHTML=html;const nw=[...t.content.children],old=[...c.children];
  if(nw.length!==old.length||nw.some((n,i)=>n.tagName!==old[i].tagName||n.dataset.pk!==old[i].dataset.pk)){c.innerHTML=html;[...c.children].forEach(x=>{x._src=x.outerHTML});return}
  nw.forEach((n,i)=>{const o=old[i],src=n.outerHTML;if(o._src===src)return;o.replaceWith(n);n._src=src});
}
/* ligue : blocs fournis par league.js et placés ici (score exact M-04 : leaScoreHTML ; ton prono et tes points M-05 : leaMyHTML ;

function matLea(fn,...a){const f=fn==="score"?(typeof leaScoreHTML==="function"?leaScoreHTML:null):fn==="my"?(typeof leaMyHTML==="function"?leaMyHTML:null):(typeof leaMatchHTML==="function"?leaMatchHTML:null);

const matWatch=()=>`<div class="mat-watch" data-pk="watch"><a class="btn mt0" href="${MAT_VF}" target="_blank" rel="noopener">${IPLAY}Regarder en VF</a><a class="btn mt0" href="${MAT_LES}" target="_blank" rel="noopener">LoL Esports</a></div>`;

/* identifiant stable pour les dégradés et découpes SVG (même tracé : même id, la repeinture garde le bloc) */
const matHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};

/* ===================== 1. écran du match ===================== */
function scrMatch(d){
  const m=mOf(d.id);if(!m)return {title:"Match",body:MATCHES.length?`<p class="empty">Match introuvable.</p>`:skel(200)};
  if(!("_t0" in d))d._t0=d.tab||null;
  const kind=matKind(m),fresh=()=>mOf(d.id)||m;d._k=kind;
  const title=`<span class="mh">${m.t1?logo(m.t1,20):""}${esc(tid(m.t1)||"?")} – ${esc(tid(m.t2)||"?")}${m.t2?logo(m.t2,20):""}</span><small>${esc(stageLab(m))} · Bo${m.bo}</small>`;
  const base={title,opened:matOpened,mount:matMount,skipData:x=>{const z=mOf(x.id);return !!z&&x._k==="live"&&matKind(z)==="live"}};
  if(!m.t1||!m.t2)return {...base,info:"prono",head:matHead(m),headKey:"tbd"+m.start,body:`<p class="empty">Affiche pas encore connue : elle dépend du tirage.</p>`};
  if(kind==="soon")return {...base,info:"prono",head:matHead(m),headKey:"soon"+m.start+m.t1+m.t2,tabs:[["ov","Aperçu"],["pl","Joueurs"],["dr","Draft"],["eq","Équipes"]],
    render:t=>{const x=fresh();return t==="pl"?matTabRoles(x):t==="dr"?matTabDraftSoon(x):t==="eq"?matTabTeams(x):matTabOverview(x)},needs:[loadFJ(),loadDJ()]};
  if(kind==="live"){if(LV.watch!==m.id)watchLive(m);
    const tabs=[["di","Direct"],["pl","Joueurs"],["dr","Draft"]];if(matN(m)>0&&matMid(m))tabs.push(["gm","Parties"]);tabs.push(["av","Avant"]);
    return {...base,info:"direct",head:hudHTML(m),tabs,
      render:t=>{const x=fresh();return t==="pl"?matTabLivePlayers(x):t==="dr"?matTabLiveDraft(x):t==="gm"?matTabGames(x,d):t==="av"?matTabBefore(x):matTabDirect(x)},needs:[loadDJ(),loadFJ(),champMap()]}}
  const G=matGames(m),tabs=[["ov","Résumé"]];if(G.length>1||(m.bo===1&&G.length))tabs.push(["gm",G.length>1?"Parties":"Partie"]);tabs.push(["pl","Joueurs"],["dr","Draft"],["av","Avant"]);
  return {...base,info:"termine",head:resultHead(m),headKey:"done"+m.s1+m.s2+m.winner,tabs,
    render:t=>{const x=fresh();return t==="gm"?matTabGames(x,d):t==="pl"?matTabDonePlayers(x,d):t==="dr"?matTabDraftDone(x,d):t==="av"?matTabBefore(x):matTabSummary(x,d)},needs:[loadDJ()]};
}
function recTxt(t,R){const r=R[t];if(!r)return"";const s=r.sw.w+r.sw.l;return s?`suisse ${r.sw.w}-${r.sw.l}`:(T[t]&&T[t].seed)||""}
const matSide=(t,sub,dim)=>t?`<button class="side" data-t="${esc(t)}" aria-label="Fiche ${esc(T[t].name)}"${dim?` style="opacity:.5"`:""}>${logo(t,64)}<span class="code">${esc(tid(t))}</span><span class="mat-rec">${sub}</span></button>`
  :`<div class="side"><span class="mat-tbd">?</span><span class="mat-rec">à déterminer</span></div>`;
/* tête d'un match à venir : face-à-face, compte à rebours, heure, ville, enjeu ; codes des équipes → fiche équipe */
function matHead(m){const st=new Date(m.start),R=records(),stk=m.t1&&m.t2?stakeTxt(m,R):"",ok=m.t1&&m.t2;
  return `<div class="hero mat-hero" style="--c1:${ok?cA(m):"#16294A"};--c2:${ok?cB(m):"#16294A"}">${heroBg(m,170)}<div class="hin">
    <div class="hmeta"><span>${esc(stageLab(m))}</span><span class="badge">Bo${m.bo}</span></div>
    <div class="vs">${matSide(m.t1,esc(m.t1?recTxt(m.t1,R):""))}<div class="mid"><span class="v">VS</span></div>${matSide(m.t2,esc(m.t2?recTxt(m.t2,R):""))}</div>
    <div class="hfoot"><div class="cdn" style="font-size:30px" data-cd="${st.getTime()}"></div><div class="cdd">${esc(whenTxt(st))} · ${esc(matCity(m))}${stk?` · <b style="color:var(--gold2)">${esc(stk)}</b>`:""}</div></div></div></div>`}
function resultHead(m){const w=m.winner;
  return `<div class="hero mat-hero done" style="--c1:${cA(m)};--c2:${cB(m)}">${heroBg(m,170)}<div class="hin"><div class="hmeta"><span>${esc(stageLab(m))}</span><span class="badge">${m.manual?"Saisi à la main":"Terminé"}</span></div>
    <div class="vs">${matSide(m.t1,w===m.t1?"victoire":"défaite",w&&w!==m.t1)}<div class="mid"><span class="sc">${m.s1??(w===m.t1?1:0)}-${m.s2??(w===m.t2?1:0)}</span></div>${matSide(m.t2,w===m.t2?"victoire":"défaite",w&&w!==m.t2)}</div>
    <div class="cdd hfoot">${esc(fmtDay(evDate(new Date(m.start))))} · ${esc(matCity(m))}</div></div></div>`}
function matMount(el){const b=el.querySelector(".headslot .beam");if(b)startBeam(b)}
/* une fois, à l'ouverture : barre du titre qui devient le score en direct, onglet Draft entre deux parties, moments animés */
function matOpened(el){
  el.addEventListener("scroll",()=>{if(el._mb)return;el._mb=requestAnimationFrame(()=>{el._mb=0;matBar(el)})},{passive:true});
  /* cadrage : à chaque changement de taille ou de contenu (onglet changé, données arrivées, direct) */
  if(window.ResizeObserver&&el.firstElementChild){const ro=new ResizeObserver(()=>{if(!el.isConnected){ro.disconnect();return}matFitSoon(el)});ro.observe(el.firstElementChild)}
  if(window.MutationObserver){const mo=new MutationObserver(()=>{if(!el.isConnected){mo.disconnect();return}matFitSoon(el)});mo.observe(el,{childList:true,subtree:true})}
  const d=el._d,m=d&&mOf(d.id);if(!m)return;
  if(d.v==="m"&&d._k==="live"&&!d._t0){const L=LV.games[m.key];el._lst=L&&L.status;if(L&&L.status==="between"&&d.tab==="di"&&!matOver(m,L))setTab(el,"dr")}
  if(!RM&&d.v==="m"&&d._k==="soon"&&d.tab==="ov")matAnimRobot(el);
  if(!RM)matMotion(el);
}

/* cadrage (« bien tout cadrer ») : un onglet qui dépasse de moins de 120 px passe en version resserrée (3 crans : marges, blocs, tête), pour tenir
   dans l'écran plutôt que de défiler de quelques pixels ; un vrai défilement (≥ 120 px) reste tel quel. Une fois par onglet. */
const matFitSoon=el=>{if(!el._mf)el._mf=requestAnimationFrame(()=>{el._mf=0;matFit(el)})};
function matFit(el){const d=el._d;if(!d||!el.isConnected)return;
  const T4=["mat-tight","mat-tight2","mat-tight3","mat-tight4"],cl=el.classList,on=T4.filter(c=>cl.contains(c)).length;
  if(el._ftab!==d.tab){el._ftab=d.tab;el._fno=0;el._f15=0;if(on){cl.remove(...T4);matFitSoon(el);return}}
  const pb=parseFloat(getComputedStyle(el).paddingBottom)||0,o=el.scrollHeight-el.clientHeight-Math.max(0,pb-12);
  /* intégrateur : le premier onglet (Aperçu, Direct, Résumé) reste sous 1,5 écran quand il le dépasse de peu (direct à 25 min : ×1,58
     sur iPhone 12) : mêmes crans ; si le contenu grandit franchement ensuite, marges normales et vrai défilement */
  const first=d.tab==="ov"||d.tab==="di",ex=el.scrollHeight-Math.max(0,pb-12)-Math.round(innerHeight*1.5);
  if(el._f15){if(on&&ex>=160){cl.remove(...T4);el._f15=0;el._fno=1}else if(ex>0&&on<4)cl.add(T4[on]);return}
  if(on&&(o>=200||(on===4&&o>=40))){cl.remove(...T4);el._fno=1;return}   // trop de contenu pour tenir (données arrivées, direct) : vrai défilement, marges normales
  if(!el._fno&&o>0&&o<120&&on<4){cl.add(T4[on]);return}
  if(first&&!on&&o>=120&&ex>0&&ex<110){el._f15=1;cl.add(T4[0])}}

/* ===================== 2. avant le match : Aperçu ===================== */
function matRobotBlk(m,past){const F=fiabW26();let f,c,lab="Le robot",tg="";
  if(m.winner){const r=robotPast(m);if(!r)return"";f={p1:r.fav===m.t1?r.p:1-r.p};c="avant le match";lab="Le robot avait dit";tg=` <span class="tag ${r.ok?"on":""}">${r.ok?"vu juste":"surprise"}</span>`}

  if(g&&L.teams){const bt=(g.teams||[]).find(t=>t.side==="blue"),rt=(g.teams||[]).find(t=>t.side==="red"),ob=bt&&(L.teams.find(t=>t.id===bt.id)||{}).our,or=rt&&(L.teams.find(t=>t.id===rt.id)||{}).our;
    if(ob){L.blue=ob;L.red=or||(ob===m.t1?m.t2:m.t1)}}
  if(!L.first){let w=null;try{w=await feedWin(gid)}catch(e){w=null}
    if(w&&w.frames&&w.frames.length){L.first=Date.parse(w.frames[0].rfc460Timestamp);L.meta=w.gameMetadata;w.frames.forEach(f=>pushSample(L,f));kfFeed(L,w.frames,null)}
    else if(!L.games){L.status="waiting";return}}

    L.blue=tm("blue")||m.t1;L.red=L.blue===m.t1?m.t2:m.t1}

  if(w&&w.frames&&w.frames.length){L.meta=L.meta||w.gameMetadata;L.frame=w.frames[w.frames.length-1];pushSample(L,L.frame);L.status=L.frame.gameState==="finished"?"ended":"live";kfFeed(L,w.frames,ws);
    const id=m.id;kfFill(L,gid,()=>paintLive(mOf(id)||m))}
  else{if(err&&!L.frame)throw err;L.status=L.frame?"live":"starting"}

}

/* parcours aux Worlds dans le héros (swiTrail du module suisse : une case par série, le prochain match en pointillés, les places

function teaTrail(id){if(typeof swiTrail!=="function"||typeof swiState!=="function")return"";const tr=safe(swiTrail,id,swiState());if(!tr)return"";const nx=teaNext(id);

/* le robot en bref (rkTeamBrief de v13.5) : Force, Chances, Joueurs, Grands tournois ; le détail au toucher */

    rows.push(plyLn("Chances",`Titre ${rkPct(e[10])}${NB}%, finale ${rkPct(e[9])}${NB}%<small>demies ${rkPct(e[8])}${NB}%, quarts ${rkPct(e[7])}${NB}%</small>`,`data-info="${INFOP.swt?"swt:"+esc(id):xi("tc|"+id,()=>["Ses chances selon le robot",`<p>Titre <b>${rkPct(e[10])}${NB}%</b>, finale ${rkPct(e[9])}${NB}%, demies ${rkPct(e[8])}${NB}%, quarts ${rkPct(e[7])}${NB}%.</p><p>Bilan final probable en phase suisse (actuel : ${esc(e[0])}) :</p><div class="tea-dist">${lab.map((l,j)=>`<span><i style="height:${Math.max(2,e[1+j]*100).toFixed(0)}%"></i><b>${rkPct(e[1+j])}${NB}%</b><small>${l}</small></span>`).join("")}</div>${nx?`<p>Prochain match contre ${esc(tid(nx[1]===id?nx[2]:nx[1]))} (Bo${nx[3]}) : <b>${rkPct(nx[1]===id?nx[4]:1-nx[4])}${NB}%</b> de chances.</p>`:""}<p class="small">${((S.n)||20000).toLocaleString("fr-FR")} tournois simulés avec les résultats déjà acquis. Probabilités du robot, pas des certitudes.</p><button class="btn" data-go="sim">Qui va gagner ces Worlds ? ›</button>`,true])}"`))}
  const P=teamPlayers(id).map(p=>rkFind(p.key)).filter(Boolean);

/* parcours de chaque équipe (bilans successifs [v,d]), même calcul que renderSwiss de v13.5 */
function swiPaths(){
  const teams=swissTeams(),P={};teams.forEach(t=>P[t.id]=[[0,0]]);
  MATCHES.filter(m=>m.stage==="sw"&&m.winner&&m.t1&&m.t2).forEach(m=>[m.t1,m.t2].forEach(id=>{if(!P[id])P[id]=[[0,0]];const [w,l]=P[id][P[id].length-1];if(w<3&&l<3)P[id].push(m.winner===id?[w+1,l]:[w,l+1])}));
  return {teams,P};
}
const swiRec=(P,id)=>{const p=P[id]||[[0,0]];return p[p.length-1]};
/* où en est la phase suisse : ronde en cours (r), affiches connues (drawn), qualifiés (q), éliminés (x), terminée (over) */
function swiState(){
  const {teams,P}=swiPaths(),sw=MATCHES.filter(m=>m.stage==="sw"&&m.t1&&m.t2),open=sw.filter(m=>!m.winner);
  let q=0,x=0;teams.forEach(t=>{const [w,l]=swiRec(P,t.id);if(w>=3)q++;else if(l>=3)x++});
  const over=teams.length>0&&q+x===teams.length,played=Math.max(0,...sw.filter(m=>m.winner).map(m=>m.round||0));
  const drawn=open.length>0,r=drawn?Math.min(...open.map(m=>m.round||1)):over?5:Math.min(5,played+1);
  return {teams,P,sw,open,q,x,over,played,drawn,r};
}

  const PH={};DAYS.forEach(d=>{if(!swiInF(f,d.stage))return;const dt=new Date(d.d+"T"+d.t+":00Z"),k=dayKeyL(dt);if(k<dk0)return;if(G[k]&&G[k].some(m=>m.t1||m.t2))return;PH[k]={d,dt};if(!keep.includes(k))keep.push(k)});

/* =====================================================================================
   stats.js — STATS DU TOURNOI ET FAITS (propriétaire : agent stats)
   Écrans : st/<onglet> (Tournoi · Leaders · Champions · Ligues · Chiffres), fx/<n> (un fait), fxl (tous les faits).
   Widget de l'accueil : fact. Aide partagée : staFactsBlk([clés]) (2 faits liés à une fiche joueur ou équipe, F-02).

   Chaque onglet tient dans un écran de 664 px (iPhone 12) sans « mini défilement » ; le détail est derrière un toucher, la méthode derrière « i ».
   Conventions : noms globaux préfixés sta, classes .sta-*, aucun rendu au chargement.
   ===================================================================================== */

function staTid(n){const N=SJ&&SJ.names;if(N)for(const k in N)if(Array.isArray(N[k])&&N[k].includes(n))return k;return resolveTeam(n)}
/* 39,87 min → « 39:52 » (renderTourney, 2752, sans le « 39:60 » d'un arrondi à la minute près) */
const staDur=v=>{const s=Math.round((+v||0)*60);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function staTab(t,D){
  if(t==="lg")return staLeagues();

/* nombre qui défile (transform/opacity ailleurs ; ici seulement le texte), remis à sa valeur à la fin */
function leaCount(el,a,b,d,dl,suf=""){if(!el||RM)return;const fin=el.textContent,t0=performance.now()+dl;
  const step=t=>{if(!el.isConnected)return;const k=(t-t0)/d;if(k<0){requestAnimationFrame(step);return}if(k>=1){el.textContent=fin;return}el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,4)))+suf;requestAnimationFrame(step)};
  el.textContent=a+suf;requestAnimationFrame(step)}

/* rattrapage des retardataires : les matchs joués avant ton premier pari te rapportent les points du dernier de ceux qui
   pariaient déjà (ses points sur ces matchs, rattrapage compris). Calculé avec les paris partagés : même classement sur tous les
   téléphones. Le robot n'en reçoit pas et ne sert pas de repère. */
function leaCatchUp(all,done){
  const t=m=>Date.parse(m.start)||0,H=all.filter(u=>!u.bot);
  H.forEach(u=>{u.bonus=0;u.f0=Infinity;MATCHES.forEach(m=>{if(u.p[m.key])u.f0=Math.min(u.f0,t(m))})});
  H.slice().sort((a,b)=>a.f0-b.f0).forEach(u=>{
    const S=done.filter(m=>t(m)<u.f0);if(!S.length)return;
    const R=H.filter(r=>r!==u&&r.f0<u.f0&&S.some(m=>r.p[m.key]));if(!R.length)return;
    u.bonus=Math.min(...R.map(r=>r.bonus+S.reduce((n,m)=>n+(r.p[m.key]?pts(r.p[m.key].w,r.p[m.key].sc,m):0),0)));
  });
  H.forEach(u=>{u.pts+=u.bonus});
}
