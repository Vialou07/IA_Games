<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<title>Worlds 2026 · Suivi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1428; --surface:#0F1E36; --surface2:#16294A; --line:#21395C;
  --gold:#C8AA6E; --goldhi:#F0E6D2; --text:#F0E6D2; --muted:#8A9BB0;
  --teal:#0AC8B9; --red:#E84057; --shadow:0 10px 30px rgba(0,0,0,.35);
  --disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E9EEF5; --surface:#FFFFFF; --surface2:#F2F5FA; --line:#D3DCE8;
    --gold:#8A6A2C; --goldhi:#0A1428; --text:#0A1428; --muted:#56657A;
    --teal:#06807A; --red:#C42841; --shadow:0 8px 24px rgba(10,20,40,.10);
    color-scheme:light;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
a{color:var(--teal)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.5px;color:var(--gold);line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:2px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--teal)} .sync.warn i{background:var(--gold)} .sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--gold)}

section.view{display:none;padding:16px 0 24px}
section.view.on{display:block}
h2{font-family:var(--disp);font-weight:700;font-size:22px;margin:26px 0 10px;letter-spacing:.2px}
h2:first-child{margin-top:4px}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero .bg{position:absolute;inset:0;opacity:.9}
.hero .in{position:relative;padding:16px 16px 18px}
.hero .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--goldhi);opacity:.9}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff}
.badge.live{background:var(--red)} .badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:14px 0 6px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.side .logo{width:64px;height:64px}
.code{font-family:var(--disp);font-weight:800;font-size:clamp(40px,12vw,76px);line-height:.85;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.side .nm{font-size:12.5px;color:#fff;opacity:.85;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mid{display:flex;flex-direction:column;align-items:center;padding:0 10px;color:#fff}
.mid .score{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1}
.mid .v{font-family:var(--disp);font-weight:700;font-size:20px;opacity:.75}
.count{font-family:var(--disp);font-weight:700;font-size:26px;text-align:center;color:#fff;letter-spacing:.5px;margin-top:6px}
.count small{display:block;font-family:var(--body);font-size:12px;font-weight:500;opacity:.8;letter-spacing:0}
.hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line);color:var(--text);text-decoration:none}
.hero .btn{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.18);color:#fff}
.btn.gold{background:var(--gold);color:#0A1428;border-color:var(--gold)}

/* logos & avatars */
.logo{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;object-fit:contain}
.mono{display:inline-grid;place-items:center;flex:none;border-radius:10px;font-family:var(--disp);font-weight:800;color:#fff;font-size:13px;letter-spacing:.3px}
.flag{width:20px;height:14px;object-fit:cover;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(127,127,127,.25);vertical-align:-2px}
.ava{width:46px;height:46px;border-radius:12px;object-fit:cover;object-position:top;background:var(--surface2);flex:none}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:46px 1fr auto 1fr 22px;align-items:center;gap:8px}
.mrow .t{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .t.r{flex-direction:row-reverse;text-align:right}
.mrow .t b{font-family:var(--disp);font-weight:700;font-size:19px;white-space:nowrap}
.mrow .t.lose b{opacity:.45}
.mrow .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .sc{font-family:var(--disp);font-weight:800;font-size:20px;min-width:44px;text-align:center}
.mrow .sc.vs2{font-size:14px;color:var(--muted);font-weight:700}
.pick{width:10px;height:10px;border-radius:50%;justify-self:center}
.pick.on{background:var(--gold)} .pick.win{background:var(--teal)} .pick.bad{background:var(--red)}
.day{font-family:var(--disp);font-weight:700;font-size:18px;margin:22px 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;text-align:right}
.tbd{padding:14px 12px;color:var(--muted);font-size:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:#0A1428;border-color:var(--gold)}

/* facts */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.fact b{display:block;font-family:var(--disp);font-weight:800;font-size:32px;line-height:1;color:var(--gold)}
.fact p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.fact .fl{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.fact.wide{grid-column:1/-1}

/* swiss */
.bucket{margin-top:14px}
.bucket h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.bucket h3 em{font-style:normal;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.bucket.q h3{color:var(--teal)} .bucket.x h3{color:var(--red)}
.trow{display:flex;align-items:center;gap:10px}
.trow .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:flex;gap:3px}
.form i{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.form i.w{background:var(--teal)} .form i.l{background:var(--red)}
.rec{font-family:var(--disp);font-weight:800;font-size:18px;min-width:34px;text-align:right}

/* teams grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tcard .hd{display:flex;align-items:center;gap:10px}
.tcard .hd b{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.05}
.tcard .ln{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tcard .fls{display:flex;gap:3px}
.tcard.out{opacity:.55}
.st{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.st.in{color:var(--teal)} .st.ko{background:var(--teal);color:#05201E} .st.out{color:var(--red)}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pcard .ph{position:relative;aspect-ratio:1/1;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.pcard .ph img.pp{width:100%;height:100%;object-fit:cover;object-position:top}
.pcard .ph .mono{width:100%;height:100%;border-radius:0;font-size:40px}
.pcard .ph .tl{position:absolute;right:6px;bottom:6px;width:28px;height:28px;background:rgba(10,20,40,.7);border-radius:8px;padding:3px}
.pcard .bd{padding:8px 10px 10px}
.pcard .bd b{font-family:var(--disp);font-weight:700;font-size:19px;display:flex;align-items:center;gap:6px}
.pcard .bd span{font-size:12px;color:var(--muted)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
.nat{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 12px;width:100%;text-align:left;border-top:1px solid var(--line);font-size:14px}
.nat:first-child{border-top:0}
.nat .bar{height:8px;border-radius:4px;background:var(--gold);opacity:.85}
.nat[aria-pressed="true"]{background:var(--surface2)}
.nat b{font-family:var(--disp);font-size:17px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,8,18,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .grab{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.sheet .x{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:20px;line-height:1}
.sheet .wrap{max-width:640px}
.duel{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px;padding:9px 10px;border-top:1px solid var(--line)}
.duel:first-child{border-top:0}
.duel .p{display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.duel .p.r{flex-direction:row-reverse;text-align:right}
.duel .p .ava{width:40px;height:40px;border-radius:10px}
.duel .p b{display:block;font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .p small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px}
.duel .p.r small{justify-content:flex-end}
.duel .rl{text-align:center;font-size:11px;font-weight:700;color:var(--gold)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700}
.pickbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#0A1428}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bigp{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.bigp .ava,.bigp .mono{width:110px;height:110px;border-radius:18px;font-size:44px}
.bigp h1{font-family:var(--disp);font-weight:800;font-size:40px;line-height:.95;margin:0}
.bigp p{margin:4px 0 0;color:var(--muted);font-size:14px}
.note{font-size:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin:12px 0}
.small{font-size:12.5px;color:var(--muted)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.favs button{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.favs button[aria-pressed="true"]{border:2px solid var(--gold);background:var(--surface2)}
.favs .logo{width:34px;height:34px}
.mine{box-shadow:inset 3px 0 0 var(--gold)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.facts{grid-template-columns:repeat(4,1fr)}.fact.wide{grid-column:span 2}}
</style>
</head>

<header class="top"><div class="wrap">
  <a href="index.html" aria-label="Retour au hub" style="color:var(--muted);text-decoration:none;font-size:26px;line-height:1;padding:4px 2px">‹</a>
  <div class="brand">WORLDS 2026<small>Los Angeles, Allen, New York</small></div>

</div></nav>

function stageOf(iso){const d=iso.slice(0,10);if(d<"2026-10-20")return"pi";if(d<"2026-11-02")return"sw";if(d<"2026-11-07")return"qf";if(d<"2026-11-10")return"sf";return"f"}

function finalize(list){
  list.forEach(m=>{
    m.key=mkey(m);
    const man=manual[m.key];
    if(!m.winner && m.s1!=null && m.s2!=null && (m.s1>m.bo/2||m.s2>m.bo/2)) m.winner=m.s1>m.s2?m.t1:m.t2;
    if(!m.winner && man && (man===m.t1||man===m.t2)){m.winner=man;m.manual=true}
    const now=Date.now(), st=new Date(m.start).getTime();
    if(m.winner) m.state="done";
    else if(m.apiLive) m.state="live";
    else m.state=(now>st && now<st+m.bo*55*60e3)?"live":(now>=st+m.bo*55*60e3?"wait":"soon");
  });
  list.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  // numéro de ronde suisse déduit des matchs joués
  const played={};
  list.filter(m=>m.stage==="sw").forEach(m=>{
    if(m.t1&&m.t2){const r=Math.max(played[m.t1]||0,played[m.t2]||0)+1;m.round=r;if(!/ronde/i.test(m.label||""))m.label="Ronde "+r;played[m.t1]=(played[m.t1]||0)+1;played[m.t2]=(played[m.t2]||0)+1}
  });
  return list;
}

function records(){
  const R={};TEAMS.forEach(t=>R[t.id]={sw:{w:0,l:0,form:[]},pi:{w:0,l:0},ko:{w:0,l:0}});
  MATCHES.forEach(m=>{
    if(!m.winner||!m.t1||!m.t2)return;
    const lo=m.winner===m.t1?m.t2:m.t1, b=m.stage==="sw"?"sw":m.stage==="pi"?"pi":"ko";
    R[m.winner][b].w++;R[lo][b].l++;
    if(b==="sw"){R[m.winner].sw.form.push("w");R[lo].sw.form.push("l")}
  });
  return R;
}
function status(id,R){
  const t=T[id],r=R[id];
  if(t.entry==="pi"){
    if(r.pi.l>=2) return {k:"out",txt:"Éliminé (Play-In)"};
    const fin=MATCHES.find(m=>m.stage==="pi"&&m.label==="Qualification"&&m.winner);
    if(fin&&fin.winner!==id) return {k:"out",txt:"Éliminé (Play-In)"};
  }
  if(r.ko.l>0) return {k:"out",txt:"Éliminé en phase finale"};
  if(r.ko.w>0||r.sw.w>=3){
    const champ=MATCHES.find(m=>m.stage==="f"&&m.winner===id);
    if(champ) return {k:"ko",txt:"Champion du monde"};
    return {k:"ko",txt:r.ko.w?"En phase finale":"Qualifié pour les quarts"};
  }
  if(r.sw.l>=3) return {k:"out",txt:"Éliminé (phase suisse)"};
  return {k:"in",txt:(r.sw.w+r.sw.l)?`En lice ${r.sw.w}-${r.sw.l}`:"En lice"};
}

const LE_KEY="0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z", WORLDS_LEAGUE="98767975604431411";
async function leFetch(path){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch("https://esports-api.lolesports.com/persisted/gw/"+path,{headers:{"x-api-key":LE_KEY},signal:ctl.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}
}
async function fromLolEsports(){
  const base=`getSchedule?hl=fr-FR&leagueId=${WORLDS_LEAGUE}`;
  const first=await leFetch(base);
  let events=[...(first?.data?.schedule?.events||[])];
  let older=first?.data?.schedule?.pages?.older, newer=first?.data?.schedule?.pages?.newer;
  for(let i=0;i<4&&older;i++){
    const j=await leFetch(base+"&pageToken="+encodeURIComponent(older));const ev=j?.data?.schedule?.events||[];events=ev.concat(events);older=j?.data?.schedule?.pages?.older;
    if(ev.length&&ev[0].startTime<"2026-10-10")break;
  }
  for(let i=0;i<3&&newer;i++){
    const j=await leFetch(base+"&pageToken="+encodeURIComponent(newer));events=events.concat(j?.data?.schedule?.events||[]);newer=j?.data?.schedule?.pages?.newer;
  }
  const out=[],seen=new Set();
  events.forEach(ev=>{
    if(ev.type&&ev.type!=="match")return;
    if(!ev.startTime||ev.startTime<"2026-10-10")return;
    const mt=ev.match||{};const id="le"+(mt.id||ev.startTime);if(seen.has(id))return;seen.add(id);
    const [a,b]=mt.teams||[];if(!a||!b)return;
    const t1=resolveTeam(a.code,a.name),t2=resolveTeam(b.code,b.name);
    if(t1&&a.image)LIVE_LOGO[t1]=a.image; if(t2&&b.image)LIVE_LOGO[t2]=b.image;
    const m={id,stage:stageOf(ev.startTime),label:ev.blockName||"",t1,t2,start:ev.startTime,bo:mt.strategy?.count||1,
      n1:a.name,n2:b.name,s1:a.result?.gameWins??null,s2:b.result?.gameWins??null};
    if(ev.state==="completed"){if(a.result?.outcome==="win")m.winner=t1;else if(b.result?.outcome==="win")m.winner=t2}
    if(ev.state==="inProgress")m.apiLive=true;
    if(ev.state==="unstarted"){m.s1=null;m.s2=null}
    out.push(m);
  });
  if(out.filter(m=>m.t1&&m.t2).length<6)throw new Error("planning incomplet");
  return out;
}
async function cargo(params){
  const q=new URLSearchParams({action:"cargoquery",format:"json",origin:"*",limit:"500",...params});
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch("https://lol.fandom.com/api.php?"+q,{signal:ctl.signal});if(!r.ok)throw new Error(r.status);const j=await r.json();if(j.error)throw new Error(j.error.info);return (j.cargoquery||[]).map(x=>x.title)}finally{clearTimeout(to)}
}
async function fromLeaguepedia(){
  const rows=await cargo({tables:"MatchSchedule",fields:"MatchSchedule.Team1=T1,MatchSchedule.Team2=T2,MatchSchedule.Winner=W,MatchSchedule.Team1Score=S1,MatchSchedule.Team2Score=S2,MatchSchedule.DateTime_UTC=DT,MatchSchedule.BestOf=BO,MatchSchedule.Tab=Tab",
    where:'MatchSchedule.OverviewPage LIKE "2026 Season World Championship%"',order_by:"MatchSchedule.DateTime_UTC"});
  const out=rows.map((r,i)=>{
    const iso=String(r.DT||"").replace(" ","T")+"Z";
    const t1=resolveTeam(r.T1),t2=resolveTeam(r.T2),bo=parseInt(r.BO)||1;
    const m={id:"lp"+i,stage:stageOf(iso),label:r.Tab||"",t1,t2,start:iso,bo,n1:r.T1,n2:r.T2,
      s1:r.S1!==""&&r.S1!=null?+r.S1:null,s2:r.S2!==""&&r.S2!=null?+r.S2:null};
    if(r.W==="1")m.winner=t1;else if(r.W==="2")m.winner=t2;
    if(!m.winner){m.s1=m.s1||null;m.s2=m.s2||null}
    return m;
  }).filter(m=>/^\d{4}-/.test(m.start));
  if(out.filter(m=>m.t1&&m.t2).length<6)throw new Error("planning incomplet");

async function enrichPhotosWiki(){
  const miss=PLAYERS.filter(p=>!p.photo&&!p.lePhoto);if(!miss.length)return;
  for(let i=0;i<miss.length;i+=45){
    const chunk=miss.slice(i,i+45);
    const titles=chunk.map(p=>p.id+" (gamer)");
    const q=new URLSearchParams({action:"query",format:"json",origin:"*",prop:"pageimages",piprop:"thumbnail",pithumbsize:"300",redirects:"1",titles:titles.join("|")});
    const r=await fetch("https://en.wikipedia.org/w/api.php?"+q);if(!r.ok)continue;const j=await r.json();
    const back={};(j.query?.normalized||[]).forEach(x=>back[x.to]=x.from);(j.query?.redirects||[]).forEach(x=>back[x.to]=back[x.from]||x.from);
    Object.values(j.query?.pages||{}).forEach(pg=>{
      if(!pg.thumbnail)return;const orig=back[pg.title]||pg.title;
      const p=chunk.find(c=>norm(c.id+" (gamer)")===norm(orig));
      if(p&&!p.photo&&!p.lePhoto)p.wikiPhoto=pg.thumbnail.source;
    });
  }
}

function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");sheetState=null}
let sheetState=null;
function age(bd){if(!bd)return null;const b=new Date(bd);if(isNaN(b))return null;const n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}

function matchSheet(id){
  const m=MATCHES.find(x=>x.id===id);if(!m)return;sheetState={k:"m",id};
  const st=new Date(m.start);const p1=m.t1?teamPlayers(m.t1):[],p2=m.t2?teamPlayers(m.t2):[];
  const sc=(m.s1!=null&&m.s2!=null&&m.state!=="soon")?`${m.s1}-${m.s2}`:"VS";
  let h=`<div class="hero" style="margin-top:4px"><div class="bg" style="background:${heroBg(m)}"></div><div class="in">
    <div class="meta"><span>${esc(STAGES[m.stage])}${m.label?" : "+esc(m.label):""}</span><span class="badge${m.state==="live"?" live":""}">${m.state==="live"?"En direct":"Bo"+m.bo}</span></div>
    <div class="vs"><button class="side" data-t="${m.t1||""}">${m.t1?logo(m.t1,56):""}<span class="code" style="font-size:44px">${esc(tname(m,"t1"))}</span></button>
    <div class="mid"><span class="score" style="font-size:36px">${sc}</span></div>
    <button class="side" data-t="${m.t2||""}">${m.t2?logo(m.t2,56):""}<span class="code" style="font-size:44px">${esc(tname(m,"t2"))}</span></button></div>
    <div class="count" style="font-size:16px">${fmtDay(st)}, ${fmtTime(st)}<small>${esc(VENUES[m.stage])}</small></div></div></div>`;
  if(m.t1&&m.t2){
    if(m.state==="soon"){
      h+=`<h2>Ton prono</h2><div class="picks">${[m.t1,m.t2].map(t=>`<button class="pickbtn" data-pick="${t}" data-mk="${esc(m.key)}" aria-pressed="${picks[m.key]===t}">${logo(t,26)}${esc(T[t].id)}</button>`).join("")}</div>`;
    } else if(picks[m.key]){
      const ok=m.winner?picks[m.key]===m.winner:null;
      h+=`<div class="note">Ton prono : <b>${esc(T[picks[m.key]].name)}</b>${ok===null?"":ok?", gagné.":", perdu."}</div>`;
    }
    if(!m.winner&&m.state!=="soon"||m.manual){
      h+=`<h2>Résultat</h2><p class="sub">Si la synchro tarde, indique le vainqueur. La donnée officielle reprend la main dès qu’elle arrive.</p><div class="picks">${[m.t1,m.t2].map(t=>`<button class="pickbtn" data-win="${t}" data-mk="${esc(m.key)}" aria-pressed="${manual[m.key]===t}">${esc(T[t].id)} gagne</button>`).join("")}</div>`;
    }
    h+=`<h2>Face-à-face</h2><div class="list">${ROLE_ORDER.map((r,i)=>{const a=p1[i],b=p2[i];
      const side=(p,rev)=>p?`<button class="p${rev?" r":""}" data-p="${p.key}">${photo(p,"ava","40px")}<span style="min-width:0"><b>${esc(p.id)}</b><small>${flag(p.cc)}${esc(cname(p.cc))}</small></span></button>`:"<span></span>";
      return `<div class="duel">${side(a,false)}<span class="rl">${ROLES[r]}</span>${side(b,true)}</div>`}).join("")}</div>`;
    const n1=new Set(p1.map(p=>p.cc)),n2=new Set(p2.map(p=>p.cc));const common=[...n1].filter(c=>n2.has(c));
    if(common.length)h+=`<p class="small" style="margin-top:8px">Compatriotes de chaque côté : ${common.map(c=>flag(c)+" "+esc(cname(c))).join(", ")}.</p>`;
    const prev=MATCHES.filter(x=>x!==m&&x.winner&&((x.t1===m.t1&&x.t2===m.t2)||(x.t1===m.t2&&x.t2===m.t1)));
    if(prev.length)h+=`<h2>Déjà croisés à ces Worlds</h2><div class="list">${prev.map(matchRow).join("")}</div>`;
  } else {
    h+=`<div class="note">Affiche pas encore connue, elle dépend du tirage.</div>`;
  }
  openSheet(h);
}
function teamSheet(id){
  const t=T[id];if(!t)return;sheetState={k:"t",id};const R=records();const st=status(id,R);
  const ms=MATCHES.filter(m=>m.t1===id||m.t2===id);
  let h=`<div class="bigp">${logo(id,96)}<div><h1>${esc(t.name)}</h1><p>${flag(t.cc)} ${esc(cname(t.cc))}, ${esc(t.league)} (${esc(LEAGUES[t.league])})</p><p><span class="st ${st.k}">${esc(st.txt)}</span></p></div></div>
  <div class="note">${esc(t.note)}</div>
  <dl class="kv"><dt>Qualification</dt><dd>${esc(t.seed)}</dd><dt>Entrée</dt><dd>${t.entry==="pi"?"Play-In":"Phase suisse"}</dd><dt>Bilan suisse</dt><dd>${R[id].sw.w}-${R[id].sw.l}</dd><dt>Nationalités</dt><dd>${[...new Set(teamPlayers(id).map(p=>p.cc))].map(c=>flag(c)+" "+esc(cname(c))).join(" ")}</dd></dl>
  <h2>Les cinq</h2><div class="list">${teamPlayers(id).map(p=>`<button class="row" data-p="${p.key}">${photo(p,"ava","46px")}<span style="flex:1;min-width:0"><b style="font-family:var(--disp);font-size:19px">${esc(p.id)}</b><br><span class="small">${ROLES[p.role]}${p.realName?", "+esc(p.realName):""}</span></span>${flag(p.cc)}</button>`).join("")}</div>`;
  if(ms.length)h+=`<h2>Ses matchs</h2><div class="list">${ms.map(matchRow).join("")}</div>`;
  h+=`<p style="margin-top:16px"><button class="btn${fav===id?" gold":""}" data-fav="${id}">${fav===id?"Mon équipe":"Suivre cette équipe"}</button></p>`;
  openSheet(h);
}
function playerSheet(key){
  const p=PLAYERS.find(x=>x.key===key);if(!p)return;sheetState={k:"p",id:key};const t=T[p.team];
  const a=age(p.birth);
  const nm=MATCHES.find(m=>(m.t1===p.team||m.t2===p.team)&&m.t1&&m.t2&&m.state!=="done");
  let duel="";
  if(nm){const opp=nm.t1===p.team?nm.t2:nm.t1;const o=PLAYERS.find(x=>x.team===opp&&x.role===p.role);
    if(o)duel=`<h2>Prochain duel</h2><div class="list"><button class="row" data-p="${o.key}">${photo(o,"ava","46px")}<span style="flex:1"><b style="font-family:var(--disp);font-size:19px">${esc(o.id)}</b><br><span class="small">${ROLES[o.role]} de ${esc(T[opp].name)}, ${fmtDay(new Date(nm.start))} à ${fmtTime(new Date(nm.start))}</span></span>${flag(o.cc)}</button></div>`}
  const big=imgTag([p.photo,p.lePhoto,p.wikiPhoto],"ava",{text:p.id.slice(0,2),color:t.color,size:"110px",style:"border-radius:18px;font-size:44px"}).replace('class="ava"','class="ava" style="width:110px;height:110px;border-radius:18px"');
  let h=`<div class="bigp">${big}<div><h1>${esc(p.id)}</h1><p>${ROLES[p.role]}, ${esc(t.name)}</p><p>${flag(p.cc)} ${esc(cname(p.cc))}</p></div></div>
  <dl class="kv">${p.realName?`<dt>Nom</dt><dd>${esc(p.realName)}${p.native?" ("+esc(p.native)+")":""}</dd>`:""}${a!=null?`<dt>Âge</dt><dd>${a} ans</dd>`:""}<dt>Nationalité</dt><dd>${flag(p.cc)} ${esc(cname(p.cc))}</dd><dt>Équipe</dt><dd><button data-t="${t.id}" style="display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600">${logo(t.id,20)}${esc(t.name)}</button></dd><dt>Ligue</dt><dd>${esc(t.league)} ${flag(t.cc)}</dd>${p.cc!==t.cc?`<dt>Expatrié</dt><dd>joue loin de son pays</dd>`:""}</dl>
  ${duel}
  <p style="margin-top:16px"><a class="btn" href="https://lol.fandom.com/wiki/${encodeURIComponent((p.page||p.id).replace(/ /g,"_"))}" target="_blank" rel="noopener">Fiche Leaguepedia</a></p>`;
  openSheet(h);
}
function refreshSheet(){if(!sheetState)return;const s=sheetState;({m:matchSheet,t:teamSheet,p:playerSheet})[s.k](s.id)}

/* ===================== interactions ===================== */
document.addEventListener("click",e=>{
  const tab=e.target.closest("nav.tabs button");
  if(tab){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b===tab));document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+tab.dataset.v));window.scrollTo(0,0);return}
  const pk=e.target.closest("[data-pick]");
  if(pk){const k=pk.dataset.mk;picks[k]=picks[k]===pk.dataset.pick?undefined:pk.dataset.pick;if(!picks[k])delete picks[k];LS.set("picks",picks);renderAll();refreshSheet();return}
  const wn=e.target.closest("[data-win]");
  if(wn){const k=wn.dataset.mk;if(manual[k]===wn.dataset.win)delete manual[k];else manual[k]=wn.dataset.win;LS.set("manual",manual);MATCHES.forEach(m=>{if(m.key===k&&m.manual){m.winner=null;m.manual=false}});MATCHES=finalize(MATCHES);renderAll();refreshSheet();return}
  if(e.target.closest("#reloadPh")){PHOTO_LOG.lp=PHOTO_LOG.le=PHOTO_LOG.wk="en cours…";renderPlayers();loadPhotos(true);return}
  const fv=e.target.closest("[data-fav]");
  if(fv){fav=fav===fv.dataset.fav?null:fv.dataset.fav;LS.set("fav",fav);renderAll();refreshSheet();return}
  const sg=e.target.closest("[data-stage]");if(sg){ui.stage=sg.dataset.stage;renderMatchs();return}
  const lg=e.target.closest("[data-league]");if(lg){ui.league=lg.dataset.league;renderTeams();return}
  const rl=e.target.closest("[data-role]");if(rl){ui.role=rl.dataset.role;ui.focusQ=false;renderPlayers();return}
  const nt=e.target.closest("[data-nat]");if(nt){ui.nat=ui.nat===nt.dataset.nat?null:nt.dataset.nat;ui.focusQ=false;renderPlayers();return}
  const m=e.target.closest("[data-m]");if(m){matchSheet(m.dataset.m);return}
  const p=e.target.closest("[data-p]");if(p){playerSheet(p.dataset.p);return}
  const t=e.target.closest("[data-t]");if(t&&t.dataset.t){teamSheet(t.dataset.t);return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;ui.focusQ=true;renderPlayers()}});
$("#scrim").addEventListener("click",closeSheet);$("#sheetX").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("#sync").addEventListener("click",()=>sync(true));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&lastSync&&Date.now()-lastSync>60e3)sync(false)});
setInterval(()=>{const c=$("#cd"),m=nextMatch();if(c&&m&&m.state==="soon"){const st=new Date(m.start);const ms=st-Date.now();c.firstChild.nodeValue=countdown(ms);if(ms<0){MATCHES=finalize(MATCHES);renderHome()}}},1000);

MATCHES=finalize(EMBED.map(m=>({...m})));
renderAll();
sync(false);
</script>
</body>
</html>
