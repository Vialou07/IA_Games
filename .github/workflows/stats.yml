name: Stats Worlds 2026
# Calcule data/stats.json depuis l'API LoL Esports et le publie sur la branche « stats »
# (un seul commit, réécrit à chaque mise à jour : l'historique de main reste propre).
# La mémoire du robot (data/cache.json.gz : parties déjà résumées) et l'état des modèles (data/model_state.json :
# incertitudes du jour, pronos figés au coup d'envoi, historique de la simulation) sont publiés avec.
# Lancé à la main depuis une autre branche, il publie sur « stats-preprod » : l'appli n'y touche pas.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # 4 créneaux par heure : GitHub saute parfois des passages programmés quand il est chargé
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/*.py", "data/teams.json", ".github/workflows/stats.yml"]
permissions:
  contents: write
concurrency:
  group: stats-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FILES: stats.json cache.json.gz model_state.json fiche.json draft.json
      OUT_BRANCH: ${{ github.ref_name == 'main' && 'stats' || 'stats-preprod' }}
    steps:
      - uses: actions/checkout@v7
      - name: Reprend les stats et la mémoire du robot
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if git fetch -q --depth=1 origin "$OUT_BRANCH"; then
            for f in $FILES; do
              git show "FETCH_HEAD:data/$f" > "$RUNNER_TEMP/prev/$f" 2>/dev/null && cp "$RUNNER_TEMP/prev/$f" "data/$f" || rm -f "$RUNNER_TEMP/prev/$f"
            done
          else
            echo "rien de publié sur $OUT_BRANCH pour l'instant"
          fi
      - name: Interroge LoL Esports
        env:
          STATS_MAX_MIN: "100"
        run: python3 tools/build_stats.py
      - name: Publie sur la branche ${{ env.OUT_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          same=1; for f in $FILES; do [ ! -f "data/$f" ] || cmp -s "data/$f" "$RUNNER_TEMP/prev/$f" || same=0; done
          if [ $same = 1 ]; then echo "rien de nouveau"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pub" && for f in $FILES; do [ ! -f "data/$f" ] || cp "data/$f" "$RUNNER_TEMP/pub/"; done
          git checkout -q --orphan stats-pub
          git rm -rqf --cached .
          cp "$RUNNER_TEMP/pub/"* data/
          for f in $FILES; do [ ! -f "data/$f" ] || git add -f "data/$f"; done
          git -c user.name="stats-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Stats Worlds : mise à jour auto"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$OUT_BRANCH"
          echo "publié sur $OUT_BRANCH : stats $(stat -c%s data/stats.json) octets, mémoire $(stat -c%s data/cache.json.gz) octets"
