<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz Mystère</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{--accent:#F2B705;--accent-dark:#A87E04;}
  .btn.primary{color:#231A00;}
  .clue-box{background:var(--panel);border:1px solid var(--gold);max-width:420px;width:100%;margin:8px auto;
    padding:16px 14px;text-align:center;font-size:1rem;line-height:1.55;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
  .clue-tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .pts-left{font-family:'Cinzel',serif;color:var(--gold);font-size:.85rem;margin:4px 0 8px;}
  .answer-row{display:flex;gap:8px;max-width:360px;margin:8px auto;width:100%;}
  .answer-row input{flex:1;margin:0;max-width:none;}
  .answer-row .btn{padding:12px 16px;}
  .reveal-list{width:100%;max-width:360px;margin:10px auto;display:flex;flex-direction:column;gap:7px;}
  .reveal-list .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;
    background:var(--panel);border:1px solid rgba(200,170,110,.25);font-size:.9rem;}
  .reveal-list .r.good{border-color:var(--ok);}
  .reveal-list .r.bad{border-color:rgba(225,90,76,.5);}
  .reveal-list .r .ans{color:var(--text);font-style:italic;}
  .reveal-list .r .mark{font-weight:700;}
</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">‹</a><div class="rune"></div><h1>Quiz Mystère</h1><div class="rune"></div></div>
<div class="wrap" id="wrap"></div>
<footer class="note">Tout le monde répond — pas de course, les ex aequo marquent pareil.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="net.js"></script>
<script src="themes.js"></script>
<script>
(function(){
  const GAME = "pkz";
  const BANK = THEMES.quiz, META = THEMES.meta;
  const wrap = document.getElementById("wrap");
  const $ = id => document.getElementById(id);
  const PTS = i => 5 - i;
  function screen(html){ wrap.innerHTML = `<div class="screen active">${html}</div>`; window.scrollTo(0,0); }
  function stepper(n,t){ return `<div class="step-label">Étape ${n} sur ${t}</div>
    <div class="stepper">${Array.from({length:t},(_,i)=>`<div class="dot${i<n?" on":""}"></div>`).join("")}</div>`; }

  let players=[], myName="", theme=null, started=false, roomCode="";
  let round=null, used={}, iAnswered=false;

  function pickEntry(th){
    used[th] = used[th] || new Set();
    const avail = BANK[th].map((_,i)=>i).filter(i=>!used[th].has(i));
    if (!avail.length){ used[th].clear(); return pickEntry(th); }
    const i = avail[Math.floor(Math.random()*avail.length)];
    used[th].add(i);
    return BANK[th][i];
  }
  const isRight = (g, e) => UI.fuzzyMatch(g, e.name) || (e.alt||[]).some(a=>UI.fuzzyMatch(g,a));
  function uniqueName(n){
    let base=(n||"Joueur").trim(), name=base, i=2;
    while (players.some(p=>p.name===name)) name=base+" "+(i++);
    return name;
  }
  const scoresHtml = l => l.slice().sort((a,b)=>b.score-a.score)
    .map((p,i)=>`<div class="row${i===0&&p.score>0?" top":""}"><span>${UI.esc(p.name)}</span><span class="pts">${p.score} pt${p.score>1?"s":""}</span></div>`).join("");

  /* ═══ ACCUEIL ═══ */
  function sHome(){
    players=[]; started=false; round=null; Net.destroy();
    screen(`<div class="center">
      <div class="eyebrow">2 joueurs ou plus</div>
      <h2 class="big">Le personnage mystère</h2>
      <p class="sub">5 indices, du plus vague au plus précis. <b>Tout le monde répond à chaque indice</b> — les réponses restent cachées jusqu'à ce que tous aient joué. Trouvé tôt = gros points (5 ➜ 1), et les ex aequo marquent pareil.</p>
      ${stepper(1,4)}
      <p class="sub" style="margin-bottom:10px;"><b>Vous jouez comment ?</b></p>
      <div class="choice-col">
        <button class="choice accent" id="c-net"><div class="c-title">📱📱 Chacun son téléphone</div><div class="c-sub">Chacun tape sa réponse en secret.</div></button>
        <button class="choice" id="c-solo"><div class="c-title">📱 Tous sur ce téléphone</div><div class="c-sub">Écran partagé, réponses à voix haute.</div></button>
      </div></div>`);
    $("c-net").onclick = sNetChoice;
    $("c-solo").onclick = sSoloPlayers;
  }
  function sNetChoice(){
    screen(`<div class="center">${stepper(2,4)}
      <p class="sub" style="margin-bottom:10px;"><b>Un seul joueur crée la partie, les autres rejoignent.</b></p>
      <div class="choice-col">
        <button class="choice accent" id="c-create"><div class="c-title">➕ Créer la partie</div><div class="c-sub">Tu seras l'hôte : tu obtiens un code.</div></button>
        <button class="choice" id="c-join"><div class="c-title">🔑 Rejoindre</div><div class="c-sub">On t'a donné un code ? C'est ici.</div></button>
      </div>
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="c-back">Retour</button></div></div>`);
    $("c-create").onclick = () => sName(false);
    $("c-join").onclick = () => sName(true);
    $("c-back").onclick = sHome;
  }
  function sName(joining){
    screen(`<div class="center">${stepper(3,4)}
      <div class="eyebrow">${joining?"Rejoindre":"Créer la partie"}</div>
      <h2 class="big">Ton prénom ?</h2>
      <input class="field" id="fn" maxlength="14" placeholder="Prénom">
      ${joining?`<p class="sub" style="margin:4px 0 2px;">…et le code de l'hôte :</p>
      <input class="field code" id="fc" maxlength="4" autocapitalize="characters" placeholder="XXXX">`:""}
      <div class="btn-row">
        <button class="btn ghost" id="fb">Retour</button>
        <button class="btn primary" id="fg" disabled>${joining?"Rejoindre":"Créer"}</button>
      </div></div>`);
    const check = () => {
      const okN=$("fn").value.trim().length>=2;
      const okC=!joining || ($("fc") && $("fc").value.length===4);
      $("fg").disabled = !(okN&&okC);
    };
    $("fn").addEventListener("input", check);
    if (joining) $("fc").addEventListener("input", e=>{
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); check();
    });
    $("fb").onclick = sNetChoice;
    $("fg").onclick = () => {
      myName=$("fn").value.trim(); $("fg").disabled=true;
      joining ? doJoin($("fc").value) : doCreate();
    };
  }
  function doCreate(){
    Net.create(GAME, {
      onOpen: code => { roomCode=code; players=[{id:"H",name:myName,score:0}]; sLobby(); },
      onData: (id,d) => {
        if (d && d.t==="hello"){
          players.push({ id, name: uniqueName(d.name), score:0 });
          syncLobby();
          if (started && round && !round.done) Net.sendTo(id, cluePayload());
        }
        else if (d && d.t==="answer") hostAnswer(id, d.text);
      },
      onLeave: id => {
        const p=players.find(x=>x.id===id);
        players = players.filter(x=>x.id!==id);
        if (p) UI.banner(`${p.name} s'est déconnecté.`, true);
        if (!started) syncLobby();
        else if (round && !round.done) checkAllAnswered();
      },
      onError: () => UI.banner("Erreur de connexion. Recharge la page.", true, 6000),
    });
  }
  function sLobby(){
    screen(`<div class="center">${stepper(4,4)}
      <div class="eyebrow">Salon ouvert</div>
      <h2 class="big">Fais rejoindre les autres</h2>
      <div class="code-box">${roomCode}</div>
      <p class="sub">Chacun : même lien → Quiz Mystère → <b>Chacun son téléphone</b> → <b>Rejoindre</b> → prénom + ce code.</p>
      <div class="list" id="ll"></div>
      <div class="status" id="ls"></div>
      <div class="btn-row"><button class="btn primary" id="lg" disabled>Choisir le thème ➜</button></div></div>`);
    $("lg").onclick = sThemeHost;
    syncLobby();
  }
  function syncLobby(){
    Net.broadcast({ t:"lobby", players: players.map(p=>({name:p.name,score:p.score})) });
    const l=$("ll"); if(!l) return;
    l.innerHTML = players.map(p=>`<div class="item${p.name===myName?" me":""}"><span>${UI.esc(p.name)}</span><span class="tag">${p.id==="H"?"hôte":"✓"}</span></div>`).join("");
    const st=$("ls"), b=$("lg");
    if (st) st.textContent = players.length<2 ? `${players.length}/2 joueurs minimum` : `${players.length} joueurs — prêt !`;
    if (b) b.disabled = players.length<2;
  }
  function doJoin(code){
    Net.join(GAME, code, {
      onOpen: () => { Net.send({t:"hello", name:myName}); guestWait(); },
      onData: guestData,
      onLeave: () => UI.banner("L'hôte s'est déconnecté — partie terminée.", true, 7000),
      onError: () => {
        screen(`<div class="center"><div class="eyebrow">Oups</div>
          <h2 class="big">Connexion impossible</h2>
          <p class="sub">Vérifie le code et que l'hôte est bien sur l'écran de son salon.</p>
          <div class="btn-row"><button class="btn primary" id="rt">Réessayer</button></div></div>`);
        $("rt").onclick = sNetChoice;
      },
    });
  }
  function guestWait(){
    screen(`<div class="center">${stepper(4,4)}
      <div class="eyebrow">Connecté !</div><h2 class="big">Bien reçu, ${UI.esc(myName)}</h2>
      <div class="list" id="ll"></div>
      <p class="sub">En attente que l'hôte lance la manche…</p></div>`);
  }
  function guestData(_, d){
    if (!d || !d.t) return;
    if (d.t==="lobby"){
      const l=$("ll");
      if (l) l.innerHTML = d.players.map(p=>`<div class="item${p.name===myName?" me":""}"><span>${UI.esc(p.name)}</span><span class="tag">${p.score} pts</span></div>`).join("");
    }
    if (d.t==="wait") guestWait();
    if (d.t==="clue"){ started=true; theme=d.theme; sClue(d,false); }
    if (d.t==="waitcount") setWaitStatus(d.remaining);
    if (d.t==="reveal") sReveal(d,false);
    if (d.t==="roundend") sRoundEnd(d,false);
  }
  function sThemeHost(){
    screen(`<div class="center">
      <div class="eyebrow">Thème</div><h2 class="big">Choisis le thème de la manche</h2>
      <p class="sub">Tu pourras en changer entre les manches.</p>
      <div class="theme-grid">${Object.keys(META).map(k =>
        `<button class="theme-btn" data-th="${k}"><span class="t-emoji">${META[k].emoji}</span>${META[k].label}</button>`).join("")}</div>
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="tb">Retour au salon</button></div></div>`);
    document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>{ theme=b.dataset.th; started=true; hostRound(); });
    $("tb").onclick = sLobby;
  }

  /* ═══ MANCHE — RÉPONSES SIMULTANÉES ═══ */
  function hostRound(){
    round = { entry: pickEntry(theme), idx:0, answers:{}, done:false };
    pushClue();
  }
  const cluePayload = () => ({ t:"clue", theme, idx: round.idx, clues: round.entry.clues.slice(0, round.idx+1) });
  function pushClue(){
    round.answers = {};
    const p = cluePayload();
    Net.broadcast(p);
    sClue(p, true);
  }
  function hostAnswer(pid, text){
    if (!round || round.done || round.answers[pid]!==undefined) return;
    round.answers[pid] = text;
    checkAllAnswered();
  }
  function checkAllAnswered(){
    const remaining = players.length - Object.keys(round.answers).filter(k=>players.some(p=>p.id===k)).length;
    Net.broadcast({ t:"waitcount", remaining });
    setWaitStatus(remaining);
    if (remaining<=0) hostReveal();
  }
  function hostReveal(){
    const rows = players.map(p => {
      const a = round.answers[p.id];
      const txt = (a===undefined || a==="") ? null : a;
      return { name:p.name, answer:txt, correct: txt ? isRight(txt, round.entry) : false };
    });
    const winners = rows.filter(r=>r.correct).map(r=>r.name);
    const pts = PTS(round.idx);
    if (winners.length){
      players.forEach(p => { if (winners.includes(p.name)) p.score += pts; });
      round.done = true;
    }
    const payload = { t:"reveal", rows, pts, winners, last: round.idx>=4,
      answer: (winners.length || round.idx>=4) ? round.entry.name : null };
    Net.broadcast(payload);
    sReveal(payload, true);
    if (!winners.length && round.idx>=4) round.done = true;
  }
  function hostNextClue(){
    round.idx++;
    pushClue();
  }
  function hostEndRound(){
    const payload = { t:"roundend", answer: round.entry.name,
      winners: null, scores: players.map(p=>({name:p.name,score:p.score})) };
    Net.broadcast(payload);
    sRoundEnd(payload, true);
  }
  function hostEndWithWinners(winners, pts){
    const payload = { t:"roundend", answer: round.entry.name, winners, pts,
      scores: players.map(p=>({name:p.name,score:p.score})) };
    Net.broadcast(payload);
    sRoundEnd(payload, true);
  }

  /* ═══ AFFICHAGE ═══ */
  function sClue(d, isHost){
    iAnswered = false;
    screen(`<div class="center" style="justify-content:flex-start;">
      <div class="eyebrow">Thème : ${META[d.theme].label} · Indice ${d.idx+1}/5</div>
      <div class="pts-left">🏆 ${PTS(d.idx)} point${PTS(d.idx)>1?"s":""} pour tous ceux qui trouvent</div>
      <div style="width:100%;">${d.clues.map((c,i)=>`<div class="clue-box"><div class="clue-tag">Indice ${i+1}</div>${UI.esc(c)}</div>`).join("")}</div>
      <div class="answer-row">
        <input class="field" id="ai" maxlength="24" placeholder="Ta réponse…" autocomplete="off">
        <button class="btn primary" id="ag">OK</button>
      </div>
      <div class="btn-row"><button class="btn ghost" id="ap">Je ne sais pas — passer</button></div>
      <div class="status" id="ws">Les réponses de chacun restent cachées jusqu'à ce que tout le monde ait répondu.</div>
    </div>`);
    const send = txt => {
      if (iAnswered) return;
      iAnswered = true;
      $("ai").disabled = true; $("ag").disabled = true; $("ap").disabled = true;
      $("ws").textContent = "✓ Réponse enregistrée — on attend les autres…";
      $("ws").className = "status ok";
      if (Net.isHost()) hostAnswer("H", txt);
      else Net.send({ t:"answer", text: txt });
    };
    $("ag").onclick = () => { const t=$("ai").value.trim(); if(t) send(t); };
    $("ai").addEventListener("keydown", e => { if(e.key==="Enter"){ const t=$("ai").value.trim(); if(t) send(t); } });
    $("ap").onclick = () => send("");
  }
  function setWaitStatus(r){
    const s=$("ws"); if(!s || !iAnswered) return;
    s.textContent = r>0 ? `✓ Réponse enregistrée — encore ${r} joueur${r>1?"s":""}…` : "Révélation…";
  }
  function sReveal(d, isHost){
    const someone = d.winners && d.winners.length;
    screen(`<div class="center">
      <div class="eyebrow">Réponses de tout le monde</div>
      <h2 class="big" style="font-size:1.2rem;">${someone ? "🎉 Trouvé !" : "Personne n'a trouvé"}</h2>
      ${d.answer ? `<p class="sub">C'était <b>${UI.esc(d.answer)}</b>.</p>` : ""}
      <div class="reveal-list">${d.rows.map(r =>
        `<div class="r ${r.correct?"good":"bad"}">
          <span>${UI.esc(r.name)}</span>
          <span class="ans">${r.answer ? "« "+UI.esc(r.answer)+" »" : "(a passé)"}</span>
          <span class="mark">${r.correct?"✅":"❌"}</span>
        </div>`).join("")}</div>
      ${someone ? `<p class="sub">${d.winners.map(UI.esc).join(", ")} ${d.winners.length>1?"marquent":"marque"} <b>${d.pts} point${d.pts>1?"s":""}</b>${d.winners.length>1?" chacun (ex aequo)":""}.</p>` : ""}
      ${isHost ? `<div class="btn-row">
          ${someone || d.last
            ? `<button class="btn primary" id="rc">Voir les scores ➜</button>`
            : `<button class="btn primary" id="nc">Indice suivant ➜</button>`}
        </div>` : `<div class="status">L'hôte continue…</div>`}
    </div>`);
    if (isHost){
      if (someone) $("rc").onclick = () => hostEndWithWinners(d.winners, d.pts);
      else if (d.last) $("rc").onclick = () => hostEndRound();
      else $("nc").onclick = () => hostNextClue();
    }
  }
  function sRoundEnd(d, isHost){
    screen(`<div class="center">
      <div class="eyebrow">${d.winners && d.winners.length ? "Manche terminée" : "Personne n'a trouvé"}</div>
      <h2 class="big">C'était ${UI.esc(d.answer)} !</h2>
      ${d.winners && d.winners.length
        ? `<p class="sub"><b>${d.winners.map(UI.esc).join(", ")}</b> ${d.winners.length>1?"marquent":"marque"} ${d.pts} point${d.pts>1?"s":""}${d.winners.length>1?" chacun":""}.</p>`
        : `<p class="sub">Aucun point cette manche.</p>`}
      <div class="scores">${scoresHtml(d.scores)}</div>
      ${isHost?`<div class="btn-row">
          <button class="btn primary" id="rn">Nouvelle manche (même thème)</button>
          <button class="btn ghost" id="rt">Changer de thème</button>
        </div>`:`<div class="status">L'hôte relance quand vous êtes prêts.</div>`}</div>`);
    if (isHost){
      $("rn").onclick = () => hostRound();
      $("rt").onclick = () => sThemeHost();
    }
  }

  /* ═══ MODE 1 TÉLÉPHONE ═══ */
  let solo=null;
  function sSoloPlayers(){
    solo = { names:[], scores:{}, entry:null, idx:0 };
    screen(`<div class="center">${stepper(2,4)}
      <div class="eyebrow">1 téléphone — écran partagé</div>
      <h2 class="big">Qui joue ?</h2>
      <p class="sub">Les indices s'affichent pour tous, on répond à voix haute. Au moins 2 prénoms.</p>
      <input class="field" id="sn" maxlength="14" placeholder="Prénom">
      <div class="btn-row" style="margin-bottom:10px;"><button class="btn ghost" id="sa">+ Ajouter</button></div>
      <div class="list" id="sl"></div>
      <div class="btn-row">
        <button class="btn ghost" id="sb">Retour</button>
        <button class="btn primary" id="sg" disabled>Choisir le thème ➜</button>
      </div></div>`);
    const add = () => {
      const n=$("sn").value.trim();
      if (n.length<2) return;
      let name=n,i=2;
      while (solo.names.includes(name)) name=n+" "+(i++);
      solo.names.push(name); solo.scores[name]=0;
      $("sn").value="";
      $("sl").innerHTML = solo.names.map(x=>`<div class="item"><span>${UI.esc(x)}</span></div>`).join("");
      $("sg").disabled = solo.names.length<2;
      $("sn").focus();
    };
    $("sa").onclick=add;
    $("sn").addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
    $("sb").onclick=sHome;
    $("sg").onclick=sSoloTheme;
  }
  function sSoloTheme(){
    screen(`<div class="center">${stepper(3,4)}
      <div class="eyebrow">Thème</div><h2 class="big">Choisissez le thème</h2>
      <div class="theme-grid">${Object.keys(META).map(k =>
        `<button class="theme-btn" data-th="${k}"><span class="t-emoji">${META[k].emoji}</span>${META[k].label}</button>`).join("")}</div>
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="stb">Retour</button></div></div>`);
    document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>{ theme=b.dataset.th; soloRound(); });
    $("stb").onclick=sSoloPlayers;
  }
  function soloRound(){ solo.entry=pickEntry(theme); solo.idx=0; soloClue(); }
  function soloClue(){
    screen(`<div class="center" style="justify-content:flex-start;">
      <div class="eyebrow">Thème : ${META[theme].label} · Indice ${solo.idx+1}/5</div>
      <div class="pts-left">🏆 ${PTS(solo.idx)} point${PTS(solo.idx)>1?"s":""} pour chacun de ceux qui trouvent</div>
      <div style="width:100%;">${solo.entry.clues.slice(0,solo.idx+1)
        .map((c,i)=>`<div class="clue-box"><div class="clue-tag">Indice ${i+1}</div>${UI.esc(c)}</div>`).join("")}</div>
      <p class="sub" style="font-size:.8rem;margin:8px auto 4px;">Touche tous ceux qui ont trouvé (ex aequo possible), puis valide.</p>
      <div class="list" id="sf"></div>
      <div class="btn-row">
        <button class="btn primary" id="sv" disabled>Valider les gagnants ➜</button>
        ${solo.idx<4?`<button class="btn ghost" id="sx">Personne ➜ indice suivant</button>`:""}
        <button class="btn danger" id="sr">Révéler la réponse</button>
      </div></div>`);
    const found = new Set();
    solo.names.forEach(n => {
      const b=document.createElement("button");
      b.className="item"; b.innerHTML=`<span>${UI.esc(n)}</span><span class="tag">a trouvé</span>`;
      b.onclick = () => {
        found.has(n) ? found.delete(n) : found.add(n);
        b.classList.toggle("sel", found.has(n));
        $("sv").disabled = found.size===0;
      };
      $("sf").appendChild(b);
    });
    $("sv").onclick = () => {
      const pts = PTS(solo.idx);
      found.forEach(n => solo.scores[n] += pts);
      soloEnd([...found], pts);
    };
    const x=$("sx"); if (x) x.onclick = () => { solo.idx++; soloClue(); };
    $("sr").onclick = () => soloEnd([], 0);
  }
  function soloEnd(winners, pts){
    screen(`<div class="center">
      <div class="eyebrow">${winners.length?"🎉 Trouvé !":"Personne n'a trouvé"}</div>
      <h2 class="big">C'était ${UI.esc(solo.entry.name)} !</h2>
      <p class="sub">${winners.length
        ? `<b>${winners.map(UI.esc).join(", ")}</b> ${winners.length>1?"marquent":"marque"} ${pts} point${pts>1?"s":""}${winners.length>1?" chacun":""}.`
        : "Aucun point cette manche."}</p>
      <div class="scores">${solo.names.slice().sort((a,b)=>solo.scores[b]-solo.scores[a])
        .map((n,i)=>`<div class="row${i===0&&solo.scores[n]>0?" top":""}"><span>${UI.esc(n)}</span><span class="pts">${solo.scores[n]} pt${solo.scores[n]>1?"s":""}</span></div>`).join("")}</div>
      <div class="btn-row">
        <button class="btn primary" id="rn">Nouvelle manche (même thème)</button>
        <button class="btn ghost" id="rt">Changer de thème</button>
      </div></div>`);
    $("rn").onclick=()=>soloRound();
    $("rt").onclick=sSoloTheme;
  }

  sHome();
})();
</script>
</body>
</html>
