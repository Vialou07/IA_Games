name: Stats Worlds 2026
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths: ["tools/build_stats.py", "data/teams.json", ".github/workflows/stats.yml"]
permissions:
  contents: write
concurrency:
  group: stats-worlds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_stats.py
      - run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/stats_log.txt || true
          git diff --cached --quiet || (git commit -m "Stats Worlds : mise à jour auto" && git pull --rebase && git push)
