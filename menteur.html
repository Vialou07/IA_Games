<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Menteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{--accent:#E15A4C;--accent-dark:#8F3229;}
  .btn.primary{color:#fff;}
  .stmt-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin:8px auto;}
  .stmt-opt{background:var(--panel);border:1px solid rgba(200,170,110,.4);color:var(--ink);cursor:pointer;
    padding:15px;font-size:.98rem;line-height:1.4;font-family:inherit;text-align:left;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
  .stmt-opt.sel{border-color:var(--accent);background:var(--panel2);}
  .stmt-opt.good{border-color:var(--ok);background:rgba(61,214,140,.15);}
  .stmt-opt.bad{border-color:var(--danger);background:rgba(225,90,76,.15);}
  .stmt-opt .lbl{font-family:'Cinzel',serif;color:var(--accent);margin-right:8px;}
</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">‹</a><div class="rune"></div><h1>Le Menteur</h1><div class="rune"></div></div>
<div class="wrap" id="wrap"></div>
<footer class="note">Trois affirmations, une seule est fausse — trouve l'intrus.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="net.js"></script>
<script src="themes.js"></script>
<script src="gamedata.js"></script>
<script src="duo.js"></script>
<script src="lobby.js"></script>
<script>
(function(){
  const DATA=GDATA.liar, META=Duo.META, $=Duo.$, screen=Duo.screen;
  const ROUND=8;
  let L, theme=null, game=null, answered=false, solo=null;
  function build(th){ return UI.shuffle(DATA[th].slice()).slice(0,ROUND).map(item=>{
    const order=UI.shuffle([0,1,2]);
    return { stmts:order.map(i=>item.s[i]), lie:order.indexOf(item.lie) };
  }); }

  L=makeLobby({
    game:"liar", title:"Le Menteur",
    subtitle:"Trois affirmations s'affichent, mais une seule est fausse. Chacun désigne l'intrus. 1 point si tu le trouves. Le meilleur score gagne.",
    minPlayers:2, themeHint:"8 séries tirées au hasard.",
    reset:()=>{game=null;},
    onThemeChosen:()=>{ theme=L.theme; hostStart(); },
    onHostData:(id,d)=>{ if(d&&d.t==="answer")hostAnswer(id,d.pick); },
    onLeave:()=>{ if(game&&!game.done)checkAll(); },
    onData:d=>guestData(d),
    soloStart:()=>soloPlayers(),
  });

  function hostStart(){ L.players.forEach(p=>p.score=0); game={list:build(theme),idx:0,answers:{},done:false}; push(); }
  function push(){ game.answers={}; const it=game.list[game.idx]; const p={t:"round",theme,idx:game.idx,total:ROUND,stmts:it.stmts}; L.broadcast(p); sRound(p,true); }
  function hostAnswer(pid,pick){ if(!game||game.done||game.answers[pid]!==undefined)return; game.answers[pid]=pick; checkAll(); }
  function checkAll(){ const rem=L.players.length-Object.keys(game.answers).filter(k=>L.players.some(p=>p.id===k)).length; L.broadcast({t:"waitcount",remaining:rem}); setWait(rem); if(rem<=0)reveal(); }
  function reveal(){
    const lie=game.list[game.idx].lie;
    const rows=L.players.map(p=>{ const a=game.answers[p.id]; const ok=a===lie; if(ok)p.score++; return {name:p.name,ok,pick:a}; });
    const last=game.idx>=ROUND-1;
    const pl={t:"reveal",lie,stmts:game.list[game.idx].stmts,rows,scores:L.players.map(p=>({name:p.name,score:p.score})),last};
    L.broadcast(pl); sReveal(pl,true);
  }
  function hostNext(){ if(game.idx>=ROUND-1){ game.done=true; const f={t:"final",scores:L.players.map(p=>({name:p.name,score:p.score}))}; L.broadcast(f); sFinal(f,true);} else { game.idx++; push(); } }
  function guestData(d){ if(!d||!d.t)return;
    if(d.t==="round"){ L.started=true; theme=d.theme; sRound(d,false); }
    if(d.t==="waitcount")setWait(d.remaining);
    if(d.t==="reveal")sReveal(d,false);
    if(d.t==="final")sFinal(d,false);
  }

  const L3=["A","B","C"];
  function sRound(d,isHost){
    answered=false;
    screen(`<div class="center" style="justify-content:flex-start;">
      <div class="eyebrow">Thème : ${META[d.theme].label} · ${d.idx+1}/${d.total}</div>
      <h2 class="big" style="font-size:1.1rem;margin-bottom:6px;">Laquelle est fausse ?</h2>
      <div class="stmt-list" id="sl"></div>
      <div class="status" id="ws" style="margin-top:12px;">Touche l'affirmation que tu crois fausse.</div></div>`);
    d.stmts.forEach((s,i)=>{
      const b=document.createElement("button"); b.className="stmt-opt"; b.innerHTML=`<span class="lbl">${L3[i]}.</span>${UI.esc(s)}`;
      b.onclick=()=>{ if(answered)return; answered=true; document.querySelectorAll(".stmt-opt").forEach(x=>x.disabled=true); b.classList.add("sel"); $("ws").textContent="✓ Réponse envoyée — on attend les autres…"; $("ws").className="status ok"; if(Net.isHost())hostAnswer("H",i); else Net.send({t:"answer",pick:i}); };
      $("sl").appendChild(b);
    });
  }
  function setWait(r){ const s=$("ws"); if(s&&answered)s.textContent=r>0?`✓ Réponse envoyée — encore ${r}…`:"Résultat…"; }
  function sReveal(d,isHost){
    screen(`<div class="center" style="justify-content:flex-start;"><div class="eyebrow">Résultat</div>
      <h2 class="big" style="font-size:1.1rem;">L'intrus était : ${L3[d.lie]}</h2>
      <div class="stmt-list">${d.stmts.map((s,i)=>`<div class="stmt-opt ${i===d.lie?"bad":"good"}"><span class="lbl">${L3[i]}.</span>${UI.esc(s)}${i===d.lie?" ❌ (faux)":" ✅"}</div>`).join("")}</div>
      <div class="reveal-list" style="width:100%;max-width:340px;margin:12px auto;">${d.rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:9px 12px;background:var(--panel);border:1px solid ${r.ok?"var(--ok)":"rgba(225,90,76,.5)"};margin-bottom:6px;"><span>${UI.esc(r.name)}</span><span style="color:var(--text);">${r.pick===undefined?"(rien)":L3[r.pick]}</span><span>${r.ok?"✅":"❌"}</span></div>`).join("")}</div>
      <div class="scores">${Duo.scoresHtml(d.scores)}</div>
      ${isHost?`<div class="btn-row"><button class="btn primary" id="nx">${d.last?"Résultat final ➜":"Suivante ➜"}</button></div>`:`<div class="status">L'hôte continue…</div>`}</div>`);
    if(isHost)$("nx").onclick=hostNext;
  }
  function sFinal(d,isHost){
    const s=d.scores.slice().sort((a,b)=>b.score-a.score),top=s[0].score,w=s.filter(x=>x.score===top).map(x=>x.name);
    screen(`<div class="center"><div class="eyebrow">Fin</div><h2 class="big">${w.length>1?"Égalité !":"🏆 "+UI.esc(w[0])+" gagne !"}</h2>
      <div class="scores">${Duo.scoresHtml(d.scores)}</div>
      ${isHost?`<div class="btn-row"><button class="btn primary" id="rn">Rejouer (même thème)</button><button class="btn ghost" id="rt">Changer de thème</button></div>`:`<div class="status">L'hôte peut relancer.</div>`}
      <div class="btn-row"><a class="btn ghost" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;">Autres jeux</a></div></div>`);
    if(isHost){ $("rn").onclick=hostStart; $("rt").onclick=L.themeHost; }
  }

  /* SOLO */
  function soloPlayers(){
    solo={names:[],scores:{},list:null,idx:0};
    screen(`<div class="center">${Duo.stepper(2,4)}<div class="eyebrow">1 téléphone</div><h2 class="big">Qui joue ?</h2>
      <p class="sub">Au moins 2 prénoms.</p><input class="field" id="sn" maxlength="14" placeholder="Prénom">
      <div class="btn-row" style="margin-bottom:10px;"><button class="btn ghost" id="sa">+ Ajouter</button></div>
      <div class="list" id="sl2"></div><div class="btn-row"><button class="btn ghost" id="sb">Retour</button><button class="btn primary" id="sg" disabled>Choisir le thème ➜</button></div></div>`);
    const add=()=>{ const n=$("sn").value.trim(); if(n.length<2)return; let name=n,i=2; while(solo.names.includes(name))name=n+" "+(i++); solo.names.push(name); solo.scores[name]=0; $("sn").value=""; $("sl2").innerHTML=solo.names.map(x=>`<div class="item"><span>${UI.esc(x)}</span></div>`).join(""); $("sg").disabled=solo.names.length<2; $("sn").focus(); };
    $("sa").onclick=add; $("sn").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
    $("sb").onclick=L.home; $("sg").onclick=()=>soloTheme(th=>{ theme=th; solo.list=build(theme); solo.idx=0; solo.names.forEach(n=>solo.scores[n]=0); soloRound(); },soloPlayers);
  }
  function soloRound(){
    if(solo.idx>=ROUND){ soloFinal(); return; }
    screen(`<div class="center"><div class="eyebrow">${solo.idx+1}/${ROUND}</div>
      <h2 class="big" style="font-size:1.1rem;">Chacun son tour</h2>
      <p class="sub">Passez le téléphone. Chacun désigne l'intrus.</p>
      <div class="btn-row"><button class="btn primary" id="go">Voir les affirmations ➜</button></div></div>`);
    $("go").onclick=()=>soloAsk(0,{});
  }
  function soloAsk(pi,res){
    if(pi>=solo.names.length){ const lie=solo.list[solo.idx].lie; solo.names.forEach(n=>{if(res[n]===lie)solo.scores[n]++;}); soloReveal(res); return; }
    const who=solo.names[pi], it=solo.list[solo.idx];
    screen(`<div class="center" style="justify-content:flex-start;"><div class="eyebrow">${UI.esc(who)}, à toi</div>
      <h2 class="big" style="font-size:1.05rem;margin-bottom:6px;">Laquelle est fausse ?</h2>
      <div class="stmt-list" id="sll"></div></div>`);
    it.stmts.forEach((s,i)=>{ const b=document.createElement("button"); b.className="stmt-opt"; b.innerHTML=`<span class="lbl">${L3[i]}.</span>${UI.esc(s)}`; b.onclick=()=>{ res[who]=i; soloAsk(pi+1,res); }; $("sll").appendChild(b); });
  }
  function soloReveal(res){
    const it=solo.list[solo.idx];
    screen(`<div class="center" style="justify-content:flex-start;"><div class="eyebrow">Résultat</div>
      <h2 class="big" style="font-size:1.1rem;">L'intrus était : ${L3[it.lie]}</h2>
      <div class="stmt-list">${it.stmts.map((s,i)=>`<div class="stmt-opt ${i===it.lie?"bad":"good"}"><span class="lbl">${L3[i]}.</span>${UI.esc(s)}${i===it.lie?" ❌":" ✅"}</div>`).join("")}</div>
      <div class="reveal-list" style="width:100%;max-width:340px;margin:12px auto;">${solo.names.map(n=>{const ok=res[n]===it.lie;return `<div style="display:flex;justify-content:space-between;padding:9px 12px;background:var(--panel);border:1px solid ${ok?"var(--ok)":"rgba(225,90,76,.5)"};margin-bottom:6px;"><span>${UI.esc(n)}</span><span style="color:var(--text);">${L3[res[n]]}</span><span>${ok?"✅":"❌"}</span></div>`;}).join("")}</div>
      <div class="scores">${solo.names.slice().sort((a,b)=>solo.scores[b]-solo.scores[a]).map((n,i)=>`<div class="row${i===0&&solo.scores[n]>0?" top":""}"><span>${UI.esc(n)}</span><span class="pts">${solo.scores[n]} pts</span></div>`).join("")}</div>
      <div class="btn-row"><button class="btn primary" id="nx">${solo.idx>=ROUND-1?"Résultat final ➜":"Suivante ➜"}</button></div></div>`);
    $("nx").onclick=()=>{ solo.idx++; soloRound(); };
  }
  function soloFinal(){
    const sorted=solo.names.slice().sort((a,b)=>solo.scores[b]-solo.scores[a]),top=solo.scores[sorted[0]],w=sorted.filter(n=>solo.scores[n]===top);
    screen(`<div class="center"><div class="eyebrow">Fin</div><h2 class="big">${w.length>1?"Égalité !":"🏆 "+UI.esc(w[0])+" gagne !"}</h2>
      <div class="scores">${sorted.map((n,i)=>`<div class="row${i===0?" top":""}"><span>${UI.esc(n)}</span><span class="pts">${solo.scores[n]} pts</span></div>`).join("")}</div>
      <div class="btn-row"><button class="btn primary" id="rn">Rejouer</button><button class="btn ghost" id="rt">Changer de thème</button></div>
      <div class="btn-row"><a class="btn ghost" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;">Autres jeux</a></div></div>`);
    $("rn").onclick=()=>{ solo.list=build(theme); solo.idx=0; solo.names.forEach(n=>solo.scores[n]=0); soloRound(); };
    $("rt").onclick=()=>soloTheme(th=>{theme=th;solo.list=build(theme);solo.idx=0;solo.names.forEach(n=>solo.scores[n]=0);soloRound();},soloPlayers);
  }

  L.home();
})();
</script>
</body>
</html>
