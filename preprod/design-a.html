<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<title>Worlds 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://esports-api.lolesports.com" crossorigin>
<link rel="preconnect" href="https://wsrv.nl">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Worlds 2026, direction A « façon Apple Sports » =====================
   Une pile d'écrans (chaque toucher pousse un écran depuis la droite), grands titres, listes nettes, cartes arrondies,
   contrôles segmentés, chiffres grands et labels courts. Thème sombre, couleurs des équipes en accent. */
:root{
  --bg:#0A0A0C;--bg2:#111216;--card:#16171B;--card2:#1E2025;--card3:#272A31;
  --sep:rgba(255,255,255,.075);--sep2:rgba(255,255,255,.13);
  --t1:#F5F5F7;--t2:rgba(235,235,245,.64);--t3:rgba(235,235,245,.38);--t4:rgba(235,235,245,.2);
  --tint:#E8C26E;--tint2:#F3D99B;--live:#FF453A;--up:#32D74B;--down:#FF6B5E;--warn:#FFCC4D;--teal:#5AC8D8;
  --blue:#4C8DF6;--red:#EF5466;
  --r-xl:24px;--r-l:20px;--r-m:14px;--r-s:10px;
  --ease:cubic-bezier(.32,.72,0,1);--ease2:cubic-bezier(.2,.8,.2,1);
  --disp:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sys:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --nbh:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font:400 15px/1.35 var(--sys);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:var(--tint);text-decoration:none}
img{display:block}
.num,.tab{font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:.2px}

/* ---------- pile d'écrans ---------- */
#app{position:fixed;inset:0;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;background:var(--bg);-webkit-overflow-scrolling:touch;contain:layout paint;box-shadow:-1px 0 0 rgba(255,255,255,.04)}
.scr.off{visibility:hidden}
#shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.wrap{max-width:600px;margin:0 auto;padding:0 16px calc(40px + var(--sb))}

/* barre de navigation : retour à gauche, petit titre qui apparaît au défilement */
.nb{position:sticky;top:0;z-index:20;height:calc(var(--nbh) + var(--st));padding-top:var(--st);background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:box-shadow .2s}
.nb.sc{box-shadow:0 1px 0 var(--sep)}
.nb .bk{justify-self:start;display:flex;align-items:center;gap:2px;height:44px;padding:0 14px 0 8px;color:var(--tint);font-size:16px;font-weight:500;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .bk svg{width:22px;height:22px;flex:none}
.nb .nt{font-weight:650;font-size:16px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.nb.sc .nt{opacity:1;transform:none}
.nb .na{justify-self:end;display:flex;align-items:center;padding-right:6px;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--tint)}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--card2)}

/* grand titre */
.lt{margin:2px 0 14px}
.lt h1{margin:0;font:700 36px/1.02 var(--disp);letter-spacing:.2px}
.lt p{margin:4px 0 0;color:var(--t2);font-size:15px}
.lt .ey{display:block;color:var(--t2);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}

/* titres de section */
.sh2{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 9px;min-height:22px}
.sh2 h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}
.sh2 .more{font-size:15px;color:var(--tint);padding:6px 0 6px 12px;margin:-6px 0}
.sh2 .ib{width:36px;height:36px;margin:-8px -8px -8px 0}

/* cartes et listes groupées */
.card{background:var(--card);border-radius:var(--r-xl);overflow:hidden;position:relative}
.grp{background:var(--card);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;position:relative}
.grp>.row+.row::before,.grp>*+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.grp>.row.ind+.row.ind::before{left:60px}
button.row:active,.tap:active{background:var(--card2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--t2);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{color:var(--t2);font-size:15px;white-space:nowrap}
.row .vl.big{font:700 22px/1 var(--disp);color:var(--t1)}
.chev{width:8px;height:14px;flex:none;color:var(--t4)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--card3);color:var(--tint)}
.ico svg{width:18px;height:18px}

/* contrôle segmenté */
.segw{position:sticky;top:calc(var(--nbh) + var(--st));z-index:15;background:var(--bg);padding:6px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:12px;padding:3px;height:40px}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card3);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .3s var(--ease);will-change:transform}
.seg button{position:relative;text-align:center;z-index:1;font-size:14px;font-weight:600;color:var(--t2);border-radius:9px;white-space:nowrap;transition:color .2s}
.seg button[aria-selected=true]{color:var(--t1)}
.pane{animation:pin .26s var(--ease2) both}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* images */
.lg{object-fit:contain;flex:none}
.mono{display:inline-grid;place-items:center;border-radius:50%;font:700 11px/1 var(--disp);color:#fff;flex:none;letter-spacing:.3px}
.ph{border-radius:50%;object-fit:cover;object-position:50% 12%;flex:none;background:var(--card3)}
.chi{border-radius:8px;flex:none;background:var(--card3);object-fit:cover}
.chi.tx{display:inline-grid;place-items:center;font-size:10px;color:var(--t2)}
.flag{width:16px;height:12px;border-radius:2px;object-fit:cover;display:inline-block;vertical-align:-1px}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:700;letter-spacing:.03em;background:var(--card3);color:var(--t2);white-space:nowrap}
.pill.live{background:rgba(255,69,58,.16);color:#FF6A60}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--card3);color:var(--t2);vertical-align:1px}
.tag.on{background:rgba(90,200,216,.15);color:var(--teal)}
.tag.w{background:rgba(255,204,77,.14);color:var(--warn)}
.rk{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 6px;border-radius:6px;background:rgba(232,194,110,.13);color:var(--tint2);font:700 13px/1 var(--disp);letter-spacing:.3px}
.rk.lo{background:var(--card3);color:var(--t2)}

/* bouton ⓘ */
.ii{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:var(--t3);flex:none}
.ii svg{width:20px;height:20px}
.ii:active{color:var(--tint)}

/* lignes de match (façon Apple Sports : deux équipes empilées, score à droite, statut tout à droite) */
.mr{display:grid;grid-template-columns:1fr 64px 1fr 56px;align-items:center;min-height:58px;padding:7px 10px 7px 12px;width:100%;position:relative}
.grp>.mr+.mr::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.mr:active{background:var(--card2)}
.mr .ta,.mr .tb{display:flex;align-items:center;gap:9px;min-width:0}
.mr .ta{justify-content:flex-end}
.mr .ta b,.mr .tb b{font:700 19px/1 var(--disp);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .lo{opacity:.4}
.mr .sc{text-align:center;font:700 21px/1 var(--disp);letter-spacing:.5px;white-space:nowrap}
.mr .sc i{font-style:normal;color:var(--t3);font-weight:500;margin:0 3px}
.mr .sc.tm2{font-size:17px;color:var(--t1)}
.mr .sc small{display:block;font:500 11px/1.2 var(--sys);color:var(--t3);margin-top:3px;letter-spacing:0}
.mr .st{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;font-size:12px;color:var(--t3);white-space:nowrap}
.mr .st .pill{height:20px;padding:0 7px;font-size:10.5px}
.mr .st i{font-style:normal;font-weight:700}.mr .st i.ok{color:var(--up)}.mr .st i.ko{color:var(--down)}
.mr .pk{box-shadow:0 0 0 2px var(--tint);border-radius:50%}

/* ---------- carte d'affiche (héros) ---------- */
.hero{padding:16px 16px 18px;background:var(--card);background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 13%,var(--card)) 0%,var(--card) 42%,var(--card) 58%,color-mix(in srgb,var(--c2) 13%,var(--card)) 100%)}
.hero .hm{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--t2);font-size:13px;font-weight:600;min-height:22px}
.vs3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:12px;gap:8px}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tm b{font:700 24px/1 var(--disp);letter-spacing:.5px}
.tm small{color:var(--t2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tm.lo{opacity:.45}
.mid{text-align:center;min-width:96px}
.mid .big{font:700 46px/1 var(--disp);letter-spacing:1px;white-space:nowrap}
.mid .big i{font-style:normal;color:var(--t3);margin:0 6px;font-weight:500}
.mid small{display:block;color:var(--t2);font-size:13px;margin-top:4px}
.mid .clk{font:700 30px/1 var(--disp);letter-spacing:.5px}
.cd{font:700 30px/1 var(--disp);letter-spacing:.5px}

/* barre de chances (robot ou direct) */
.pb{margin-top:16px}
.pb .bl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--t2)}
.pb .bl b{font:700 20px/1 var(--disp);color:var(--t1);letter-spacing:.3px}
.pb .bl span{display:flex;align-items:baseline;gap:6px}
.pb .bar{display:flex;gap:3px;height:8px;margin-top:7px}
.pb .bar i{border-radius:4px;transition:flex-grow .6s var(--ease2)}
.pb .bl em{font-style:normal;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:4px}
.pb .bl em svg{width:14px;height:14px}

/* paris en un geste */
.bet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bet button{height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:15px;transition:background .2s,box-shadow .2s}
.bet button[aria-pressed=true]{background:color-mix(in srgb,var(--c) 26%,var(--card2));box-shadow:inset 0 0 0 1.5px var(--c)}
.bet button[aria-pressed=true]::after{content:"✓";font-size:14px;color:var(--t1)}
.bet button:disabled{opacity:.5}
.betl{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--t2)}

/* une clé = une ligne */
.key{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;width:100%;text-align:left;position:relative;font-size:15px;line-height:1.38}
.grp>.key+.key::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.key .tag{flex:none;margin-top:1px;min-width:62px;text-align:center}
.key b{font-weight:650}
.key .chev{margin-top:4px;margin-left:auto}

/* face à face par poste */
.dl{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;min-height:64px;padding:8px 12px;width:100%;position:relative}
.grp>.dl+.dl::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--sep)}
.dl:active{background:var(--card2)}
.dl .p{display:flex;align-items:center;gap:9px;min-width:0}
.dl .p.r{flex-direction:row-reverse;text-align:right}
.dl .p span{min-width:0}
.dl .p b{display:block;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .p b.ld{color:var(--tint2)}
.dl .p small{display:flex;gap:4px;align-items:center;color:var(--t2);font-size:12px;margin-top:2px}
.dl .p.r small{justify-content:flex-end}
.dl .c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.dl .c em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.dl .c b{font:700 20px/1 var(--disp);letter-spacing:.5px}
.dl .c small{font-size:11.5px;color:var(--t2);white-space:nowrap}

/* stat comparée (une stat = une ligne) */
.cmp{padding:12px 16px 11px;position:relative}
.grp>.cmp+.cmp::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--sep)}
.cmp .cl{display:grid;grid-template-columns:72px 1fr 72px;align-items:baseline}
.cmp .cl b{font:600 19px/1 var(--disp);color:var(--t2);letter-spacing:.3px}
.cmp .cl b.ld{color:var(--t1);font-weight:700}
.cmp .cl b:last-child{text-align:right}
.cmp .cl span{text-align:center;font-size:13px;color:var(--t2)}
.cmp .cb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:7px}
.cmp .cb i{height:5px;border-radius:3px;background:var(--card3);position:relative;overflow:hidden}
.cmp .cb i s{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.38}
.cmp .cb i:first-child s{right:0}.cmp .cb i:last-child s{left:0}
.cmp .cb i s.ld{opacity:1}

/* ---------- direct : HUD ---------- */
.hud{padding:14px 16px 16px}
.hud .hk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:10px}
.hud .ht{display:flex;align-items:center;gap:10px}
.hud .ht.r{flex-direction:row-reverse}
.hud .ht b{font:700 22px/1 var(--disp);letter-spacing:.5px}
.hud .ht small{display:block;font-size:12px;color:var(--t2);margin-top:3px}
.hud .ht.r span{text-align:right}
.hud .kl{font:700 52px/1 var(--disp);letter-spacing:1px;text-align:center;white-space:nowrap}
.hud .kl i{font-style:normal;color:var(--t3);font-weight:500;margin:0 8px}
.hud .gd{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-size:14px;color:var(--t2)}
.hud .gd b{color:var(--t1);font-weight:650}
.obr{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.obs{display:flex;align-items:center;gap:10px}
.ob{display:flex;align-items:center;gap:4px;font:700 16px/1 var(--disp);color:var(--t1)}
.ob svg{width:15px;height:15px;color:var(--t2)}
.drg{display:flex;gap:3px;align-items:center}
.drg i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.drg i.e{background:transparent;box-shadow:inset 0 0 0 1.5px var(--t4)}
.soul{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 5px;border-radius:5px;color:#111;background:var(--c)}
.spark{display:block}

/* direct : une ligne par poste */
.lv{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;min-height:62px;position:relative}
.grp>.lv+.lv::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--sep)}
.lv .s{display:flex;align-items:center;gap:9px;padding:8px 8px 8px 12px;min-width:0;height:100%}
.lv .s.r{flex-direction:row-reverse;text-align:right;padding:8px 12px 8px 8px}
.lv .s:active{background:var(--card2)}
.lv .s span{min-width:0}
.lv .s b{display:block;font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .s small{display:block;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .s small em{font-style:normal;color:var(--t1);font-weight:600}
.lv .m{text-align:center}
.lv .m em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--t3);text-transform:uppercase}
.lv .m b{display:block;font:700 16px/1.2 var(--disp);letter-spacing:.3px}
.cf{position:relative;flex:none}
.cf i{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;border-radius:9px;background:#000;border:1.5px solid var(--card);font:700 10.5px/14px var(--sys);text-align:center;font-style:normal;color:var(--t1)}
.cf.dead .chi{filter:grayscale(1) brightness(.55)}

/* fil du match */
.ev{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;min-height:48px;padding:6px 16px;position:relative;font-size:14.5px}
.grp>.ev+.ev::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--sep)}
.ev time{font:600 15px/1 var(--disp);color:var(--t2);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.ev>span{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;border-left:3px solid var(--c);padding-left:10px}
.ev .ar{color:var(--t3)}
.ev .vi{color:var(--t2);font-weight:500}
.ev small{color:var(--t3);font-size:12.5px}
.ev.big span{font-weight:650}
.ev.new{animation:evn 1.2s var(--ease2)}
@keyframes evn{from{background:rgba(232,194,110,.12)}to{background:transparent}}

/* courbe d'or */
.gc{padding:12px 14px 10px}
.gc svg{width:100%;height:80px;display:block}
.gc .gl{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:6px}

/* grande stat */
.bigst{display:flex;align-items:center;gap:16px;padding:16px}
.bigst .n{font:700 64px/.9 var(--disp);letter-spacing:.5px}
.bigst .n sup{font-size:.42em;vertical-align:top;margin-left:2px;position:relative;top:4px}
.bigst .tx b{display:block;font-size:17px;font-weight:650}
.bigst .tx small{display:block;color:var(--t2);font-size:13px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:18px;padding:12px 12px 11px}
.tile b{display:block;font:700 28px/1 var(--disp);letter-spacing:.3px}
.tile span{display:block;color:var(--t2);font-size:12.5px;margin-top:4px}

/* fiche joueur : en-tête */
.ph-hd{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.ph-hd .ph{width:84px;height:84px}
.ph-hd h1{margin:0;font:700 38px/1 var(--disp);letter-spacing:.3px}
.ph-hd p{margin:6px 0 0;color:var(--t2);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* stat de saison : une ligne */
.sl{display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:10px;min-height:50px;padding:6px 16px;position:relative}
.grp>.sl+.sl::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.sl span{font-size:15px}

function hexRgb(h){h=String(h||"#888").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
const rgbHex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
function liftCol(h){let [r,g,b]=hexRgb(h);const L=.2126*r+.7152*g+.0722*b;if(L<95){const k=95/Math.max(20,L);r=r+(255-r)*Math.min(.45,(k-1)*.25);g=g+(255-g)*Math.min(.45,(k-1)*.25);b=b+(255-b)*Math.min(.45,(k-1)*.25)}return rgbHex([r,g,b])}
const col=id=>id&&T[id]?liftCol(T[id].color):"#5A5F6B";
function cols(a,b){let c1=col(a),c2=col(b);const A=hexRgb(c1),B=hexRgb(c2),d=Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);
  const grey=x=>{const [r,g,b2]=hexRgb(x);return Math.max(r,g,b2)-Math.min(r,g,b2)<30};
  const bluish=x=>{const [r,g,b2]=hexRgb(x);return b2>r&&b2>=g};
  if(grey(c1)&&grey(c2)){c1="#4C8DF6";c2="#EF5466"}
  else if(d<80)c2=bluish(c1)?"#EF5466":"#4C8DF6";
  return [c1,c2]}

function pickTeam(mk,team){const m=MATCHES.find(x=>x.key===mk);if(!m||m.state!=="soon"){toast("Paris fermés : le match a commencé");return}
  vib(12);if(picks[mk]===team){delete picks[mk];toast("Prono retiré")}else{picks[mk]=team;toast(`Ton prono : ${T[team].id}`)}LS.set("picks",picks);refreshAll()}
function betHTML(m,compact){if(!m.t1||!m.t2||m.state!=="soon")return"";const pk=picks[m.key],[c1,c2]=cols(m.t1,m.t2);
  const b=(t,c)=>`<button data-pick="${t}" data-mk="${esc(m.key)}" aria-pressed="${pk===t}" style="--c:${c}" aria-label="Parier sur ${esc(T[t].name)}">${logo(t,22)}${esc(T[t].id)}</button>`;
  return (compact?`<div class="betc">${pk?"Ton prono, modifiable jusqu’au coup d’envoi":"Ton prono : touche l’équipe qui gagne"}</div>`:`<div class="betl"><span>${pk?"Ton prono":"Qui gagne ?"}</span><span>${pk?"modifiable jusqu’au coup d’envoi":"touche une équipe"}</span></div>`)+`<div class="bet">${b(m.t1,c1)}${b(m.t2,c2)}</div>`}

/* ---------- carte d'affiche : match à venir ---------- */

  const team=s=>`<div class="tm">${m[s]?logo(m[s],home?56:44):""}<b>${esc(tcode(m,s))}</b>${home?`<small>${m[s]?esc(T[m[s]].name):""}</small>`:""}</div>`;
  const center=ms>0&&ms<24*3600e3?`<div class="cd num" data-cd="${st.getTime()}">${cdTxt(ms)}</div><small>${relDay(st)} à ${fmtTime(st)}</small>`:`<div class="cd num">${fmtTime(st)}</div><small>${ms<=0?"coup d’envoi imminent":esc(relDay(st))}</small>`;
  const stake=stakeTxt(m);
  const why=W&&!W.tight&&W.role?`<button class="row tap" data-go="m/${esc(m.id)}" style="padding:12px 0 0;min-height:0;border-top:1px solid var(--sep);margin-top:14px">${IC.bot.replace("<svg",'<svg style="width:18px;height:18px;color:var(--t2);flex:none"')}<span class="tx"><b style="font-size:14.5px;font-weight:500;white-space:normal">${tnm(W.fav)} mieux noté à ${W.n} postes sur 5, surtout ${ROLE_AU[W.role]} (${pnm(W.who)})</b></span>${home?IC.chev:""}</button>`:"";
  return `<div class="card hero${home?"":" sm"}" style="--c1:${c1};--c2:${c2}">
    <div class="hm"><span>${esc(matchLabel(m))} · Bo${m.bo}</span>${stake?`<span class="pill" style="color:var(--warn);background:rgba(255,204,77,.12)">${esc(stake)}</span>`:""}</div>
    <div class="vs3"${home?` data-go="m/${esc(m.id)}" style="cursor:pointer"`:""}>${team("t1")}<div class="mid">${center}</div>${team("t2")}</div>
    ${p!=null?probBar(p,c1,c2,"robot","robot"):""}${home?why:""}${betHTML(m,!home)}</div>`}

/* ---------- accueil : le moment de la soirée ---------- */
const MO_SOON=75*60e3,MO_MORNING=11;
function homeMoment(){
  const now=Date.now(),dk=dayKeyL(new Date()),dayOf=x=>dayKeyL(new Date(x.start)),ok=x=>x.t1&&x.t2;
  const live=MATCHES.find(x=>x.state==="live")||MATCHES.find(x=>x.state==="wait"),next=MATCHES.find(x=>x.state==="soon"&&ok(x))||null;
  let last=null;for(let i=MATCHES.length-1;i>=0;i--)if(MATCHES[i].winner&&ok(MATCHES[i])){last=MATCHES[i];break}
  const ldk=last&&dayOf(last),recent=ldk&&(ldk===dk||ldk===dayKeyL(new Date(now-864e5)))&&MATCHES.every(x=>!ok(x)||x.winner||dayOf(x)!==ldk)?ldk:null;
  if(live)return {k:"live",m:live,recent:null,next};
  if(next&&new Date(next.start)-now<MO_SOON)return {k:"soon",m:next,recent,next};
  if(recent&&(recent===dk||new Date().getHours()<MO_MORNING))return {k:"after",m:next,recent,next};
  return {k:MATCHES.some(x=>ok(x)&&dayOf(x)===dk)?"day":"rest",m:next,recent,next}}
function whoWinsCard(n=4){const R=RKX(),W=R&&R.W,S=SJ&&SJ.sim;if(!W||!W.fav||MATCHES.some(m=>m.stage==="f"&&m.winner))return"";
  const L=[W.fav,...W.ch].slice(0,n),mx=Math.max(...L.map(x=>x.p[0]))||1;
  return sec("Qui va gagner ?",`<button class="more" data-go="win">Tout voir</button>`)+`<div class="grp">${L.map((x,i)=>`<button class="wr" data-go="t/${esc(x.t)}"><span>${logo(x.t,26)}</span><span class="tx"><b>${esc(x.t)}</b><small>${i===0?"favori du robot":"challenger"}</small></span><span class="br"><i style="width:${(x.p[0]/mx*100).toFixed(1)}%;background:${col(x.t)}"></i></span><em>${pc(x.p[0])}</em></button>`).join("")}</div>`}
function explore(){const n=MATCHES.filter(m=>m.t1&&m.t2).length,left=MATCHES.filter(m=>m.state==="soon").length;
  const r=(go,ic,t,s)=>`<button class="row ind" data-go="${go}"><span class="ico">${ic}</span><span class="tx"><b>${t}</b>${s?`<small>${s}</small>`:""}</span>${IC.chev}</button>`;
  return sec("Explorer")+`<div class="grp">${r("cal",IC.cal,"Calendrier",`${plur(MATCHES.filter(m=>m.winner).length,"match joué","matchs joués")}, ${left} à venir`)}${r("rk/MID",IC.podium,"Classements par poste","les 19 titulaires de chaque poste")}${r("win",IC.cup,"Qui va gagner ?","simulation du robot")}${r("teams",IC.shield,"Équipes",`${TEAMS.filter(t=>status(t.id,records()).k!=="out").length} encore en lice`)}</div>`}
/* joueurs de la soirée (parties du robot, même formule que le podium de worlds.html) */
const FUN_W={kda:.35,k:.25,ds:.2,csm:.1,gd:.1},FUN_FL={kda:1.5,k:2,ds:.04,csm:.6,gd:500};
function nightLines(dk){const G=(SJ&&SJ.fu&&SJ.fu.g)||{},ids=new Set(MATCHES.filter(x=>x.winner&&dayKeyL(new Date(x.start))===dk).map(x=>String(x.id).slice(2))),out=[];
  Object.values(G).forEach(g=>{if(!ids.has(g[0]))return;const [,num,,b,r,ws,mn,,rows]=g;(rows||[]).forEach((x,i)=>{const sd=i<5?0:1;out.push({k:x[0],tm:sd?r:b,r:x[1],c:x[2],K:x[3],D:x[4],A:x[5],cs:x[6],mn,ds:x[7]==null?null:x[7]/1000,gd:x[8],w:ws===sd})})});return out}
function podium(lines){if(lines.length<10)return [];
  const V=x=>({kda:Math.min(20,(x.K+x.A)/Math.max(1,x.D)),k:x.K,ds:x.ds,csm:/^(TOP|MID|BOT)$/.test(x.r)&&x.mn>=15?x.cs/x.mn:null,gd:x.gd}),vals=lines.map(V),st={};
  Object.keys(FUN_W).forEach(m=>{const a=vals.map(v=>v[m]).filter(v=>v!=null&&isFinite(v)),mu=a.reduce((s,v)=>s+v,0)/Math.max(1,a.length);st[m]={mu,sd:Math.max(FUN_FL[m],Math.sqrt(a.reduce((s,v)=>s+(v-mu)**2,0)/Math.max(1,a.length)))}});
  const best=new Map();lines.forEach((x,i)=>{const z={};let s=x.w?.3:0;Object.keys(FUN_W).forEach(m=>{const v=vals[i][m];z[m]=v==null||!isFinite(v)?null:(v-st[m].mu)/st[m].sd;if(z[m]!=null)s+=FUN_W[m]*z[m]});
    const o={x,v:vals[i],z,s},b=best.get(x.k);if(!b||s>b.s)best.set(x.k,o)});
  return [...best.values()].sort((a,b)=>b.s-a.s).slice(0,3).map(o=>{o.why=Object.keys(FUN_W).filter(m=>o.z[m]!=null).sort((a,b)=>o.z[b]-o.z[a])[0]||"kda";return o})}
function nightCard(dk){const P=podium(nightLines(dk));if(!P.length)return"";
  const why=o=>o.why==="ds"?pcn(o.v.ds*100)+" des dégâts":o.why==="csm"?fx1(o.v.csm)+" cs/min":o.why==="gd"?`+${kk(o.v.gd)} à 15 min`:`${o.x.K}/${o.x.D}/${o.x.A}`;
  return sec("Joueurs de la soirée")+`<div class="grp">${P.map((o,i)=>{const p=P_(o.x.k);return `<button class="row" ${p?`data-go="p/${p.key}"`:""}><span class="disp" style="font-size:22px;width:16px;color:${i?"var(--t2)":"var(--tint2)"}">${i+1}</span>${p?photo(p,40):""}<span class="tx"><b>${esc(p?p.id:o.x.k)}</b><small>${esc(o.x.tm)} · ${esc(champName(o.x.c))}${o.why==="kda"||o.why==="k"?"":` · ${o.x.K}/${o.x.D}/${o.x.A}`}</small></span><span class="vl">${esc(why(o))}</span>${IC.chev}</button>`}).join("")}</div>`}

/* ===================== DIRECT : repeint toutes les 10 s, seulement ce qui est à l'écran ===================== */
function paintLive(m){if(!m)return;if(NAV.anim){clearTimeout(paintLive.t);paintLive.t=setTimeout(()=>paintLive(m),420);return}   // pas de repeinture pendant une transition
  document.querySelectorAll(`[data-hud="${CSS.escape(m.key)}"]`).forEach(el=>setHTML(el,safe(()=>hudHTML(m))));
  const s=topScr();if(s&&s.k==="m"&&s.a===m.id&&s.pane&&(m.state==="live"||m.state==="wait")&&["jo","fil","dr"].includes(s.seg))setHTML(s.pane,safe(()=>s.R.pane(s,s.seg)))}
function ensureWatch(){const s=topScr();let m=null;
  if(s&&s.k==="m"){const x=findM(s.a);if(x&&(x.state==="live"||x.state==="wait"))m=x}
  if(!m)m=MATCHES.find(x=>x.state==="live")||MATCHES.find(x=>x.state==="wait")||null;
  watchLive(m)}
/* nouvelles données (synchro) : chaque écran se met à jour, sans bouger */
function onData(){refreshAll();ensureWatch()}

/* ===================== démarrage ===================== */
(function boot(){
  const want=parseRoute(location.hash),raw=String(location.hash||"").replace(/^#\/?/,"");
  history.replaceState({d:0,r:""},"",location.pathname+location.search+"#");
  go("",{noHist:true,instant:true});
  if(want.k!=="home"&&ROUTES[want.k])go(raw,{instant:true});
  champMap().then(()=>refreshAll());
  loadSJ().then(()=>{refreshAll();ensureWatch()});
  sync();
  const idle=window.requestIdleCallback||(f=>setTimeout(f,1500));
  setTimeout(()=>idle(()=>{need("fj");need("dj")}),2500);
  addEventListener("online",()=>sync());
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&lastSync&&Date.now()-lastSync>60e3)sync()});
})();
window.__designA={NAV,MATCHES:()=>MATCHES,go,LV,version:"A-1, 25/10/2026"};
