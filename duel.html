<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Duel de Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{--accent:#5B9BD5;--accent-dark:#356089;}
  .q-box{background:var(--panel);border:1px solid var(--gold);max-width:440px;width:100%;margin:8px auto 14px;
    padding:18px 16px;text-align:center;font-size:1.1rem;line-height:1.5;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
  .opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;margin:0 auto;}
  .opt{background:var(--panel);border:1px solid rgba(200,170,110,.4);color:var(--ink);cursor:pointer;
    padding:15px;font-size:.95rem;font-family:inherit;text-align:center;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
  .opt.sel{border-color:var(--accent);background:var(--panel2);}
  .opt.good{border-color:var(--ok);background:rgba(61,214,140,.15);}
  .opt.bad{border-color:var(--danger);background:rgba(225,90,76,.15);}
  .opt:disabled{cursor:default;}
</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">‹</a><div class="rune"></div><h1>Duel de Culture</h1><div class="rune"></div></div>
<div class="wrap" id="wrap"></div>
<footer class="note">10 questions par manche — le meilleur score gagne.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="net.js"></script>
<script src="themes.js"></script>
<script src="gamedata.js"></script>
<script src="duo.js"></script>
<script>
(function(){
  const GAME="duel", ROUND_Q=10;
  const DATA = GDATA.quizduel, META = Duo.META, $ = Duo.$;
  const screen = Duo.screen, stepper = Duo.stepper;

  let players=[], myName="", theme=null, started=false, roomCode="";
  let quiz=null; // {list, idx, answers:{pid:optIndex}, done}

  function shuffleQuestion(item){
    const idxs = UI.shuffle([0,1,2,3]);
    return { q:item.q, opts:idxs.map(i=>item.a[i]), correct:idxs.indexOf(0) };
  }
  function buildQuiz(th){ return UI.shuffle(DATA[th].slice()).slice(0,ROUND_Q).map(shuffleQuestion); }

  /* ─ ACCUEIL ─ */
  function sHome(){
    players=[]; started=false; quiz=null; Net.destroy();
    screen(`<div class="center">
      <div class="eyebrow">2 joueurs ou plus</div>
      <h2 class="big">Duel de Culture</h2>
      <p class="sub">10 questions à choix multiple. Chacun répond de son côté, 1 point par bonne réponse. Le meilleur score l'emporte.</p>
      ${stepper(1,4)}
      <p class="sub" style="margin-bottom:10px;"><b>Vous jouez comment ?</b></p>
      <div class="choice-col">
        <button class="choice accent" id="c-net"><div class="c-title">📱📱 Chacun son téléphone</div><div class="c-sub">Chacun répond en secret.</div></button>
        <button class="choice" id="c-solo"><div class="c-title">📱 Tous sur ce téléphone</div><div class="c-sub">On se passe le téléphone à chaque question.</div></button>
      </div></div>`);
    $("c-net").onclick = sNetChoice;
    $("c-solo").onclick = sSoloPlayers;
  }
  function sNetChoice(){
    screen(`<div class="center">${stepper(2,4)}
      <p class="sub" style="margin-bottom:10px;"><b>Un joueur crée, les autres rejoignent.</b></p>
      <div class="choice-col">
        <button class="choice accent" id="cc"><div class="c-title">➕ Créer la partie</div><div class="c-sub">Tu obtiens un code.</div></button>
        <button class="choice" id="cj"><div class="c-title">🔑 Rejoindre</div><div class="c-sub">On t'a donné un code ?</div></button>
      </div>
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="cb">Retour</button></div></div>`);
    $("cc").onclick=()=>sName(false); $("cj").onclick=()=>sName(true); $("cb").onclick=sHome;
  }
  function sName(joining){
    screen(`<div class="center">${stepper(3,4)}
      <div class="eyebrow">${joining?"Rejoindre":"Créer la partie"}</div>
      <h2 class="big">Ton prénom ?</h2>
      <input class="field" id="fn" maxlength="14" placeholder="Prénom">
      ${joining?`<p class="sub" style="margin:4px 0 2px;">…et le code de l'hôte :</p>
      <input class="field code" id="fc" maxlength="4" autocapitalize="characters" placeholder="XXXX">`:""}
      <div class="btn-row"><button class="btn ghost" id="fb">Retour</button>
        <button class="btn primary" id="fg" disabled>${joining?"Rejoindre":"Créer"}</button></div></div>`);
    const ck=()=>{ const okN=$("fn").value.trim().length>=2, okC=!joining||($("fc")&&$("fc").value.length===4); $("fg").disabled=!(okN&&okC); };
    $("fn").addEventListener("input",ck);
    if (joining) $("fc").addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); ck(); });
    $("fb").onclick=sNetChoice;
    $("fg").onclick=()=>{ myName=$("fn").value.trim(); $("fg").disabled=true; joining?doJoin($("fc").value):doCreate(); };
  }
  function doCreate(){
    Net.create(GAME,{
      onOpen:code=>{ roomCode=code; players=[{id:"H",name:myName,score:0}]; sLobby(); },
      onData:(id,d)=>{
        if(d&&d.t==="hello"){ if(started){Net.sendTo(id,{t:"late"});return;} players.push({id,name:Duo.uniqueName(players,d.name),score:0}); syncLobby(); }
        else if(d&&d.t==="answer") hostAnswer(id,d.opt);
      },
      onLeave:id=>{ const p=players.find(x=>x.id===id); players=players.filter(x=>x.id!==id); if(p)UI.banner(`${p.name} s'est déconnecté.`,true); if(!started)syncLobby(); else if(quiz&&!quiz.done)checkAll(); },
      onError:()=>UI.banner("Erreur de connexion. Recharge la page.",true,6000),
    });
  }
  function sLobby(){
    screen(`<div class="center">${stepper(4,4)}
      <div class="eyebrow">Salon ouvert</div><h2 class="big">Fais rejoindre les autres</h2>
      <div class="code-box">${roomCode}</div>
      <p class="sub">Chacun : même lien → Duel de Culture → <b>Chacun son téléphone</b> → <b>Rejoindre</b> → prénom + ce code.</p>
      <div class="list" id="ll"></div><div class="status" id="ls"></div>
      <div class="btn-row"><button class="btn primary" id="lg" disabled>Choisir le thème ➜</button></div></div>`);
    $("lg").onclick=sThemeHost; syncLobby();
  }
  function syncLobby(){
    Net.broadcast({t:"lobby",players:players.map(p=>({name:p.name,score:p.score}))});
    const l=$("ll"); if(!l)return;
    l.innerHTML=players.map(p=>`<div class="item${p.name===myName?" me":""}"><span>${UI.esc(p.name)}</span><span class="tag">${p.id==="H"?"hôte":"✓"}</span></div>`).join("");
    const st=$("ls"),b=$("lg");
    if(st)st.textContent=players.length<2?`${players.length}/2 joueurs minimum`:`${players.length} joueurs — prêt !`;
    if(b)b.disabled=players.length<2;
  }
  function doJoin(code){
    Net.join(GAME,code,{
      onOpen:()=>{ Net.send({t:"hello",name:myName}); guestWait(); },
      onData:guestData,
      onLeave:()=>UI.banner("L'hôte s'est déconnecté — partie terminée.",true,7000),
      onError:()=>{ screen(`<div class="center"><div class="eyebrow">Oups</div><h2 class="big">Connexion impossible</h2><p class="sub">Vérifie le code et que l'hôte est sur l'écran de son salon.</p><div class="btn-row"><button class="btn primary" id="rt">Réessayer</button></div></div>`); $("rt").onclick=sNetChoice; },
    });
  }
  function guestWait(){ screen(`<div class="center">${stepper(4,4)}<div class="eyebrow">Connecté !</div><h2 class="big">Bien reçu, ${UI.esc(myName)}</h2><div class="list" id="ll"></div><p class="sub">En attente que l'hôte lance…</p></div>`); }
  function guestData(_,d){
    if(!d||!d.t)return;
    if(d.t==="lobby"){ const l=$("ll"); if(l)l.innerHTML=d.players.map(p=>`<div class="item${p.name===myName?" me":""}"><span>${UI.esc(p.name)}</span><span class="tag">${p.score} pts</span></div>`).join(""); }
    if(d.t==="wait")guestWait();
    if(d.t==="q"){ started=true; theme=d.theme; sQuestion(d,false); }
    if(d.t==="waitcount")setWait(d.remaining);
    if(d.t==="qreveal")sQReveal(d,false);
    if(d.t==="final")sFinal(d,false);
  }
  function sThemeHost(){
    screen(`<div class="center"><div class="eyebrow">Thème</div><h2 class="big">Choisis le thème</h2>
      <p class="sub">10 questions tirées au hasard.</p>${Duo.themeGrid()}
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="tb">Retour au salon</button></div></div>`);
    document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>{ theme=b.dataset.th; started=true; hostStart(); });
    $("tb").onclick=sLobby;
  }

  /* ─ QUIZ (hôte) ─ */
  function hostStart(){ players.forEach(p=>p.score=0); quiz={list:buildQuiz(theme),idx:0,answers:{},done:false}; pushQ(); }
  function pushQ(){ quiz.answers={}; const p=qPayload(); Net.broadcast(p); sQuestion(p,true); }
  const qPayload=()=>({t:"q",theme,idx:quiz.idx,total:quiz.list.length,q:quiz.list[quiz.idx].q,opts:quiz.list[quiz.idx].opts});
  function hostAnswer(pid,opt){ if(!quiz||quiz.answers[pid]!==undefined)return; quiz.answers[pid]=opt; checkAll(); }
  function checkAll(){
    const rem=players.length-Object.keys(quiz.answers).filter(k=>players.some(p=>p.id===k)).length;
    Net.broadcast({t:"waitcount",remaining:rem}); setWait(rem);
    if(rem<=0)hostReveal();
  }
  function hostReveal(){
    const correct=quiz.list[quiz.idx].correct;
    const rows=players.map(p=>{ const a=quiz.answers[p.id]; const ok=a===correct; if(ok)p.score++; return {name:p.name,ok,ans:a===undefined?null:quiz.list[quiz.idx].opts[a]}; });
    Net.broadcast({t:"qreveal",correctText:quiz.list[quiz.idx].opts[correct],rows,scores:players.map(p=>({name:p.name,score:p.score})),last:quiz.idx>=quiz.list.length-1});
    sQReveal({correctText:quiz.list[quiz.idx].opts[correct],rows,scores:players.map(p=>({name:p.name,score:p.score})),last:quiz.idx>=quiz.list.length-1},true);
  }
  function hostNext(){ if(quiz.idx>=quiz.list.length-1){ quiz.done=true; const fin={t:"final",scores:players.map(p=>({name:p.name,score:p.score}))}; Net.broadcast(fin); sFinal(fin,true);} else { quiz.idx++; pushQ(); } }

  /* ─ AFFICHAGE ─ */
  let answered=false;
  function sQuestion(d,isHost){
    answered=false;
    screen(`<div class="center" style="justify-content:flex-start;">
      <div class="eyebrow">Thème : ${META[d.theme].label} · Question ${d.idx+1}/${d.total}</div>
      <div class="q-box">${UI.esc(d.q)}</div>
      <div class="opts" id="op"></div>
      <div class="status" id="ws" style="margin-top:12px;">Réponds — le résultat s'affiche quand tout le monde a répondu.</div></div>`);
    d.opts.forEach((o,i)=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o;
      b.onclick=()=>{ if(answered)return; answered=true;
        document.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("sel");
        $("ws").textContent="✓ Réponse envoyée — on attend les autres…"; $("ws").className="status ok";
        if(Net.isHost())hostAnswer("H",i); else Net.send({t:"answer",opt:i});
      };
      $("op").appendChild(b);
    });
  }
  function setWait(r){ const s=$("ws"); if(s&&answered)s.textContent=r>0?`✓ Réponse envoyée — encore ${r} joueur${r>1?"s":""}…`:"Résultats…"; }
  function sQReveal(d,isHost){
    screen(`<div class="center">
      <div class="eyebrow">Résultat</div>
      <h2 class="big" style="font-size:1.15rem;">Bonne réponse : ${UI.esc(d.correctText)}</h2>
      <div class="reveal-list" style="width:100%;max-width:360px;margin:12px auto;">${d.rows.map(r=>
        `<div class="r ${r.ok?"good":"bad"}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid ${r.ok?"var(--ok)":"rgba(225,90,76,.5)"};margin-bottom:6px;">
          <span>${UI.esc(r.name)}</span><span style="color:var(--text);font-style:italic;">${r.ans?"« "+UI.esc(r.ans)+" »":"(rien)"}</span><span>${r.ok?"✅":"❌"}</span></div>`).join("")}</div>
      <div class="scores">${Duo.scoresHtml(d.scores)}</div>
      ${isHost?`<div class="btn-row"><button class="btn primary" id="nx">${d.last?"Voir le résultat final ➜":"Question suivante ➜"}</button></div>`:`<div class="status">L'hôte continue…</div>`}</div>`);
    if(isHost)$("nx").onclick=hostNext;
  }
  function sFinal(d,isHost){
    const sorted=d.scores.slice().sort((a,b)=>b.score-a.score);
    const top=sorted[0].score, winners=sorted.filter(s=>s.score===top).map(s=>s.name);
    screen(`<div class="center">
      <div class="eyebrow">Fin de la partie</div>
      <h2 class="big">${winners.length>1?"Égalité !":"🏆 "+UI.esc(winners[0])+" gagne !"}</h2>
      ${winners.length>1?`<p class="sub">${winners.map(UI.esc).join(", ")} terminent à égalité (${top} pts).</p>`:""}
      <div class="scores">${Duo.scoresHtml(d.scores)}</div>
      ${isHost?`<div class="btn-row"><button class="btn primary" id="rn">Rejouer (même thème)</button><button class="btn ghost" id="rt">Changer de thème</button></div>`:`<div class="status">L'hôte peut relancer.</div>`}
      <div class="btn-row"><a class="btn ghost" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;">Autres jeux</a></div></div>`);
    if(isHost){ $("rn").onclick=hostStart; $("rt").onclick=sThemeHost; }
  }

  /* ─ SOLO ─ */
  let solo=null;
  function sSoloPlayers(){
    solo={names:[],scores:{},list:null,idx:0};
    screen(`<div class="center">${stepper(2,4)}
      <div class="eyebrow">1 téléphone</div><h2 class="big">Qui joue ?</h2>
      <p class="sub">Au moins 2 prénoms. On se passe le téléphone à chaque question.</p>
      <input class="field" id="sn" maxlength="14" placeholder="Prénom">
      <div class="btn-row" style="margin-bottom:10px;"><button class="btn ghost" id="sa">+ Ajouter</button></div>
      <div class="list" id="sl"></div>
      <div class="btn-row"><button class="btn ghost" id="sb">Retour</button><button class="btn primary" id="sg" disabled>Choisir le thème ➜</button></div></div>`);
    const add=()=>{ const n=$("sn").value.trim(); if(n.length<2)return; let name=n,i=2; while(solo.names.includes(name))name=n+" "+(i++); solo.names.push(name); solo.scores[name]=0; $("sn").value=""; $("sl").innerHTML=solo.names.map(x=>`<div class="item"><span>${UI.esc(x)}</span></div>`).join(""); $("sg").disabled=solo.names.length<2; $("sn").focus(); };
    $("sa").onclick=add; $("sn").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
    $("sb").onclick=sHome; $("sg").onclick=sSoloTheme;
  }
  function sSoloTheme(){
    screen(`<div class="center">${stepper(3,4)}<div class="eyebrow">Thème</div><h2 class="big">Choisissez le thème</h2>${Duo.themeGrid()}
      <div class="btn-row" style="margin-top:16px;"><button class="btn ghost" id="stb">Retour</button></div></div>`);
    document.querySelectorAll(".theme-btn").forEach(b=>b.onclick=()=>{ theme=b.dataset.th; solo.list=buildQuiz(theme); solo.idx=0; solo.names.forEach(n=>solo.scores[n]=0); soloPass(); });
    $("stb").onclick=sSoloPlayers;
  }
  function soloPass(){
    if(solo.idx>=solo.list.length){ soloFinal(); return; }
    screen(`<div class="center"><div class="eyebrow">Question ${solo.idx+1}/${solo.list.length}</div>
      <h2 class="big">Chacun son tour</h2>
      <p class="sub">Passez le téléphone. Chaque joueur répond à cette question.</p>
      <div class="btn-row"><button class="btn primary" id="go">Voir la question ➜</button></div></div>`);
    $("go").onclick=()=>soloAsk(0,{});
  }
  function soloAsk(pi,res){
    if(pi>=solo.names.length){ // corriger
      const correct=solo.list[solo.idx].correct;
      solo.names.forEach(n=>{ if(res[n]===correct)solo.scores[n]++; });
      soloReveal(res);
      return;
    }
    const who=solo.names[pi], item=solo.list[solo.idx];
    screen(`<div class="center" style="justify-content:flex-start;">
      <div class="eyebrow">${UI.esc(who)}, à toi</div>
      <div class="q-box">${UI.esc(item.q)}</div>
      <div class="opts" id="op"></div></div>`);
    item.opts.forEach((o,i)=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o; b.onclick=()=>{ res[who]=i; soloAsk(pi+1,res); }; $("op").appendChild(b); });
  }
  function soloReveal(res){
    const item=solo.list[solo.idx];
    screen(`<div class="center"><div class="eyebrow">Résultat</div>
      <h2 class="big" style="font-size:1.15rem;">Bonne réponse : ${UI.esc(item.opts[item.correct])}</h2>
      <div class="reveal-list" style="width:100%;max-width:360px;margin:12px auto;">${solo.names.map(n=>{ const ok=res[n]===item.correct; return `<div style="display:flex;justify-content:space-between;padding:10px 12px;background:var(--panel);border:1px solid ${ok?"var(--ok)":"rgba(225,90,76,.5)"};margin-bottom:6px;"><span>${UI.esc(n)}</span><span style="font-style:italic;color:var(--text);">« ${UI.esc(item.opts[res[n]])} »</span><span>${ok?"✅":"❌"}</span></div>`; }).join("")}</div>
      <div class="scores">${solo.names.slice().sort((a,b)=>solo.scores[b]-solo.scores[a]).map((n,i)=>`<div class="row${i===0&&solo.scores[n]>0?" top":""}"><span>${UI.esc(n)}</span><span class="pts">${solo.scores[n]} pts</span></div>`).join("")}</div>
      <div class="btn-row"><button class="btn primary" id="nx">${solo.idx>=solo.list.length-1?"Résultat final ➜":"Question suivante ➜"}</button></div></div>`);
    $("nx").onclick=()=>{ solo.idx++; soloPass(); };
  }
  function soloFinal(){
    const sorted=solo.names.slice().sort((a,b)=>solo.scores[b]-solo.scores[a]);
    const top=solo.scores[sorted[0]], winners=sorted.filter(n=>solo.scores[n]===top);
    screen(`<div class="center"><div class="eyebrow">Fin de la partie</div>
      <h2 class="big">${winners.length>1?"Égalité !":"🏆 "+UI.esc(winners[0])+" gagne !"}</h2>
      <div class="scores">${sorted.map((n,i)=>`<div class="row${i===0?" top":""}"><span>${UI.esc(n)}</span><span class="pts">${solo.scores[n]} pts</span></div>`).join("")}</div>
      <div class="btn-row"><button class="btn primary" id="rn">Rejouer (même thème)</button><button class="btn ghost" id="rt">Changer de thème</button></div>
      <div class="btn-row"><a class="btn ghost" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;">Autres jeux</a></div></div>`);
    $("rn").onclick=()=>{ solo.list=buildQuiz(theme); solo.idx=0; solo.names.forEach(n=>solo.scores[n]=0); soloPass(); };
    $("rt").onclick=sSoloTheme;
  }

  sHome();
})();
</script>
</body>
</html>
